  updateSaveMsg();
}
function updateSaveMsg(){ const m = $("#saveMsg"); if (!m) return; const d = dirty(); m.textContent = d ? "لديكِ تغييرات غير منشورة" : "كل التغييرات منشورة"; m.className = "msg " + (d ? "dirty" : ""); }
function bindSettings(){
  const D = DRAFT;
  $$("[data-tab]").forEach(b => b.onclick = () => { TAB = b.dataset.tab; renderSettings(); });
  $$("[data-k]").forEach(el => {
    const ev = el.type === "checkbox" || el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(ev, () => {
      const v = el.type === "checkbox" ? el.checked : el.value;
      setPath(D, el.dataset.k, v);
      if (el.dataset.k === "site.palette") document.documentElement.dataset.palette = v;
      updateSaveMsg();
    });
  });
  $$("[data-all]").forEach(el => el.onchange = () => {
    const pre = el.dataset.all, list = $(`[data-list="${pre}"]`);
    list.hidden = el.checked;
    setPath(D, pre + ".lessons", el.checked ? "all" : $$(`[data-ls="${pre}"]:checked`).map(x => x.value));
    updateSaveMsg();
  });
  $$("[data-ls]").forEach(el => el.onchange = () => { const pre = el.dataset.ls; setPath(D, pre + ".lessons", $$(`[data-ls="${pre}"]:checked`).map(x => x.value)); updateSaveMsg(); });
  $$("[data-praise]").forEach(el => el.oninput = () => { D.quiz.praise[el.dataset.praise] = el.value.split("\n").map(s => s.trim()).filter(Boolean); updateSaveMsg(); });
  // quiz editor
  const qsel = $("#qsel");
  if (qsel){
    qsel.onchange = () => { QL = qsel.value; renderSettings(); };
    const ensure = () => { const base = LESSONS.find(x => x.id === QL); D.lessons[QL] = D.lessons[QL] || {}; if (!D.lessons[QL].quiz) D.lessons[QL].quiz = clone(base.quiz); return D.lessons[QL].quiz; };
    $$("[data-q]").forEach(el => el.addEventListener(el.tagName === "SELECT" ? "change" : "input", () => {
      const qz = ensure(); let v = el.value;
      if (el.dataset.bool) v = v === "true"; if (el.dataset.num) v = Number(v);
      setPath(qz, el.dataset.q, v); updateSaveMsg();
    }));
    $("#qreset").onclick = () => { if (D.lessons[QL]) delete D.lessons[QL].quiz; renderSettings(); };
  }
  // lessons: uploads
  $$("[data-up]").forEach(el => el.onchange = async () => {
    const f = el.files[0], id = el.dataset.up, st = $("#up_" + id); if (!f) return;
    if (f.size > 20*1024*1024){ st.textContent = "الملف أكبر من ٢٠ ميجا، استخدمي رابط يوتيوب."; return; }
    st.textContent = "جارٍ الرفع…";
    try { const r = await ASSETS.upload(f); setPath(D, `lessons.${id}.asset`, r.id); st.textContent = "تم الرفع ✓ اضغطي «حفظ ونشر» ليظهر للطالبات."; updateSaveMsg(); }
    catch(e){ st.textContent = "تعذر الرفع: " + (e?.message || "حاولي مرة أخرى"); }
  });
  $$("[data-unasset]").forEach(b => b.onclick = () => { delete D.lessons[b.dataset.unasset].asset; renderSettings(); });
  // members
  const add = (name, group) => D.members.push({ id:uid(), name, group, code:genCode(), lessons:"all", video:true, map:true, quiz:true, retry:true });
  if ($("#add1")) $("#add1").onclick = () => { const n = $("#nm1").value.trim(); if (!n) return $("#nm1").focus(); add(n, $("#gr1").value.trim()); renderSettings(); };
  if ($("#addMany")) $("#addMany").onclick = () => { const g = $("#grMany").value.trim(); $("#nmMany").value.split("\n").map(s => s.trim()).filter(Boolean).forEach(n => add(n, g)); renderSettings(); };
  $$("[data-delm]").forEach(b => b.onclick = () => { D.members.splice(+b.dataset.delm, 1); renderSettings(); });
  $$("[data-newcode]").forEach(b => b.onclick = () => { D.members[+b.dataset.newcode].code = genCode(); renderSettings(); });
  $$("[data-prev]").forEach(b => b.onclick = () => { const m = D.members[+b.dataset.prev]; if (!ST.members.find(x => x.id === m.id)) { $("#saveMsg").textContent = "احفظي الطالبة أولاً ثم عايني."; return; } PREVIEW = { mid:m.id, label:m.name }; location.hash = "home"; route(); });
  if ($("#pvGuest")) $("#pvGuest").onclick = () => { PREVIEW = { mid:null, label:"طالبة بدون رمز" }; location.hash = "home"; route(); };
  $$("[data-pvm]").forEach(b => b.onclick = () => { const m = ST.members[+b.dataset.pvm]; PREVIEW = { mid:m.id, label:m.name }; location.hash = "home"; route(); });
  if ($("#setPass")) $("#setPass").onclick = () => { const v = $("#newPass").value; if (v.length < 6) { $("#passMsg").textContent = "اكتبي ٦ أحرف على الأقل."; return; } D.teacherPass = hashPass(v); $("#passMsg").textContent = "اعتُمدت كلمة المرور. اضغطي «حفظ ونشر» لتنزيل الملف بها."; SESS.k = D.teacherPass; lsSet("tajweed-session", SESS); updateSaveMsg(); };
  if ($("#gsCopy")) $("#gsCopy").onclick = async () => {
    const ta = $("#gsCode"); ta.value = typeof GS_CODE === "string" ? GS_CODE : "";
    try { await navigator.clipboard.writeText(ta.value); $("#gsMsg").textContent = "نُسخ السكربت ✓"; }
    catch(e){ ta.hidden = false; ta.focus(); ta.select(); $("#gsMsg").textContent = "حدّدتُ السكربت في المربع، انسخيه يدوياً."; }
  };
  if ($("#cUrl")) $("#cUrl").oninput = () => { D.cloud.url = $("#cUrl").value.trim(); $("#cMsg").textContent = D.cloud.url && !cloudUrl(D) ? "الرابط يجب أن يبدأ بـ https://script.google.com/" : ""; updateSaveMsg(); };
  if ($("#cTest")) $("#cTest").onclick = async () => {
    const cu = cloudUrl(D), m = $("#cMsg");
    if (!cu){ m.textContent = "الصقي رابط تطبيق الويب أولاً."; return; }
    m.textContent = "جارٍ الاختبار…";
    try {
      const r = await cloudCall(cu, null, 15000);
      if (!r?.ok){ m.textContent = "وصل الرد لكن بشكل غير متوقع، تأكدي من لصق السكربت كاملاً."; return; }
      const pass = $("#cPass").value;
      const c = await cloudCall(cu, { action:"check", pass });
      if (!c?.ok){ m.textContent = "الاتصال ناجح لكن كلمة المرور لا تطابق المكتوبة في السكربت."; return; }
      SESS.p = pass; lsSet("tajweed-session", SESS);
      m.textContent = "✓ الاتصال وكلمة المرور صحيحان. اضغطي «حفظ» لإكمال التفعيل.";
    }
    catch(e){ m.textContent = "تعذر الاتصال. تأكدي أن «من يمكنه الوصول» = أي شخص، وأن الرابط ينتهي بـ /exec."; }
  };
  bindDash(D);
  $("#discard").onclick = () => { DRAFT = clone(ST); rebuildLessons(DRAFT); document.documentElement.dataset.palette = ST.site.palette; renderSettings(); };
  $("#saveAll").onclick = async () => {
    const codes = D.members.map(m => String(m.code).trim());
    if (codes.some(c => !c) || new Set(codes).size !== codes.length){ const m = $("#saveMsg"); m.textContent = "يوجد رمز فارغ أو مكرر بين الطالبات، صحّحيه قبل الحفظ."; m.className = "msg dirty"; return; }
    await publish(DRAFT, $("#saveMsg"));
  };
}

/* ================= results dashboard & student pages ================= */
const safeJSON = t => { try { return JSON.parse(t); } catch(e) { return []; } };
function aggregate(rows, D){
  const map = new Map();
  (D.members || []).forEach(m => map.set(m.id, { key:m.id, name:m.name, group:m.group || "", member:m, att:[] }));
  (rows || []).forEach((r, n) => {
    const [time, name, group, lesson, score, wrong, mid, lid, attempt, details, device] = r;
    const key = mid ? mid : "g:" + String(name).trim() + "|" + device;
    if (!map.has(key)) map.set(key, { key, name, group: mid ? group : "بدون رمز", member:null, att:[] });
    const st = map.get(key);
    st.lastIdx = n;
    st.att.push({ time, lesson, lid, attempt: +attempt || 1, score: parseInt(String(score)) || 0, details: safeJSON(details), wrong });
  });
  return [...map.values()].map(st => {
    const per = {};
    st.att.forEach((a, n) => { const p = per[a.lid] = per[a.lid] || { best:0, count:0, last:"", lesson:a.lesson }; p.best = Math.max(p.best, a.score); p.count++; p.last = a.time; });
    const lids = Object.keys(per), avg = lids.length ? lids.reduce((x, k) => x + per[k].best, 0) / lids.length : 0;
    return { ...st, per, done: lids.length, avg, last: st.att.length ? st.att[st.att.length - 1].time : "", order: st.lastIdx ?? -1 };
  });
}
async function loadResults(force){
  if (RES && !force) return;
  RES_ERR = "";
  try { const r = await cloudCall(cloudUrl(DRAFT), { action:"results", pass: SESS?.p || "" });
    if (!r?.ok){ RES_ERR = r?.error === "pass" ? "اخرجي ثم ادخلي بكلمة مرور السكربت لعرض النتائج." : "تعذر تحميل النتائج."; RES = null; }
    else RES = r.rows || []; }
  catch(e){ RES_ERR = "تعذر الاتصال بمكان الحفظ، تحققي من الإنترنت."; RES = null; }
}
function dashHTML(D){
  if (!cloudUrl(D)) return `<div class="panel"><h3>النتائج تحتاج ربط الحفظ</h3><p class="vnote">بعد ربط الحفظ (مرة واحدة) تظهر هنا نتائج كل الطالبات وصفحة لكل طالبة بإجاباتها وتقدّمها.</p><div class="vrow"><button class="btn btn-main" type="button" data-tab="results">اذهبي إلى ربط الحفظ</button></div></div>`;
  if (!STANDALONE) return `<div class="secnote">النتائج تظهر في ملف الموقع المنشور على الاستضافة.</div>`;
  if (RES === null) return `<div class="panel"><p class="vnote" id="dashLoading">${RES_ERR ? `<span class="err">${esc(RES_ERR)}</span>` : "جارٍ تحميل النتائج…"}</p>${RES_ERR ? `<div class="vrow"><button class="btn btn-main" type="button" id="dashReload">إعادة المحاولة</button></div>` : ""}</div>`;
  const list = aggregate(RES, D);
  if (PROFILE) return profileHTML(list.find(x => x.key === PROFILE), D);
  const active = list.filter(x => x.att.length), tests = RES.length;
  const avgAll = active.length ? active.reduce((a, x) => a + x.avg, 0) / active.length : 0;
  const sorted = [...list].sort((a, b) => b.order - a.order);
  return `<div class="grid2">
    <div class="panel" style="gap:4px"><span class="vnote">طالبات اختبرن</span><b style="font-size:1.8rem;color:var(--plum)">${AR(active.length)}</b></div>
    <div class="panel" style="gap:4px"><span class="vnote">اختبارات منجزة</span><b style="font-size:1.8rem;color:var(--plum)">${AR(tests)}</b></div>
    <div class="panel" style="gap:4px"><span class="vnote">متوسط الدرجات</span><b style="font-size:1.8rem;color:var(--plum)">${AR(avgAll.toFixed(1))} / ٥</b></div></div>
   <div class="panel"><div class="vrow"><h3 style="flex:1">الطالبات</h3><button class="btn btn-soft" type="button" id="dashReload">تحديث</button></div>
    <input class="inp" id="dashQ" placeholder="ابحثي باسم الطالبة أو الصف">
    ${list.length ? `<div class="scroll"><table class="t" id="dashT"><tr><th>الطالبة</th><th>الصف</th><th>دروس مختبرة</th><th>المتوسط</th><th>المحاولات</th><th>آخر نشاط</th><th></th></tr>
    ${sorted.map(x => `<tr data-row="${esc((x.name + " " + x.group).toLowerCase())}"><td><b>${esc(x.name)}</b>${x.member ? ` <span class="code">${esc(x.member.code)}</span>` : ""}</td><td>${esc(x.group || "—")}</td><td>${AR(x.done)} / ${AR(LESSONS.length)}</td>
      <td>${x.done ? AR(x.avg.toFixed(1)) + " / ٥" : "—"}</td><td>${AR(x.att.length)}</td><td>${esc(x.last || "لم تختبر بعد")}</td><td><button class="btn btn-soft" type="button" data-prof="${esc(x.key)}">عرض</button></td></tr>`).join("")}</table></div>`
    : `<p class="vnote">لا توجد طالبات أو نتائج بعد.</p>`}</div>`;
}
function profileHTML(x, D){
  if (!x) return `<div class="panel"><p class="vnote">لا توجد نتائج لهذه الطالبة بعد.</p><div class="vrow"><button class="btn btn-soft" type="button" id="profBack">→ رجوع للنتائج</button></div></div>`;
  const m = x.member, p = m || D.guest;
  const allowed = LESSONS.map((L0, i) => i).filter(i => !(D.lessons[LESSONS[i].id] || {}).hidden && (p.lessons === "all" || (p.lessons || []).includes(LESSONS[i].id)));
  const atts = [...x.att].reverse();
  return `<div class="vrow"><button class="btn btn-soft" type="button" id="profBack">→ رجوع للنتائج</button></div>
   <div class="panel"><div class="vrow" style="align-items:center"><span class="chip-user" style="background:var(--lilac);color:var(--plum)"><span class="av" style="background:var(--grad-strong);color:#fff">${esc(String(x.name).trim()[0] || "؟")}</span></span>
     <div style="flex:1"><h3 style="font-size:1.5rem">${esc(x.name)}</h3><span class="vnote">${esc(x.group || "بدون صف")} · ${m ? `دخول برمز <span class="code">${esc(m.code)}</span>` : "دخلت باسمها بدون رمز"}</span></div></div>
     <div class="grid2">
      <div><span class="vnote">دروس مختبرة</span><br><b style="font-size:1.4rem;color:var(--plum)">${AR(x.done)} من ${AR(allowed.length)}</b></div>
      <div><span class="vnote">متوسط أفضل الدرجات</span><br><b style="font-size:1.4rem;color:var(--plum)">${x.done ? AR(x.avg.toFixed(1)) + " / ٥" : "—"}</b></div>
      <div><span class="vnote">عدد المحاولات</span><br><b style="font-size:1.4rem;color:var(--plum)">${AR(x.att.length)}</b></div>
      <div><span class="vnote">آخر نشاط</span><br><b>${esc(x.last || "—")}</b></div></div>
     ${m ? `<p class="vnote">الصلاحيات: ${m.lessons === "all" ? "كل الدروس" : AR(m.lessons.length) + " دروس"} · ${[m.video && "المقاطع", m.map && "الخريطة", m.quiz && "الاختبار", m.retry !== false && "إعادة الاختبار"].filter(Boolean).join("، ") || "لا شيء"}
       <button class="btn btn-soft" type="button" data-tab="members">تعديل بياناتها وصلاحياتها</button></p>` : ""}</div>
   <div class="panel"><h3>التقدّم في الدروس</h3><div class="prog">${allowed.map(i => { const L0 = LESSONS[i], pr = x.per[L0.id]; return `<div class="prow" style="cursor:default"><span>${AR(i+1)}. ${esc((D.lessons[L0.id] || {}).title || L0.t)}${pr ? ` <span class="vnote">(${AR(pr.count)} محاولة)</span>` : ""}</span><span class="bar"><i style="width:${(pr ? pr.best : 0) * 20}%"></i></span><b>${pr ? AR(pr.best) + "/٥" : "—"}</b></div>`; }).join("")}</div></div>
   <div class="panel"><h3>كل الاختبارات والإجابات</h3>${atts.length ? atts.map(a => `<details class="box"><summary>${esc(a.lesson)} · المحاولة ${AR(a.attempt)}<span class="tag ${a.score < 3 ? "off" : ""}">${AR(a.score)} / ٥</span></summary><div class="in">
     <span class="vnote">${esc(a.time)}</span>
     ${a.details && a.details.length ? `<div class="scroll"><table class="t"><tr><th>السؤال</th><th>إجابتها</th><th>الصحيح</th><th></th></tr>${a.details.map(d => `<tr><td>${esc(d.q)}</td><td>${esc(d.y)}</td><td>${esc(d.r)}</td><td style="color:${d.ok ? "var(--ok)" : "var(--bad)"};font-weight:800">${d.ok ? "✓" : "✗"}</td></tr>`).join("")}</table></div>` : `<p class="vnote">الأخطاء: ${esc(a.wrong || "")}</p>`}
   </div></details>`).join("") : `<p class="vnote">لم تختبر بعد.</p>`}</div>`;
}
function bindDash(D){
  if (TAB === "dash" && STANDALONE && cloudUrl(D) && RES === null && !RES_ERR){ loadResults().then(() => { if (TAB === "dash" && location.hash === "#settings") renderSettings(); }); }
  if ($("#dashReload")) $("#dashReload").onclick = async () => { RES = null; RES_ERR = ""; renderSettings(); };
  if ($("#dashQ")) $("#dashQ").oninput = () => { const q = $("#dashQ").value.trim().toLowerCase(); $$("#dashT tr[data-row]").forEach(tr => tr.hidden = q && !tr.dataset.row.includes(q)); };
  $$("[data-prof]").forEach(b => b.onclick = () => { PROFILE = b.dataset.prof; TAB = "dash"; renderSettings(); window.scrollTo(0, 0); });
  if ($("#profBack")) $("#profBack").onclick = () => { PROFILE = null; renderSettings(); };
  // lessons: add / delete custom lessons
  if ($("#nlAdd")) $("#nlAdd").onclick = () => {
    const t = $("#nlT").value.trim(), u = $("#nlU").value.trim() || "دروس إضافية";
    if (!t){ $("#nlMsg").textContent = "اكتبي عنوان الدرس."; return; }
    D.extra = D.extra || [];
    D.extra.push({ id: "c" + Date.now().toString(36), unit: u, t, yt: "أيمن سويد " + t,
      branches: [{ h: "تعريف " + t, b: "<p>اكتبي محتوى الفرع هنا من خلال «تحرير الخريطة».</p>" }],
      quiz: [
        { type:"tf", q:"عبارة صحيحة عن الدرس.", a:true, why:"" },
        { type:"tf", q:"عبارة خاطئة عن الدرس.", a:false, why:"" },
        { type:"mc", q:"سؤال اختيار من متعدد:", o:["الخيار الأول","الخيار الثاني","الخيار الثالث","الخيار الرابع"], a:0, why:"" },
        { type:"mc", q:"سؤال اختيار من متعدد آخر:", o:["الخيار الأول","الخيار الثاني","الخيار الثالث","الخيار الرابع"], a:1, why:"" },
        { type:"fill", q:"أكملي: ____ هو الجواب.", o:["الكلمة الصحيحة","كلمة خاطئة","كلمة خاطئة ٢","كلمة خاطئة ٣"], a:0, why:"" } ] });
    renderSettings(); $("#saveMsg").textContent = "أُضيف الدرس «" + t + "». اضغطي «حفظ» ليظهر للجميع."; $("#saveMsg").className = "msg dirty";
  };
  $$("[data-dell]").forEach(b => b.onclick = () => {
    if (b.dataset.confirm !== "1"){ b.dataset.confirm = "1"; b.textContent = "اضغطي مرة أخرى لتأكيد الحذف"; return; }
    D.extra = (D.extra || []).filter(x => x.id !== b.dataset.dell); delete D.lessons[b.dataset.dell];
    D.members.forEach(m => { if (Array.isArray(m.lessons)) m.lessons = m.lessons.filter(id => id !== b.dataset.dell); });
    if (Array.isArray(D.guest.lessons)) D.guest.lessons = D.guest.lessons.filter(id => id !== b.dataset.dell);
    renderSettings();
  });
}

/* ================= router ================= */
function route(){
  renderChrome();
  if (!SESS){ renderLogin(); return; }
  if (SESS.role === "teacher" && CAPS_DONE && !OWNER){ SESS = null; lsSet("tajweed-session", null); renderChrome(); renderLogin(); $("#tchErr").textContent = "هذا الجهاز ليس مسجّلاً بحساب المعلمة."; return; }
  const id = location.hash.slice(1);
  const idx = LESSONS.findIndex(l => l.id === id);
  if (id === "settings") renderSettings();
  else if (id === "progress") renderProgress();
  else if (idx >= 0 && visibleIdx().includes(idx)) renderLesson(idx);
  else { renderHome(); }
  if (id !== "settings"){ DRAFT = null; rebuildLessons(); }
  renderNav();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
window.addEventListener("beforeunload", e => { if (DRAFT && dirty()) { e.preventDefault(); } });
if (!window.claude?.use && cloudUrl()) $("#view").innerHTML = '<p class="vnote" style="text-align:center;padding-block:60px">جارٍ تحميل الموقع…</p>';
else route();
capsReady.then(route);
