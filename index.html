document.addEventListener("click", async e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act;
  if(a==="goto"){ S.idx=+b.dataset.i; S.railOpen=false; store.set("tj_idx",S.idx); if(S.view!=="deck"&&SD){ SD=null; applySite(SITE); } S.view="deck"; renderDeck(); const to=b.dataset.to&&document.getElementById(b.dataset.to); if(to) to.scrollIntoView({block:"start"}); else window.scrollTo({top:0}); }
  else if(a==="next"||a==="prev"){ const n=lessons().length; S.idx=Math.min(n-1,Math.max(0,S.idx+(a==="next"?1:-1))); store.set("tj_idx",S.idx); renderDeck(); window.scrollTo({top:0}); }
  else if(a==="rail"){ S.railOpen=!S.railOpen; $(".rail").classList.toggle("open",S.railOpen); const sc=$(".scrim"); if(sc) sc.hidden=!S.railOpen; }
  else if(a==="jump"){ const el=document.getElementById(b.dataset.to); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); }
  else if(a==="mmtoggle"){ const br=b.parentElement; br.classList.toggle("closed"); b.setAttribute("aria-expanded",!br.classList.contains("closed")); }
  else if(a==="ans"){ const L=lessons()[S.idx], st=qState(L.id); if(st.done) return; document.querySelectorAll("[data-fill]").forEach(el=>st.ans[+el.dataset.fill]=el.value); const v=b.dataset.v; st.ans[+b.dataset.k] = v==="true"?true:v==="false"?false:+v; const y=window.scrollY; renderDeck(); window.scrollTo({top:y}); }
  else if(a==="submit") submitQuiz();
  else if(a==="retry"){ const L=lessons()[S.idx]; S.quizState[L.id]={ans:{},done:false}; renderDeck(); document.getElementById("b-quiz").scrollIntoView({block:"start"}); }
  else if(a==="logout"){ S.gateRole=null; S.session=null; store.del("tj_session"); S.myRes={};
    ["tq","res","pw","my"].forEach(k=>{ if(subs[k]){ try{ subs[k](); }catch(err){} delete subs[k]; } });
    S.tq={}; S.pw={}; S.results=[]; if(S.db&&S.db.refresh) S.db.refresh(); go("gate"); }
  else if(a==="role"){ S.gateRole=b.dataset.r||null; renderGate(); const f=$("#stuSel")||$("#tchPw"); if(f&&!f.disabled) f.focus(); }
  else if(a==="guest"){ S.myRes=store.get("tj_guest")||{}; go("home"); }
  else if(a==="view"){ go(b.dataset.v); }
  else if(a==="ptab"){ if(S.panelTab==="settings"&&b.dataset.t!=="settings"){ SD=null; applySite(SITE); } S.panelTab=b.dataset.t; renderPanel(); }
  else if(a==="delStu"){ const id=b.dataset.id; if(S.confirmDel!==id){ S.confirmDel=id; renderPanel(); return; } S.confirmDel=null; try{ await S.db.doc("students/"+id).delete(); await S.db.doc("studentpw/"+id).delete(); toast("حُذفت الطالبة"); }catch(err){ toast("تعذر الحذف"); } }
  else if(a==="resetPw"){ const id=b.dataset.id, pw=String(Math.floor(1000+Math.random()*9000)); try{ await S.db.doc("students/"+id).update({hash:await sha(id+":"+pw), mustChange:true, resetAt:new Date().toISOString()}); await S.db.doc("studentpw/"+id).set({pw}); toast("كلمة المرور الجديدة: "+pw); }catch(err){ toast("تعذر التغيير"); } }
  else if(a==="edit"){ openEditor(lessons()[S.idx],false); }
  else if(a==="addLesson"){ const ls=lessons(); openEditor({id:uid("c"),unit:ls.length?ls[ls.length-1].unit:"",title:"",content:"## عنوان الفقرة الأولى\nاكتبي الشرح هنا.",map:"الفكرة المركزية\n- فرع\n  - تفصيل",quiz:[{t:"tf",q:"",a:true,ex:""},{t:"mc",q:"",o:["","","",""],a:0,ex:""},{t:"fill",q:"",a:[],ex:""}],order:(ls[ls.length-1]||{order:0}).order+1},true); }
  else if(a==="etab"){ readEditorFields(); ED.tab=b.dataset.t; drawEditor(); }
  else if(a==="qadd"){ readEditorFields(); (b.dataset.kind==="quiz"?ED.L.quiz:ED.tq).push({t:"mc",q:"",o:["","","",""],a:0,ex:""}); drawEditor(); }
  else if(a==="qdel"){ readEditorFields(); (b.dataset.kind==="quiz"?ED.L.quiz:ED.tq).splice(+b.dataset.k,1); drawEditor(); }
  else if(a==="rmVid"){ readEditorFields(); ED.L.video.url=""; ED.L.video.asset=""; drawEditor(); }
  else if(a==="saveLesson") saveLesson();
  else if(a==="close") closeModal();
  else if(a==="restore"){ if(!S.confirmRestore){ S.confirmRestore=true; drawEditor(); return; } try{ await S.db.doc("lessons/"+ED.L.id).delete(); delete S.over[ED.L.id]; closeModal(); renderDeck(); toast("استُعيد النص الأصلي"); }catch(err){ toast("تعذرت الاستعادة"); } }
  else if(a==="delLesson"){ if(!S.confirmDelLesson){ S.confirmDelLesson=true; drawEditor(); return; } try{ await S.db.doc("lessons/"+ED.L.id).delete(); delete S.over[ED.L.id]; S.idx=0; closeModal(); renderDeck(); toast("حُذف الدرس"); }catch(err){ toast("تعذر الحذف"); } }
  else if(a==="print") openPrint();
  else if(a==="myPw"){ if(window.openMyPw && !e.target.closest('[data-act="logout"]')) window.openMyPw(false); }
  else if(a==="preset"){ const p=PRESETS[+b.dataset.k]; SD.c1=p.c1; SD.c2=p.c2; sChanged(true); }
  else if(a==="sset"){ SD[b.dataset.k]=b.dataset.v; sChanged(true); }
  else if(a==="ssave") saveSite();
  else if(a==="sundo"){ SD={...SITE}; SD_DIRTY=false; S.confirmReset=false; applySite(SITE); const y=window.scrollY; renderPanel(); window.scrollTo({top:y}); }
  else if(a==="sreset"){ if(!S.confirmReset){ S.confirmReset=true; const y=window.scrollY; renderPanel(); window.scrollTo({top:y}); return; } S.confirmReset=false; SD={...SITE_DEF}; sChanged(true); toast("عادت الإعدادات الأصلية، اضغطي «حفظ ونشر» لتثبيتها"); }
  else if(a==="lmove") moveLesson(b.dataset.id,+b.dataset.d);
  else if(a==="lhide"){ const l=lessons().find(x=>x.id===b.dataset.id); try{ await patchLesson(l.id,{hidden:!l.hidden}); const y=window.scrollY; renderPanel(); window.scrollTo({top:y}); toast(l.hidden?"أصبح الدرس ظاهراً للطالبات":"أُخفي الدرس عن الطالبات"); }catch(e){ toast("تعذر الحفظ"); } }
  else if(a==="dlpdf") downloadPdf();
});
document.addEventListener("change", e=>{ const t=e.target; if(t.matches && t.matches("select[data-f='t']")){ readEditorFields(); const box=t.closest(".qed"); const list=box.dataset.kind==="quiz"?ED.L.quiz:ED.tq; const q=list[+box.dataset.k]; q.t=t.value; if(q.t==="mc"){ q.o=q.o||["","","",""]; q.a=0; } else if(q.t==="tf") q.a=true; else if(q.t==="fill") q.a=[]; else q.a=""; drawEditor(); } });
document.addEventListener("input", e=>{ if(e.target.matches("[data-fill]")){ const L=lessons()[S.idx]; qState(L.id).ans[+e.target.dataset.fill]=e.target.value; } });
document.addEventListener("keydown", e=>{
  if(S.view!=="deck"||$("#modal")||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if(e.key==="ArrowLeft"){ $('[data-act="next"]')?.click(); } if(e.key==="ArrowRight"){ $('[data-act="prev"]')?.click(); }
  if(e.key==="Escape" && S.railOpen){ S.railOpen=false; $(".rail").classList.remove("open"); const sc=$(".scrim"); if(sc) sc.hidden=true; }
});

/* ============ data wiring ============ */
let subs = {};
function rerenderSoft(){
  if($("#modal")) return; // don't clobber editors
  if(S.view==="panel"&&S.panelTab==="settings"&&/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||"")) return;
  const y=window.scrollY;
  if(S.view==="deck"){ // keep typed fill answers
    const L=lessons()[S.idx]; if(L) document.querySelectorAll("[data-fill]").forEach(el=>qState(L.id).ans[+el.dataset.fill]=el.value);
    renderDeck(); window.scrollTo({top:y});
  } else if(S.view==="panel"){ renderPanel(); window.scrollTo({top:y}); }
  else if(S.view==="home"||S.view==="progress"){ render(); window.scrollTo({top:y}); }
  else if(S.view==="gate"){ const sel=$("#stuSel"), v=sel?sel.value:"", pw=$("#stuPw")?$("#stuPw").value:""; renderGate(); if($("#stuSel")) $("#stuSel").value=v; if($("#stuPw")) $("#stuPw").value=pw; }
}
function startTeacher(){
  if(!S.db) return;
  if(!subs.tq) subs.tq = S.db.collection("tq").onSnapshot(s=>{ S.tq={}; s.docs.forEach(d=>S.tq[d.id]=d.data()); rerenderSoft(); }, ()=>{});
  if(!subs.res) subs.res = S.db.collection("results").onSnapshot(s=>{ const out=[]; s.docs.forEach(d=>Object.values(d.data()||{}).forEach(r=>{ if(r&&r.sid) out.push(r); })); S.results=out; rerenderSoft(); }, ()=>{});
  if(!subs.pw) subs.pw = S.db.collection("studentpw").onSnapshot(s=>{ S.pw={}; s.docs.forEach(d=>S.pw[d.id]=d.data()); rerenderSoft(); }, ()=>{});
}
function startStudent(){
  if(!S.db||!S.uid||!S.session) return;
  if(subs.my) subs.my();
  subs.my = S.db.doc("results/"+S.uid).onSnapshot(d=>{ S.myRes={}; const data=d.exists?d.data():{}; Object.values(data||{}).forEach(r=>{ if(r&&r.sid===S.session?.sid) S.myRes[r.lesson]=r; }); rerenderSoft(); }, ()=>{});
}
async function boot(){
  const cs=store.get("tj_site"); if(cs){ SITE={...SITE_DEF,...cs}; } applySite(SITE);
  render();
  const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
  const [db,user,dl,assets] = await Promise.all([use("db"),use("user"),use("downloads"),use("assets")]);
  S.db=db; S.user=user; S.dl=dl; S.assets=assets;
  try{ S.canEdit = user ? !!(await user.canEdit()) : false; }catch(e){ S.canEdit=false; }
  try{ S.uid = user ? await user.id() : null; }catch(e){ S.uid=null; }
  S.ready=true;
  if(db){
    const timer=setTimeout(()=>{ if(!S.studentsLoaded){ S.studentsLoaded=true; rerenderSoft(); } },10000);
    db.doc("site/main").onSnapshot(d=>{ SITE={...SITE_DEF,...(d.exists?d.data():{})}; store.set("tj_site",SITE); if(!SD) applySite(SITE); rerenderSoft(); }, ()=>{});
    if(!window.GAS) db.collection("pwchange").onSnapshot(s=>{ S.pwch={}; s.docs.forEach(d=>S.pwch[d.id]=d.data()); rerenderSoft(); }, ()=>{});
    db.collection("lessons").onSnapshot(s=>{ S.over={}; s.docs.forEach(d=>S.over[d.id]=d.data()); rerenderSoft(); }, ()=>{});
    db.collection("students").onSnapshot(s=>{ clearTimeout(timer); S.studentsLoaded=true; S.students=s.docs.map(d=>({id:d.id,...d.data()}));
      if(S.session&&S.session.role==="student"&&!S.students.find(x=>x.id===S.session.sid)){ S.session=null; store.del("tj_session"); S.view="gate"; }
      rerenderSoft(); }, ()=>{ clearTimeout(timer); S.studentsLoaded=true; rerenderSoft(); });
  }
  if(S.session){
    if(S.session.role==="teacher" && (!S.canEdit||!db)){ S.session=null; store.del("tj_session"); }
    else if(S.session.role==="student" && !db){ S.session=null; store.del("tj_session"); }
  }
  if(S.session){ S.view="home"; if(S.session.role==="teacher") startTeacher(); else startStudent(); }
  render();
}
boot();
</script>

<script>
/* ===== Standalone version: username + password logins ===== */
checkTeacherSetup = async function(){};
async function doLogin(user, pw, errEl, expect){
  errEl.textContent = "";
  if(!user){ errEl.textContent = "اكتبي اسم المستخدم."; return; }
  if(!pw){ errEl.textContent = "اكتبي كلمة المرور."; return; }
  errEl.textContent = "جارٍ التحقق…";
  try{
    const r = await gasRun("login", {user, pw});
    errEl.textContent = "";
    if(r.role==="teacher"){
      AUTH = {t:r.token}; saveAuth();
      S.session = {role:"teacher", name:SITE.teacher}; store.set("tj_session", S.session); startTeacher(); go("home");
    } else {
      AUTH = {s:r.token, sid:r.sid}; saveAuth(); S.uid = r.sid;
      S.session = {role:"student", sid:r.sid, name:r.name}; store.set("tj_session", S.session); startStudent();
      if(r.mustChange){ go("home"); openMyPw(true); } else go("home");
    }
  }catch(e){
    errEl.textContent = e.code==="bad_pw" ? "كلمة المرور غير صحيحة." :
      e.code==="no_user" ? (expect==="teacher" ? "اسم المستخدم غير صحيح." : "لم يُعثر على هذا الاسم. اكتبيه كما سجّلته المعلمة.") :
      "تعذر الاتصال بالخادم، حاولي مرة أخرى.";
  }
}
teacherLogin = function(){ doLogin($("#tchUser").value.trim(), $("#tchPw").value, $("#tchErr"), "teacher"); };
studentLogin = function(){ doLogin($("#stuUser").value.trim(), $("#stuPw").value, $("#stuErr"), "student"); };

window.openMyPw = function(forced){
  if(!S.session) return;
  showModal(`<div class="mh"><h3>${forced ? "أنشئي كلمة مرور خاصة بكِ" : "تغيير كلمة المرور"}</h3>${forced ? "" : `<button class="btn sm" data-act="close">إلغاء</button>`}</div>
    <form class="mb" id="myPwForm" style="max-width:460px">
      ${forced ? `<div class="info">أهلاً ${esc(S.session.name)}! هذه أول مرة تدخلين فيها، فاختاري كلمة مرور جديدة تحفظينها، وتدخلين بها من الآن.</div>` : ""}
      <div class="field"><label for="np1">كلمة المرور الجديدة (٤ أحرف أو أرقام على الأقل)</label><input class="inp" id="np1" type="password" autocomplete="new-password"></div>
      <div class="field"><label for="np2">أعيدي كتابتها للتأكيد</label><input class="inp" id="np2" type="password" autocomplete="new-password"></div>
      <button class="btn pri big" type="submit">حفظ كلمة المرور</button><p class="err" id="npErr"></p>
    </form>`);
  if(forced){ const m=$("#modal"); m.replaceWith(m.cloneNode(true)); }
  $("#myPwForm").addEventListener("submit", async ev=>{
    ev.preventDefault();
    const p1=$("#np1").value.trim(), p2=$("#np2").value.trim(), er=$("#npErr");
    if(p1.length<4){ er.textContent="كلمة المرور ٤ أحرف أو أرقام على الأقل."; return; }
    if(p1!==p2){ er.textContent="الكلمتان غير متطابقتين."; return; }
    er.textContent="جارٍ الحفظ…";
    try{ await gasRun("changePw",{pw:p1}); closeModal(); toast("تم حفظ كلمة المرور الجديدة"); if(S.db.refresh) S.db.refresh(); }
    catch(e){ er.textContent="تعذر الحفظ، حاولي مرة أخرى."; }
  });
  setTimeout(()=>{ const f=$("#np1"); if(f) f.focus(); },50);
};
document.addEventListener("click", e=>{ const b=e.target.closest('[data-act="logout"]'); if(b){ AUTH={}; saveAuth(); S.uid=null; } }, true);

</script>

</body>
