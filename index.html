<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>رياض التجويد</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700;800&display=swap"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><style id="css">
/* Layout: a garden-notebook — gradient header band, one lesson per view, mind map on a central spine, quiz card below */
:root{
  --bg:#fbf4fa; --surface:#ffffff; --surface2:#fdf0f7; --ink:#3a2142; --muted:#7a6182;
  --rose:#d4418b; --violet:#7a4bd6; --plum:#9c3a8e; --orchid:#b05ad2;
  --lilac:#f1e8ff; --blush:#fde6f1; --line:#ecd8ee;
  --ok:#23845c; --okbg:#e5f6ee; --bad:#c93a59; --badbg:#fde8ed;
  --grad:linear-gradient(120deg,#f6a6c9 0%,#d58ee6 48%,#a99af4 100%);
  --grad-strong:linear-gradient(120deg,#d4418b,#7a4bd6);
  --f-display:"El Messiri","Tajawal","Segoe UI",Tahoma,sans-serif;
  --f-body:"Tajawal","Segoe UI",Tahoma,sans-serif;
  --f-quran:"Amiri","Traditional Arabic","Times New Roman",serif;
  --shadow:0 10px 30px -18px rgba(122,75,214,.45);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1120; --surface:#251a2d; --surface2:#2c1d33; --ink:#f7eaf8; --muted:#c6abcd;
  --rose:#f07ab4; --violet:#ab8cf6; --plum:#e28ad3; --orchid:#d39bf0;
  --lilac:#2f2343; --blush:#3a1e34; --line:#43304c;
  --ok:#5fd3a0; --okbg:#173328; --bad:#ff8aa3; --badbg:#3b1824;
  --grad:linear-gradient(120deg,#6e2e5a 0%,#5a3279 50%,#3e3a85 100%);
  --grad-strong:linear-gradient(120deg,#f07ab4,#ab8cf6);
  --shadow:0 10px 30px -18px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1120; --surface:#251a2d; --surface2:#2c1d33; --ink:#f7eaf8; --muted:#c6abcd;
  --rose:#f07ab4; --violet:#ab8cf6; --plum:#e28ad3; --orchid:#d39bf0;
  --lilac:#2f2343; --blush:#3a1e34; --line:#43304c;
  --ok:#5fd3a0; --okbg:#173328; --bad:#ff8aa3; --badbg:#3b1824;
  --grad:linear-gradient(120deg,#6e2e5a 0%,#5a3279 50%,#3e3a85 100%);
  --grad-strong:linear-gradient(120deg,#f07ab4,#ab8cf6);
  --shadow:0 10px 30px -18px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.85;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--violet)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orchid);outline-offset:2px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.band{background:var(--grad);color:#fff;position:relative;overflow:hidden}
.band .wrap{padding-block:22px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}
.brand svg{width:44px;height:44px;flex:none}
.brand b{font-family:var(--f-display);font-size:1.6rem;line-height:1.2;display:block}
.brand small{opacity:.92;font-size:.9rem}
.band .tools{display:flex;gap:8px;flex-wrap:wrap}
.pillbtn{border:1.5px solid rgba(255,255,255,.75);background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:.92rem;text-decoration:none}
.pillbtn:hover{background:rgba(255,255,255,.3)}
.teacher-badge{background:#fff;color:var(--plum);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.85rem}

/* lesson nav */
.lnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.lnav .wrap{padding-block:8px;overflow-x:auto;display:flex;gap:6px;scrollbar-width:thin}
.lnav a{flex:none;text-decoration:none;color:var(--muted);border:1.5px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.88rem;font-weight:700;white-space:nowrap;display:flex;gap:6px;align-items:center}
.lnav a.on{background:var(--grad-strong);color:#fff;border-color:transparent}
.lnav a .sc{font-size:.75rem;background:var(--blush);color:var(--rose);border-radius:999px;padding:0 7px}
.lnav a.on .sc{background:rgba(255,255,255,.25);color:#fff}

main .wrap{padding-block:26px 40px;display:grid;gap:26px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.35;margin:0}
.eyebrow{color:var(--rose);font-weight:800;letter-spacing:.02em;font-size:.95rem}
.hero{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.hero h1{font-size:clamp(1.7rem,4.5vw,2.6rem);background:var(--grad-strong);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .count{color:var(--muted);font-weight:700}
.sec-title{display:flex;align-items:center;gap:10px;font-size:1.45rem;color:var(--plum)}
.sec-title svg{width:26px;height:26px;flex:none}

/* video card */
.video{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:14px;box-shadow:var(--shadow)}
.vrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:14px;padding:10px 16px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:.97rem}
.btn-main{background:var(--grad-strong);color:#fff}
.btn-soft{background:var(--lilac);color:var(--violet)}
.btn-rose{background:var(--blush);color:var(--rose)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:20px;height:20px}
.vnote{color:var(--muted);font-size:.9rem;margin:0}
video{width:100%;max-width:100%;border-radius:16px;background:#000;max-height:420px}
.tpanel{border:2px dashed var(--orchid);border-radius:16px;padding:14px;display:grid;gap:10px;background:var(--surface2)}
.tpanel b{color:var(--plum)}
.tpanel input[type=url]{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface);direction:ltr;text-align:left}
.file-l{position:relative;overflow:hidden}
.file-l input{position:absolute;inset:0;opacity:0;cursor:pointer}
.status{font-size:.88rem;color:var(--muted)}

/* mind map */
.map-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.map{position:relative;display:grid;justify-items:center}
.root{background:var(--grad-strong);color:#fff;font-family:var(--f-display);font-size:1.3rem;font-weight:700;padding:12px 26px;border-radius:999px;box-shadow:var(--shadow);text-align:center;position:relative;z-index:1;max-width:100%}
.root-line{width:3px;height:26px;background:var(--grad-strong)}
.branches{list-style:none;margin:0;padding:0;width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:60px;row-gap:18px;position:relative;align-items:start}
.branches::before{content:"";position:absolute;top:-2px;bottom:12px;left:50%;width:3px;transform:translateX(-50%);background:linear-gradient(var(--rose),var(--violet));border-radius:3px}
.br{position:relative;min-width:0}
.br::after{content:"";position:absolute;top:27px;height:3px;width:30px;background:var(--c)}
.br:nth-child(odd)::after{left:-30px}
.br:nth-child(even)::after{right:-30px}
.br::before{content:"";position:absolute;top:21px;width:15px;height:15px;border-radius:50%;background:var(--c);border:3px solid var(--bg);z-index:1}
.br:nth-child(odd)::before{left:-39px}
.br:nth-child(even)::before{right:-39px}
.br:nth-child(4n+1){--c:var(--rose)} .br:nth-child(4n+2){--c:var(--violet)} .br:nth-child(4n+3){--c:var(--plum)} .br:nth-child(4n+4){--c:var(--orchid)}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.br.open .card{border-color:var(--c);box-shadow:var(--shadow)}
.card>button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px}
.card>button:focus-visible{outline:3px solid var(--orchid);outline-offset:-3px}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.card h3{font-family:var(--f-body);font-weight:800;font-size:1.08rem;color:var(--c);flex:1;line-height:1.5}
.chev{flex:none;width:22px;height:22px;color:var(--c);transition:transform .25s}
.br.open .chev{transform:rotate(180deg)}
.body{padding:0 16px 14px;border-top:1px dashed var(--line)}
.body p{margin:.6em 0}
.body ul,.body ol{margin:.5em 0;padding-inline-start:1.3em}
.body li{margin:.25em 0}
.body li::marker{color:var(--c);font-weight:800}
.body b{color:var(--c)}
.ex{font-family:var(--f-quran);font-size:1.12em;color:var(--violet);font-style:normal;background:var(--lilac);padding:0 6px;border-radius:6px;white-space:nowrap}
td.ex{white-space:normal;background:none;font-weight:700}
.note{background:var(--blush);border-inline-start:4px solid var(--rose);border-radius:12px;padding:8px 12px;margin:.7em 0;font-size:.96rem}
.note b{color:var(--rose)}
.poem{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-family:var(--f-quran);font-size:1.12rem;text-align:center;background:var(--lilac);border-radius:12px;padding:8px 12px;margin:.6em 0;color:var(--violet)}
.poem-in{font-family:var(--f-quran);color:var(--violet)}
.rank{font-weight:800;font-size:1.15rem;text-align:center;background:var(--grad-strong);color:#fff;border-radius:12px;padding:6px 10px;margin:.6em 0;letter-spacing:.04em}
.duo,.trio{display:grid;gap:10px;margin:.6em 0}
.duo{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.trio{grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr))}
.duo>div,.trio>div{background:var(--surface2);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:6px;align-content:start}
.duo .k,.trio .k{color:var(--c);font-size:1.02rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:.6em 0}
.chips span{background:var(--lilac);color:var(--violet);border-radius:999px;padding:3px 14px;font-weight:800}
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:separate;border-spacing:0;margin:.6em 0;font-size:.95rem;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.t th,.t td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.t tr:last-child>*{border-bottom:0}
.t th{background:var(--lilac);color:var(--violet);font-weight:800}

/* quiz */
.quiz{background:var(--surface);border:2px solid transparent;background-image:linear-gradient(var(--surface),var(--surface)),var(--grad);background-origin:border-box;background-clip:padding-box,border-box;border-radius:24px;padding:22px;display:grid;gap:16px;box-shadow:var(--shadow)}
#qform{display:grid;gap:12px}
.quiz-sub{color:var(--muted);margin:0}
.q{min-width:0;border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:10px}
.qtop{display:flex;gap:10px;align-items:baseline}
.qtag{flex:none;font-size:.78rem;font-weight:800;border-radius:999px;padding:1px 10px;background:var(--blush);color:var(--rose)}
.qtxt{font-weight:700;font-size:1.05rem}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0}
.opt span{display:block;border:1.5px solid var(--line);border-radius:12px;padding:6px 14px;cursor:pointer;background:var(--surface);transition:.15s}
.opt input:checked+span{background:var(--grad-strong);color:#fff;border-color:transparent}
.opt input:focus-visible+span{outline:3px solid var(--orchid);outline-offset:2px}
.opts.col{flex-direction:column}
.fill select{border:2px solid var(--violet);border-radius:10px;padding:2px 8px;background:var(--lilac);color:var(--violet);font-weight:800;max-width:100%}
.q.ok{border-color:var(--ok);background:var(--okbg)}
.q.bad{border-color:var(--bad);background:var(--badbg)}
.fb{font-size:.95rem;display:grid;gap:4px}
.fb .mark{font-weight:800}
.q.ok .mark{color:var(--ok)} .q.bad .mark{color:var(--bad)}
.fb .right{font-weight:800;color:var(--ok)}
.qactions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.warn{color:var(--bad);font-weight:700}
.result{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--surface2);border-radius:20px;padding:16px}
.ring{width:110px;height:110px;flex:none}
.ring text{font-family:var(--f-display);font-weight:700;fill:var(--ink)}
.result h3{color:var(--plum);font-size:1.3rem}
.result p{margin:.3em 0 0}
.result .bloom{color:var(--rose)}

/* home */
.intro{display:grid;gap:10px;max-width:70ch}
.intro p{margin:0;color:var(--muted)}
.unit{display:grid;gap:12px}
.unit h2{font-size:1.3rem;color:var(--plum)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:14px}
.lcard{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;text-decoration:none;color:var(--ink);display:grid;gap:6px;transition:.2s}
.lcard:hover{border-color:var(--orchid);box-shadow:var(--shadow);transform:translateY(-2px)}
.lcard .n{color:var(--rose);font-weight:800;font-size:.85rem}
.lcard b{font-family:var(--f-display);font-size:1.15rem;line-height:1.4}
.lcard .meta{color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between}
.lcard .done{color:var(--ok);font-weight:800}

.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
footer .wrap{padding-block:18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
footer b{color:var(--rose);font-family:var(--f-display)}

@media (max-width:720px){
  body{font-size:16px}
  .branches{grid-template-columns:minmax(0,1fr);padding-inline-start:30px}
  .branches::before{left:auto;right:9px;transform:none}
  .br::after,.br:nth-child(odd)::after,.br:nth-child(even)::after{left:auto;right:-21px;width:21px}
  .br::before,.br:nth-child(odd)::before,.br:nth-child(even)::before{left:auto;right:-28px}
  .map{justify-items:stretch}
  .root{justify-self:start}
  .root-line{margin-inline-start:9px}
  .poem{grid-template-columns:1fr}
  .quiz{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* palettes (light mode only; dark mode keeps the night garden) */
@media (prefers-color-scheme: light){
 :root[data-palette="peach"]:not([data-theme="dark"]){--rose:#d4566a;--violet:#b0548f;--plum:#a8456d;--orchid:#e07a5f;--lilac:#ffeee6;--blush:#ffe5e5;--grad:linear-gradient(120deg,#ffc3a8,#f7a1c4 55%,#d7a6e8);--grad-strong:linear-gradient(120deg,#e0607e,#b0548f)}
 :root[data-palette="lavender"]:not([data-theme="dark"]){--rose:#9b5de5;--violet:#5b5bd6;--plum:#7046b8;--orchid:#c264d8;--lilac:#ecebff;--blush:#f3e8ff;--grad:linear-gradient(120deg,#c9b6ff,#a9c1ff 55%,#e4b6f2);--grad-strong:linear-gradient(120deg,#9b5de5,#5b5bd6)}
}
:root[data-palette="peach"][data-theme="light"]{--rose:#d4566a;--violet:#b0548f;--plum:#a8456d;--orchid:#e07a5f;--lilac:#ffeee6;--blush:#ffe5e5;--grad:linear-gradient(120deg,#ffc3a8,#f7a1c4 55%,#d7a6e8);--grad-strong:linear-gradient(120deg,#e0607e,#b0548f)}
:root[data-palette="lavender"][data-theme="light"]{--rose:#9b5de5;--violet:#5b5bd6;--plum:#7046b8;--orchid:#c264d8;--lilac:#ecebff;--blush:#f3e8ff;--grad:linear-gradient(120deg,#c9b6ff,#a9c1ff 55%,#e4b6f2);--grad-strong:linear-gradient(120deg,#9b5de5,#5b5bd6)}

.chip-user{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.2);border-radius:999px;padding:4px 6px 4px 12px;font-weight:700}
.chip-user .av{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--plum);display:grid;place-items:center;font-weight:800}
.pillbtn.solid{background:#fff;color:var(--plum);border-color:#fff}

/* login */
.login{display:grid;justify-items:center;padding-block:clamp(20px,6vh,60px)}
.login-box{width:100%;max-width:880px;display:grid;gap:22px}
.login-head{text-align:center;display:grid;gap:8px;justify-items:center}
.login-head h1{font-size:clamp(1.9rem,5vw,2.8rem);background:var(--grad-strong);-webkit-background-clip:text;background-clip:text;color:transparent}
.login-head p{margin:0;color:var(--muted);max-width:60ch}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.door{background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:22px;display:grid;gap:12px;align-content:start;box-shadow:var(--shadow)}
.door h2{font-size:1.35rem;color:var(--plum);display:flex;gap:10px;align-items:center}
.door h2 svg{width:28px;height:28px;color:var(--rose)}
.door p{margin:0;color:var(--muted);font-size:.95rem}
.field{display:grid;gap:4px}
.field label{font-weight:800;font-size:.92rem}
.field small{color:var(--muted);font-size:.82rem}
.inp{width:100%;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--surface);color:var(--ink)}
.inp:focus{border-color:var(--orchid);outline:none}
textarea.inp{min-height:80px;resize:vertical;line-height:1.6}
.err{color:var(--bad);font-weight:700;font-size:.92rem;min-height:1.2em}
.okmsg{color:var(--ok);font-weight:700;font-size:.92rem}

/* settings */
.set-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:8px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:12px;font-weight:800;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--grad-strong);color:#fff}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:16px}
.panel h3{color:var(--plum);font-size:1.15rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.checks{display:flex;flex-wrap:wrap;gap:8px 14px}
.ck{display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-weight:600}
.ck input{width:18px;height:18px;accent-color:var(--rose)}
.ls-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:4px 12px;max-height:220px;overflow:auto;border:1px dashed var(--line);border-radius:12px;padding:8px 10px}
.ls-checks .ck{font-weight:500;font-size:.9rem}
details.box{border:1.5px solid var(--line);border-radius:16px;background:var(--surface2)}
details.box>summary{cursor:pointer;padding:10px 14px;font-weight:800;display:flex;gap:8px;align-items:center;list-style:none}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary .tag{margin-inline-start:auto;font-size:.78rem;border-radius:999px;padding:1px 10px;background:var(--lilac);color:var(--violet)}
details.box>summary .tag.off{background:var(--badbg);color:var(--bad)}
details.box[open]>summary{border-bottom:1px dashed var(--line)}
details.box>.in{padding:12px 14px;display:grid;gap:12px}
.member{display:grid;gap:10px}
.code{font-family:ui-monospace,monospace;font-weight:800;letter-spacing:.15em;background:var(--lilac);color:var(--violet);border-radius:8px;padding:1px 8px;direction:ltr;display:inline-block}
.savebar{position:sticky;bottom:0;z-index:6;background:var(--surface);border:1.5px solid var(--orchid);border-radius:18px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow);margin-bottom:env(safe-area-inset-bottom,0px)}
.savebar .msg{flex:1;min-width:160px;font-weight:700;color:var(--muted)}
.savebar .msg.dirty{color:var(--rose)}
.qedit{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:8px;background:var(--surface)}
.qedit .opts4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:6px}
.secnote{background:var(--blush);border-radius:12px;padding:10px 12px;font-size:.92rem}
.preview-bar{background:var(--lilac);color:var(--violet);border-radius:14px;padding:8px 12px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* map editing */
.br.edit .card{border-style:dashed;border-color:var(--c)}
.edit-h{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:800;color:var(--c);background:var(--surface)}
.edit-b{min-height:80px;border:1.5px dashed var(--line);border-radius:10px;padding:6px 10px;margin-top:8px;background:var(--surface)}
.edit-row{display:flex;gap:8px;padding:12px 14px;align-items:center}
.edit-tools{display:flex;gap:8px;flex-wrap:wrap}
.hidden-tag{font-size:.8rem;background:var(--badbg);color:var(--bad);border-radius:999px;padding:1px 10px;font-weight:800}

/* progress */
.prog{display:grid;gap:10px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 120px 60px;gap:10px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;text-decoration:none;color:var(--ink)}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad-strong);border-radius:999px}
.prow b{font-variant-numeric:tabular-nums;text-align:left}
.big-bar{height:16px}
.cert{border:3px double var(--orchid);border-radius:26px;padding:26px;text-align:center;display:grid;gap:8px;background:var(--surface2)}
.cert h2{font-size:clamp(1.5rem,4vw,2.2rem);color:var(--plum)}
.cert .nm{font-family:var(--f-display);font-size:clamp(1.6rem,5vw,2.4rem);background:var(--grad-strong);-webkit-background-clip:text;background-clip:text;color:transparent}
@media (max-width:560px){.prow{grid-template-columns:minmax(0,1fr) 54px}.prow .bar{grid-column:1/-1;order:3}}

{h:"حالات الراء من حيث التفخيم والترقيق", b:`<div class="trio"><div><b class="k">تُفخّم قولاً واحداً</b></div><div><b class="k">تُرقّق قولاً واحداً</b></div><div><b class="k">يجوز فيها الوجهان</b></div></div>`},
{h:"(١) حالات تفخيم الراء قولاً واحداً", b:`<ol><li>إذا كانت الراء مفتوحة <span class="ex">رَبي</span>.</li><li>إذا كانت ساكنة قبلها مفتوح <span class="ex">البَرْق</span>.</li><li>إذا كانت ساكنة قبلها ساكن قبله مفتوح <span class="ex">والعَصْر</span> وقفاً.</li><li>إذا كانت مضمومة <span class="ex">رُزقوا</span>.</li><li>إذا كانت ساكنة قبلها مضموم <span class="ex">قُرْءانا</span>.</li><li>إذا كانت ساكنة قبلها ساكن قبله مضموم <span class="ex">خُسْر</span> وقفاً.</li>
<li>إذا كانت ساكنة قبلها مكسور وبعدها حرف استعلاء غير مكسور في كلمة واحدة، وذلك في خمس كلمات: <span class="ex">قرطاس</span> (الأنعام)، <span class="ex">مرصادا</span> (النبأ)، <span class="ex">لبالمرصاد</span> (الفجر)، <span class="ex">إرصادا</span> و<span class="ex">فرقة</span> (التوبة).</li>
<li>إذا كانت ساكنة قبلها همزة وصل <span class="ex">ارتابوا</span>، سواء كانت ملفوظة (عند البدء بها) أو مقدّرة (في وسط الكلام).</li></ol>`},
{h:"(٢) حالات ترقيق الراء قولاً واحداً", b:`<ol><li>أن تكون الراء مكسورة <span class="ex">رِجال</span>.</li><li>أن تكون ساكنة قبلها مكسور ولا يقع بعدها حرف استعلاء في نفس الكلمة <span class="ex">فِرْعون</span>.</li><li>أن تكون ساكنة قبلها ساكن قبله مكسور <span class="ex">حِجْر</span> وقفاً.</li><li>أن تكون ساكنة قبلها ياء ساكنة مدية كانت أم لينية نحو <span class="ex">قدير</span>، <span class="ex">لا ضير</span> وقفاً.</li><li>أن تكون الراء بعدها ألف ممالة، ولم يرد هذا إلا في كلمة واحدة عند حفص وهي <span class="ex">مجريها</span> في سورة هود.</li></ol>`},
{h:"شرح كلمة ﴿مجريها﴾", b:`<ul><li><b>الإمالة الكبرى:</b> أن تقترب بالفتحة نحو الكسرة وبالألف نحو الياء من غير قلب خالص ولا إشباع مبالغ فيه.</li><li><b>الإمالة الصغرى (التقليل):</b> هي ما بين الفتح والإمالة الكبرى، ويقال لها: بين بين.</li></ul>
<p>قرأ حفص كلمة <span class="ex">مجريها</span> بالإمالة الكبرى، أي إمالة الألف نحو الياء وفتحة الراء نحو الكسرة؛ لذلك أصبحت الراء في هذه الكلمة مرققة قولاً واحداً.</p>
<p><b>س:</b> ما العلة إذا أُميلت الألف نحو الياء فلابد من إمالة فتحة ما قبلها نحو الكسرة؟<br><b>ج:</b> لأن الألف عبارة عن إشباع وتمطيط لفتحة ما قبلها، فلكي تُمال الألف لابد من إمالة الفتحة.</p>`},
{h:"(٤) ما يجوز فيها الوجهان وقفاً", b:`<p>وذلك في كلمات مخصوصة: <span class="ex">مصر</span> <span class="ex">القطر</span> <span class="ex">يسر</span> <span class="ex">نذر</span> <span class="ex">أسر (فأسر)</span></p>
<table class="t"><tr><th>الكلمة</th><th>من قال بالتفخيم</th><th>من قال بالترقيق</th></tr>
<tr><td class="ex">مصر</td><td>على اعتبار أن الراء ساكنة وقفاً ما قبلها ساكن حصين (أي مطبق مستعلٍ) يشد الراء إلى أعلى ويفخّمها، ووجدها مفخّمة وصلاً ففضّل التفخيم.</td><td>على اعتبار أنها ساكنة ما قبلها ساكن قبله مكسور، ولم ينظر إلى حرف الاستعلاء.</td></tr>
<tr><td class="ex">القطر</td><td>على اعتبار أن الراء ساكنة وقفاً ما قبلها ساكن حصين (أي مطبق مستعلٍ) يشد الراء إلى أعلى ويفخّمها.</td><td>على اعتبار أنها ساكنة ما قبلها ساكن قبله مكسور ولم ينظر إلى حرف الاستعلاء، ووجدها مرققة وصلاً فرقّقها.</td></tr></table>
<div class="note"><b>رأي ابن الجزري:</b> (١) يفضّل في <span class="ex">مصر</span> التفخيم وقفاً لأنها مفخمة وصلاً. (٢) يفضّل في <span class="ex">القطر</span> الترقيق لأنها مرققة وصلاً. وهذا رأي غير ملزم.</div>`},
{h:"تنبيه: بالنذر، والراء آخر الكلمة", b:`<ul><li>أما كلمة <span class="ex">بالنذر</span> المعرفة بأل التعريف حيث وردت، فلا يوجد بها ياء محذوفة؛ فالراء تُفخّم قولاً واحداً في حالة الوقف لأنها ساكنة ما قبلها مضموم، وتُرقّق وصلاً لأنها مكسورة، نحو: <span class="ex">كذبت ثمود بالنذر</span> (القمر).</li>
<li>كل ما ذُكر عن حالات الراء في حركة ما قبلها وما بعدها لابد أن يكون في كلمة واحدة. فإذا كانت الراء الساكنة في آخر الكلمة الأولى وقبلها مكسور، وحرف الاستعلاء في أول الكلمة الثانية، فلا خلاف في ترقيقها. وأتى ذلك في ثلاثة مواضع:
<br><span class="ex">أن أنذرْ قومك</span> (نوح ١) — <span class="ex">ولا تصعرْ خدك</span> (لقمان ١٨) — <span class="ex">فاصبرْ صبراً جميلاً</span> (المعارج ٥)</li></ul>`},
{h:"ثانياً: ما يجوز فيها الوجهان وصلاً — ﴿فرق﴾ (الشعراء)", b:`<div class="duo"><div><b class="k">تُفخّم</b><span>ساكنة بعدها حرف استعلاء مكسور؛ وقوة الاستعلاء تشد القاف إلى أعلى، وقوة الكسر تشدها إلى أسفل، ولكن قوة الاستعلاء أكبر فتؤثر في الراء وتفخّمها.</span></div>
<div><b class="k">تُرقّق</b><span>قوة الاستعلاء تشد القاف إلى أعلى، وقوة الكسر تشدها إلى أسفل، فتفنيان بعضهما، فأصبحت راءً ساكنة ما قبلها مكسور.</span></div></div>
<div class="note"><b>ملحوظة:</b> راء <span class="ex">فرق</span> في الوقف مفخّمة.</div>`}
],
quiz:[
{type:"tf", q:"تُفخّم الراء إذا كانت ساكنة قبلها همزة وصل مثل (ارتابوا).", a:true, why:"سواء كانت همزة الوصل ملفوظة عند البدء أو مقدّرة في وسط الكلام."},
{type:"tf", q:"قرأ حفص كلمة (مجريها) بالإمالة الصغرى.", a:false, why:"قرأها بالإمالة الكبرى، فأصبحت الراء مرققة قولاً واحداً."},
{type:"mc", q:"حكم الراء في (فرعون):", o:["التفخيم","الترقيق","يجوز الوجهان","التفخيم النسبي"], a:1, why:"ساكنة قبلها مكسور ولا يقع بعدها حرف استعلاء في نفس الكلمة."},
{type:"mc", q:"كلمة يجوز في رائها الوجهان وصلاً:", o:["مصر","القطر","فرق","نذر"], a:2, why:"(فرق) في الشعراء يجوز فيها الوجهان وصلاً، وفي الوقف مفخمة."},
{type:"fill", q:"يفضّل ابن الجزري في كلمة (القطر) وقفاً ____ لأنها مرققة وصلاً.", o:["الترقيق","التفخيم","الإمالة","الإظهار"], a:0, why:"يفضّل الترقيق في القطر، والتفخيم في مصر، وهو رأي غير ملزم."}
]},

/* ================= 5 ================= */
{id:"l5", unit:"النون الساكنة والتنوين", t:"النون الساكنة والتنوين", yt:"أيمن سويد أحكام النون الساكنة والتنوين",
branches:[
{h:"تعريف النون الساكنة", b:`<p>هي النون الخالية من الحركة، الثابتة وصلاً ووقفاً وخطاً ولفظاً.</p>
<ul><li>تكون في الأسماء <span class="ex">سندس</span> <span class="ex">سنبلات</span>.</li><li>تكون في الأفعال <span class="ex">أنعم</span> <span class="ex">ينظر</span>.</li><li>تكون في الحروف <span class="ex">عن</span> <span class="ex">من</span>.</li><li>تكون متوسطة أو متطرفة.</li><li>تكون من بنية الكلمة <span class="ex">ينهون</span> أصلها نَهى.</li><li>وتكون زائدة عن بنية الكلمة <span class="ex">فانفلق</span> أصلها فلق.</li></ul>
<div class="note"><b>ملحوظة:</b> النون المقصودة هنا هي النون الساكنة سكوناً ثابتاً، وليست المتحركة مثل <span class="ex">نَعبد</span>، ولا المشددة مثل <span class="ex">النّور</span>، ولا التي تسكن سكوناً عارضاً عند الوقف مثل <span class="ex">تعلمونَ</span>، ولا التي تحركت بحركة عارضة للتخلص من التقاء الساكنين مثل <span class="ex">إنِ ارتبتم</span>.</div>`},
{h:"تعريف التنوين", b:`<p>هو نون ساكنة زائدة لغير توكيد، تلحق بآخر الأسماء لفظاً ووصلاً، وتفارقه خطاً ووقفاً. وقد كانت العرب في لغتها تلحق التنوين بآخر الأسماء النكرات مثل <span class="ex">سميعٌ</span> <span class="ex">عليمٌ</span>.</p>`},
{h:"تنبيهات على تعريف التنوين", b:`<ol><li>قولنا: إن التنوين هو <b>نون ساكنة</b>، أي خرج منه نون التنوين المتحركة بالكسر للتخلص من التقاء الساكنين <span class="ex">نوحٌ ابنه</span>.</li>
<li>قولنا: <b>لغير التوكيد</b>، أي خرج منه نون التوكيد الخفيفة التي وردت في القرآن في موضعين فقط: <span class="ex">وليكوناً من الصاغرين</span> (يوسف ٣٢)، <span class="ex">لنسفعاً بالناصية</span> (العلق ١٥). فهي ليست تنويناً لأنها تلحق بآخر الأفعال وليست الأسماء، وإن كانت تشبه التنوين وتعامل معاملته ويطبق عليها نفس الأحكام.</li>
<li>التنوين ثابت لفظاً دون خط (ينطق ولا يكتب).</li>
<li>التنوين ثابت وصلاً دون وقف، أما عند الوقف عليه فهو:
<br>• إما يُحذف إن كان بالضم أو الكسر نحو: رحيمٌ ← رحيم
<br>• أو يُبدل بألف مدية إن كان مفتوحاً نحو: عليماً ← عليما
<br>• كما يُحذف إن كان مفتوحاً على هاء التأنيث نحو: شجرةً ← شجره</li></ol>
<p><b>علامة التنوين:</b> فتحتان أو ضمتان أو كسرتان.</p>`},
{h:"الفرق بين النون الساكنة والتنوين", b:`<table class="t"><tr><th>النون الساكنة</th><th>التنوين</th></tr><tr><td>أصلية في الكلمة أو زائدة</td><td>زائدة في الكلمة</td></tr><tr><td>تقع متوسطة أو متطرفة</td><td>متطرفة فقط</td></tr><tr><td>في الأسماء والأفعال والحروف</td><td>في الأسماء فقط</td></tr><tr><td>ثابتة لفظاً وخطاً ووصلاً ووقفاً</td><td>ثابتة وصلاً ولفظاً، وساقطة وقفاً وخطاً</td></tr></table>`},
{h:"أحكام النون الساكنة والتنوين", b:`<div class="chips"><span>١- إظهار</span><span>٢- إدغام</span><span>٣- قلب</span><span>٤- إخفاء</span></div>
<p>وقد أشار ابن الجزري لذلك بقوله:</p><div class="poem"><span>وحكم تنوين ونون يُلفى</span><span>إظهار ادغام وقلب إخفا</span></div>
<div class="note"><b>ملحوظة:</b> القلب هو الإقلاب، والقلب هي الأصح لغة. والقدامى كانوا يكثرون من كلمة القلب، والمعاصرون من كلمة الإقلاب.</div>`}
],
quiz:[
{type:"tf", q:"التنوين يكون في الأسماء والأفعال والحروف.", a:false, why:"التنوين في الأسماء فقط، أما النون الساكنة ففي الأسماء والأفعال والحروف."},
{type:"tf", q:"التنوين ثابت لفظاً دون خط.", a:true, why:"التنوين يُنطق ولا يُكتب."},
{type:"mc", q:"النون في كلمة (ينهون) نون ساكنة:", o:["زائدة عن بنية الكلمة","من بنية الكلمة","تنوين","نون توكيد خفيفة"], a:1, why:"(ينهون) أصلها نَهى، فالنون من بنية الكلمة."},
{type:"mc", q:"عند الوقف على التنوين المفتوح مثل (عليماً):", o:["يُحذف","يُبدل ألفاً مدية","يُدغم","يُخفى"], a:1, why:"يُبدل بألف مدية إن كان مفتوحاً: عليماً ← عليما."},
{type:"fill", q:"أحكام النون الساكنة والتنوين: الإظهار والإدغام و____ والإخفاء.", o:["القلب","القلقلة","التفخيم","المد"], a:0, why:"إظهار، إدغام، قلب، إخفاء."}
]},

/* ================= 6 ================= */
{id:"l6", unit:"النون الساكنة والتنوين", t:"الإظهار الحلقي", yt:"أيمن سويد الإظهار الحلقي",
branches:[
{h:"تعريفه", b:`<ul><li><b>لغةً:</b> البيان والوضوح.</li><li><b>اصطلاحاً:</b> إخراج الحرف المُظهَر من مخرجه بدون غنة كاملة.</li><li><b>الحرف المُظهَر:</b> هو النون الساكنة أو التنوين الواقعتان قبل أحرف الإظهار.</li></ul>`},
{h:"أحرف الإظهار", b:`<p>ستة أحرف: <b>الهمزة والهاء والعين والحاء والغين والخاء</b>. جمعها الشيخ الجمزوري في قوله:</p>
<div class="poem"><span>همز فهاء ثم عين حاء</span><span>مهملتان ثم غين خاء</span></div><p>(مهملتان: أي بدون تنقيط). وجمعها البعض في أول كلمات البيت: <span class="ex">أخي هاك علماً حازه غير خاسر</span></p>
<p><b>سبب تسميتها أحرف الإظهار:</b> لأن وقوع واحد منها عقب النون الساكنة أو التنوين سبب في إظهارهما.</p>
<div class="note"><b>ملحوظة:</b> الإظهار الحلقي يكون في كلمة أو كلمتين.</div>`},
{h:"سبب التسمية وسبب الإظهار", b:`<ul><li><b>سُمّي إظهاراً:</b> لظهور النون الساكنة والتنوين إذا أتت قبل أحد هذه الأحرف الستة.</li><li><b>سُمّي حلقياً:</b> لأن الحروف الستة تخرج من الحلق.</li><li><b>سبب الإظهار:</b> بُعد مخرج النون عن مخرج هذه الأحرف؛ فالنون من طرف اللسان والأحرف الستة من الحلق.</li></ul>`},
{h:"كيفية الإظهار", b:`<p>النطق بالنون الساكنة نطقاً واضحاً من غير غنة ظاهرة، من غير فصل أو سكت، مع إعطائها زمن التوسط، ثم النطق بالحرف الذي يليها.</p>`},
{h:"مراتب الإظهار", b:`<ol><li><b>مرتبة عليا:</b> عند الهمزة والهاء.</li><li><b>مرتبة وسطى:</b> عند العين والحاء.</li><li><b>مرتبة دنيا:</b> عند الغين والخاء.</li></ol>`},
{h:"علامته في المصحف", b:`<ol><li>وضع رأس الخاء الصغيرة بدون نقطة فوق النون <span class="ex">مَنْ ءامن</span>.</li><li>وضع حركتي التنوين مركّبتين فوق بعضهما <span class="ex">عليماً حكيماً</span>، <span class="ex">سميعٌ عليمٌ</span>، <span class="ex">يومئذٍ ءامنون</span>.</li></ol>`},
{h:"أمثلة على الإظهار", b:`<div class="scroll"><table class="t"><tr><th>الحرف</th><th>مع النون في كلمة</th><th>مع النون في كلمتين</th><th>مع التنوين</th></tr>
<tr><td>ء</td><td>وينئون</td><td>فمن أسلم</td><td>حاسدٍ إذا حسد</td></tr><tr><td>هـ</td><td>فلا تنهر</td><td>إن هذا</td><td>سلامٌ هي</td></tr><tr><td>ع</td><td>الأنعام</td><td>من علق</td><td>وليالٍ عشر</td></tr><tr><td>ح</td><td>وانحر</td><td>ومن حيث</td><td>غفورٌ حليم</td></tr><tr><td>غ</td><td>فسينغضون (لا ثاني لها)</td><td>من غل</td><td>لعفوٌّ غفور</td></tr><tr><td>خ</td><td>والمنخنقة (لا ثاني لها)</td><td>من خير</td><td>عليمٌ خبير</td></tr></table></div>`}
],

]},

/* ================= 7 ================= */
{id:"l7", unit:"النون الساكنة والتنوين", t:"الإدغام", yt:"أيمن سويد الإدغام بغنة وبغير غنة",
branches:[
{h:"تعريفه وحروفه", b:`<ul><li><b>لغةً:</b> إدخال الشيء في الشيء.</li><li><b>اصطلاحاً:</b> إدخال حرف ساكن في حرف متحرك بحيث يصيران حرفاً واحداً مشدداً من جنس الثاني.</li><li><b>حروفه:</b> ستة أحرف مجموعة في كلمة <span class="ex">يرملون</span>.</li></ul>
<div class="note"><b>ملحوظة:</b> تسمى النون الساكنة الحرف <b>المدغم</b>، ويسمى أحد حروف كلمة (يرملون) <b>مدغماً فيه</b>.</div>`},
{h:"فائدته وكيفيته وشرطه", b:`<ul><li><b>فائدة الإدغام:</b> التخفيف؛ حيث إن المدغم والمدغم فيه يصيران حرفاً واحداً مشدداً.</li><li><b>كيفية الإدغام:</b> جعل الحرف المراد إدغامه مثل المدغم فيه، وكما قال ابن الجزري في النشر: النطق بالحرفين حرفاً كالثاني مشدداً.</li><li><b>شرط الإدغام:</b> أن يكون في كلمتين؛ أي النون الساكنة في آخر الكلمة الأولى، وحرف الإدغام في أول الكلمة الثانية.</li></ul>`},
{h:"أولاً: الإدغام بغنة", b:`<p>يختص بأربعة أحرف من حروف (يرملون) مجموعة في كلمة <span class="ex">ينمو</span> أو <span class="ex">يومن</span>.</p>
<ul><li><b>سُمّي إدغاماً:</b> لإدغام النون والتنوين في حروف (ينمو).</li><li><b>سُمّي بغنة:</b> لأن الغنة مصاحبة له، سواء كانت غنة المدغم أو غنة المدغم فيه.</li></ul>
<div class="scroll"><table class="t"><tr><th>الحرف</th><th>مع النون</th><th>مع التنوين</th></tr><tr><td>ي</td><td>من يعمل — من يطع</td><td>وجوهٌ يومئذ</td></tr><tr><td>ن</td><td>لن ندخلها — من نعمة</td><td>أمشاجٍ نبتليه</td></tr><tr><td>م</td><td>من ماء — من مال</td><td>قومٌ مسرفون</td></tr><tr><td>و</td><td>من وال — من واق</td><td>وليٍّ ولا نصير</td></tr></table></div>`},
{h:"ثانياً: الإدغام بدون غنة", b:`<p>يختص بحرفين هما <b>اللام والراء</b>، فتُدغم النون الساكنة في اللام أو الراء ولا يصاحبها غنة.</p><p><b>سبب حذف الغنة:</b> للتخفيف، حيث إن في بقائها بعض الثقل.</p>
<table class="t"><tr><th>الحرف</th><th>مع النون</th><th>مع التنوين</th></tr><tr><td>ل</td><td>أن لن</td><td>مالاً لُبدا</td></tr><tr><td>ر</td><td>من ربهم</td><td>غفورٌ رحيم</td></tr></table>`},
{h:"سبب الإدغام في حروف يرملون", b:`<ol><li>مع <b>النون</b>: للتماثل.</li><li>مع <b>الميم</b>: الميم تشارك النون في جميع الصفات وفي مخرج الغنة، فهما متجانسان في الصفات.</li><li>مع <b>الواو والياء</b>: النون مشتركة مع الواو والياء في الجهر والاستفال والانفتاح، والواو تخرج من مخرج الميم؛ فلما أُدغمت النون في الميم أُدغمت في الواو مثلها، ثم أُدغمت في الياء لشبهها بالواو.</li><li>مع <b>اللام</b>: للتقارب.</li><li>مع <b>الراء</b>: للتقارب.</li></ol>`},
{h:"علامة الإدغام في المصحف", b:`<p>تُعرّى النون الساكنة من الحركة، وفي حالة التنوين توضع الحركتان متتابعتين، ويوضع التشديد على المدغم فيه إذا كان إدغاماً كاملاً، ولا يوضع تشديد إذا كان إدغاماً ناقصاً.</p>`},
{h:"الإظهار المطلق", b:`<p><b>ماذا يحدث إذا أتت النون الساكنة وبعدها حرف من حروف يرملون في كلمة واحدة؟</b> إذا حدث هذا وجب الإظهار ويسمى <b>إظهاراً مطلقاً</b>، ولم يقع هذا في القرآن إلا مع الواو والياء فقط.</p>
<p><b>تعريفه:</b> أن يقع بعد النون الساكنة حرف من حروف يرملون في كلمة واحدة، ولم يقع في القرآن إلا في ٤ كلمات: <span class="ex">الدنيا</span> <span class="ex">بنيان</span> <span class="ex">صنوان</span> <span class="ex">قنوان</span>.</p>
<ul><li><b>سُمّي إظهاراً:</b> لإظهار النون الساكنة عند ملاقاتها لهذه الحروف في كلمة واحدة.</li><li><b>سُمّي مطلقاً:</b> لعدم تقييده بحلقي أو شفوي أو قمري.</li></ul>`},
{h:"الإدغام الكامل والناقص", b:`<div class="duo"><div><b class="k">الإدغام الكامل</b><span>سقوط المدغم في المدغم فيه ذاتاً وصفة مع استكمال التشديد.</span><span><b>حروفه:</b> نرمل (النون، الراء، الميم، اللام).</span><span><b>علامته:</b> تعرية المدغم من الحركة ووضع التشديد على المدغم فيه نحو <em class="ex">من رّبهم</em>.</span></div>
<div><b class="k">الإدغام الناقص</b><span>سقوط المدغم في المدغم فيه ذاتاً لا صفة، وعدم استكمال التشديد.</span><span><b>حروفه:</b> الواو والياء.</span><span><b>علامته:</b> تعرية المدغم من الحركة وعدم وضع تشديد على المدغم فيه نحو <em class="ex">من واق</em>.</span></div></div>
<div class="note"><b>ملحوظة:</b> اختلف العلماء في إدغام النون الساكنة والتنوين في (النون والميم): هل هو كامل أم ناقص؟ أي هل الغنة غنة المدغم (النون) أم غنة المدغم فيه (الميم)؟ والأرجح أنه إدغام كامل (أي أن الغنة غنة الميم)، وعليه رسم المصحف.</div>`}
],
quiz:[
{type:"tf", q:"شرط إدغام النون الساكنة أن يكون في كلمتين.", a:true, why:"النون الساكنة في آخر الكلمة الأولى وحرف الإدغام في أول الثانية."},
{type:"tf", q:"إدغام النون الساكنة في الواو والياء إدغام كامل.", a:false, why:"هو إدغام ناقص؛ يسقط المدغم ذاتاً لا صفة ولا يستكمل التشديد."},
{type:"mc", q:"حرفا الإدغام بدون غنة:", o:["الياء والواو","اللام والراء","النون والميم","الباء والميم"], a:1, why:"يختص الإدغام بدون غنة باللام والراء."},
{type:"mc", q:"من كلمات الإظهار المطلق في القرآن:", o:["منهم","صنوان","من ربهم","ينطق"], a:1, why:"الدنيا، بنيان، صنوان، قنوان."},
{type:"fill", q:"فائدة الإدغام: ____", o:["التخفيف","التفخيم","البيان","الإطالة"], a:0, why:"التخفيف؛ لأن المدغم والمدغم فيه يصيران حرفاً واحداً مشدداً."}
]},

/* ================= 8 ================= */
{id:"l8", unit:"النون الساكنة والتنوين", t:"القلب (الإقلاب)", yt:"أيمن سويد الإقلاب",
branches:[
{h:"تعريفه وحرفه", b:`<ul><li><b>لغةً:</b> تحويل الشيء عن وجهه.</li><li><b>اصطلاحاً:</b> قلب النون الساكنة أو التنوين ميماً مخفاة عند الباء مع مراعاة الغنة وعدم التشديد.</li><li><b>حرفه:</b> حرف الباء.</li></ul><div class="note"><b>ملحوظة:</b> القلب يكون في كلمة أو كلمتين.</div>`},
{h:"كيفية القلب", b:`<ol><li>قلب النون الساكنة أو التنوين ميماً لفظاً لا خطاً.</li><li>إخفاء الميم عند الباء بإطباق الشفتين إطباقاً خفيفاً بدون كزّ.</li><li>إظهار الغنة، وهي غنة الميم.</li><li>بعد ذلك يجب تقوية إطباق الشفتين للنطق بالباء.</li></ol>
<p>قال المرعشي: معنى إخفاء الميم ليس إعدامها بالكلية، بل إضعافها وستر ذاتها، وذلك بتقليل الاعتماد على مخرجها.</p>`},
{h:"تنبيهات هامة", b:`<ul><li>عدم كزّ الشفتين بقوة حتى لا تتولد ميم مظهرة.</li><li>عدم ترك فُرجة بين الشفتين حتى لا تتحول إلى لفظ مبهم أو تتحول إلى نون مخفاة.</li></ul>`},
{h:"سبب القلب", b:`<ul><li>لم يحسن الإظهار لما فيه من كلفة على اللسان.</li><li>لم يحسن الإدغام للتباعد في المخرج والصفات.</li><li>لم يحدث الإخفاء لأنه سوف يتولد معه صوت مبهم.</li></ul><p>فتُوصّل إلى القلب لما يكون معه من سهولة ويسر على اللسان.</p>`},
{h:"سبب اختيار الميم بالذات", b:`<p>الميم تشترك مع النون في جميع الصفات، وتشترك مع الباء في المخرج و٤ صفات (الجهر، الاستفال، الانفتاح، الذلاقة).</p>`},
{h:"علامته في المصحف وأمثلته", b:`<ol><li>وضع ميم قائمة فوق النون الساكنة (م) <span class="ex">لَيُنبذنّ</span>.</li><li>إبدال الحركة الثانية من التنوين بميم قائمة <span class="ex">عليمٌ بذات</span>.</li></ol>
<table class="t"><tr><th>مع النون في كلمة</th><th>مع النون في كلمتين</th><th>مع التنوين</th></tr><tr><td>أنبئوني</td><td>من بخل</td><td>سميعٌ بصير</td></tr><tr><td>أنبتنا</td><td>أن بورك</td><td>عليمٌ بذات</td></tr></table>`}
],
quiz:[
{type:"tf", q:"الإقلاب يكون في كلمة أو كلمتين.", a:true, why:"مثل (أنبئوني) في كلمة، و(من بخل) في كلمتين."},
{type:"tf", q:"عند الإقلاب نكزّ الشفتين بقوة.", a:false, why:"لا نكزّ الشفتين بقوة حتى لا تتولد ميم مظهرة، والإطباق خفيف."},
{type:"mc", q:"حرف الإقلاب:", o:["الميم","الباء","الواو","الفاء"], a:1, why:"حرف الإقلاب هو الباء فقط."},
{type:"mc", q:"اختيرت الميم لتُقلب إليها النون لأنها:", o:["تشترك مع النون في جميع الصفات ومع الباء في المخرج","أقوى الحروف","من حروف الحلق","حرف مد"], a:0, why:"وتشترك مع الباء في ٤ صفات: الجهر والاستفال والانفتاح والذلاقة."},
{type:"fill", q:"علامة الإقلاب في المصحف وضع ____ قائمة فوق النون الساكنة.", o:["ميم","خاء","شدة","سكون"], a:0, why:"ميم قائمة فوق النون، أو بدل الحركة الثانية من التنوين."}
]},

{id:"l9", unit:"النون الساكنة والتنوين", t:"الإخفاء الحقيقي", yt:"أيمن سويد الإخفاء الحقيقي",
branches:[
{h:"تعريفه وحروفه", b:`<ul><li><b>لغةً:</b> الستر.</li><li><b>اصطلاحاً:</b> النطق بالحرف الساكن عارٍ عن التشديد على صفة بين الإظهار والإدغام مع بقاء الغنة في الحرف الأول، وهو النون الساكنة أو التنوين.</li><li><b>حروفه:</b> خمسة عشر حرفاً، وهي الباقية من الحروف بعد حذف حروف الإظهار والإدغام والقلب.</li></ul>
<p>جمعها الشيخ الجمزوري في أوائل كلمات البيت التالي:</p><div class="poem"><span>صف ذا ثنا كم جاد شخص قد سما</span><span>دم طيباً زد في تقى ضع ظالما</span></div>`},
{h:"سببه وسبب التسمية", b:`<p><b>سببه:</b> عدم قرب مخرج النون من مخرج هذه الحروف القرب الذي يجب معه الإدغام، وعدم بُعد المخرج البعد الذي يجب معه الإظهار.</p>
<ol><li><b>سُمّي إخفاءً:</b> لإخفاء النون الساكنة عند هذه الحروف.</li><li><b>سُمّي حقيقياً:</b> لأنه متحقق في النون أكثر من غيرها؛ فذات النون تكاد تكون معدومة تماماً، بخلاف إخفاء الميم التي لا تكون معدومة تماماً ولكن تكون مستورة بعض الشيء.</li></ol>`},
{h:"كيفية الإخفاء", b:`<p>النطق بالنون الساكنة (أو التنوين) غير مُظهَرة إظهاراً محضاً، ولا مُدغمة إدغاماً محضاً، ولكن بحالة وسط بين الإظهار والإدغام بدون تشديد مع بقاء الغنة.</p>`},
{h:"أمثلة الإخفاء", b:`<div class="scroll"><table class="t"><tr><th>الحرف</th><th>في كلمة</th><th>في كلمتين</th><th>مع التنوين</th></tr>
<tr><td>ص</td><td>أنصارا</td><td>ولمن صبر</td><td>عملاً صالحا</td></tr><tr><td>ذ</td><td>لينذر</td><td>من ذهب</td><td>وكيلاً ذرية</td></tr><tr><td>ث</td><td>الأنثى</td><td>فمن ثقلت</td><td>أزواجاً ثلاثة</td></tr><tr><td>ك</td><td>أنكالا</td><td>من كتاب</td><td>كراماً كاتبين</td></tr><tr><td>ج</td><td>أنجيتنا</td><td>وإن جنحوا</td><td>ولكلٍ جعلنا</td></tr><tr><td>ش</td><td>وينشئ</td><td>فمن شهد</td><td>علمٍ شيئا</td></tr><tr><td>ق</td><td>ينقلب</td><td>من قرار</td><td>بتابعٍ قبلتهم</td></tr><tr><td>س</td><td>الإنسان</td><td>أن سيكون</td><td>ورجلاً سلما</td></tr><tr><td>د</td><td>أندادا</td><td>من دابة</td><td>عملاً دون</td></tr><tr><td>ط</td><td>ينطق</td><td>من طين</td><td>صعيداً طيبا</td></tr><tr><td>ز</td><td>أنزلناه</td><td>من زوال</td><td>نفساً زكية</td></tr><tr><td>ف</td><td>ينفق</td><td>من فضله</td><td>خالداً فيها</td></tr><tr><td>ت</td><td>كنتم</td><td>ومن تاب</td><td>جناتٍ تجري</td></tr><tr><td>ض</td><td>منضود</td><td>من ضعف</td><td>وكلاً ضربنا</td></tr><tr><td>ظ</td><td>انظر</td><td>من ظهير</td><td>ظلاً ظليلا</td></tr></table></div>`},
{h:"الفرق بين الإدغام والإخفاء", b:`<table class="t"><tr><th>الإدغام</th><th>الإخفاء</th></tr><tr><td>يصحبه تشديد</td><td>بدون تشديد</td></tr><tr><td>يكون في الحرف</td><td>يكون عند الحرف</td></tr><tr><td>من كلمتين</td><td>من كلمة أو كلمتين</td></tr><tr><td>بغنة وبغير غنة</td><td>بغنة دائماً</td></tr><tr><td>غنته أكمل ما تكون</td><td>غنته كاملة</td></tr><tr><td>الغنة مرققة تماماً</td><td>الغنة إما مرققة أو مفخمة</td></tr><tr><td>حروفه (يرملون)</td><td>له ١٥ حرفاً</td></tr></table>`}
],

/* ================= 10 ================= */
{id:"l10", unit:"أحكام الميم", t:"أحكام الميم الساكنة", yt:"أيمن سويد أحكام الميم الساكنة",
branches:[
{h:"تعريف الميم الساكنة ومواضعها", b:`<p>هي الميم الخالية من الحركة، وسكونها ثابت وصلاً ووقفاً.</p>
<div class="note"><b>تنبيه:</b> المقصود بالميم الساكنة هي الميم الساكنة سكوناً أصلياً وصلاً ووقفاً؛ فخرج بذلك السكون العارض لأجل الوقف <span class="ex">عليمٌ ← عليم</span>، وخرج أيضاً الميم الساكنة أصلاً وتحركت منعاً من التقاء الساكنين <span class="ex">قمِ الليل</span>.</div>
<ol><li>تقع متوسطة ومتطرفة <span class="ex">الحمد</span> <span class="ex">منكم</span>.</li><li>تأتي في الأسماء <span class="ex">الحمد</span>، والأفعال <span class="ex">قمتم</span>، والحروف <span class="ex">أم</span>، وتكون للجمع <span class="ex">عليكم</span>.</li></ol>
<div class="chips"><span>إخفاء شفوي</span><span>إدغام شفوي</span><span>إظهار شفوي</span></div>`},
{h:"أولاً: الإخفاء الشفوي", b:`<ul><li><b>لغةً:</b> الستر.</li><li><b>اصطلاحاً:</b> النطق بالميم الساكنة عارية عن التشديد على صفة بين الإظهار والإدغام مع بقاء الغنة فيها.</li><li><b>حرفه:</b> الباء.</li><li><b>سُمّي شفوياً:</b> بسبب خروج الميم والباء من الشفتين. <b>سُمّي إخفاءً:</b> لإخفاء الميم عند الباء.</li></ul>
<div class="note"><b>تنبيه:</b> لا يكون إلا من كلمتين.</div>
<ul><li><b>سبب الإخفاء:</b> ثقل الإظهار نتيجة لاتحاد الميم والباء في المخرج.</li><li><b>علامته في المصحف:</b> تعرية الميم من الحركة وعدم تشديد الباء.</li><li><b>كيفية الأداء:</b> ملامسة الشفتين بدون كزّ.</li></ul>
<div class="note"><b>تنبيه:</b> ذهب البعض إلى إظهار الميم عند الباء، ولكن الإخفاء هو الأولى. قال ابن الجزري: <span class="poem-in">والميم إن تسكن بغنة لدى ... باء على المختار من أهل الأدا</span></div>
<p><b>أمثلة:</b> <span class="ex">فاحكم بينهم</span> <span class="ex">يوم هم بارزون</span> <span class="ex">ربهم بهم</span></p>`},
{h:"الفروق: الإخفاء الشفوي والقلب والإخفاء الحقيقي", b:`<table class="t"><tr><th>الإخفاء الشفوي</th><th>القلب</th></tr><tr><td>إخفاء الميم عند الباء</td><td>قلب النون ميماً ثم إخفاء الميم عند الباء</td></tr><tr><td>في كلمتين</td><td>في كلمة أو كلمتين</td></tr></table><p>أما في الأداء فلا فرق بينهما.</p>
<table class="t"><tr><th>الإخفاء الحقيقي</th><th>الإخفاء الشفوي</th></tr><tr><td>يتم إعدام جسم النون تماماً ويبقى منها الغنة فقط</td><td>لا يتم إعدام جسم الميم ولكن يتم سترها فقط</td></tr><tr><td>في كلمة أو كلمتين</td><td>في كلمتين</td></tr><tr><td>اتفق عليه القراء</td><td>اختُلف فيه</td></tr></table>`},
{h:"ثانياً: الإدغام الشفوي", b:`<ul><li><b>لغةً:</b> الإدخال.</li><li><b>اصطلاحاً:</b> هو إدخال ميم ساكنة في ميم متحركة بحيث يصيران ميماً واحدة مشددة.</li><li><b>حرفه:</b> الميم.</li><li><b>اسمه:</b> إدغام متماثلين صغير شفوي بغنة.</li></ul>
<p><b>سبب التسمية:</b></p><ul><li><b>إدغاماً:</b> لإدغام الميم في الميم.</li><li><b>متماثلين:</b> لأن المدغم والمدغم فيه متحدان اسماً ورسماً.</li><li><b>صغيراً:</b> لأن الأول ساكن والثاني متحرك.</li><li><b>شفوياً:</b> لخروج الميم من الشفتين.</li><li><b>بغنة:</b> لمصاحبة الغنة له.</li></ul>
<div class="note"><b>تنبيه:</b> يقع في كلمتين أو في الحروف المقطعة.</div><p><b>علامته في المصحف:</b> تعرية الميم الأولى من الحركة وتشديد الميم الثانية.</p>
<table class="t"><tr><th>في الحروف المقطعة</th><th>في كلمتين</th></tr><tr><td>الم</td><td>كم من فئة</td></tr><tr><td>المر</td><td>لكم ما</td></tr><tr><td>المص</td><td>أم من أسس</td></tr></table>`},
{h:"ثالثاً: الإظهار الشفوي", b:`<ul><li><b>لغةً:</b> الظهور والبيان.</li><li><b>اصطلاحاً:</b> إخراج الميم الساكنة من مخرجها بدون غنة كاملة، وبدون وقف أو سكت أو تشديد.</li><li><b>حروفه:</b> الستة والعشرون حرفاً الباقية بعد إسقاط الباء والميم.</li></ul>
<div class="note"><b>تنبيه:</b> يكون من كلمة أو من كلمتين.</div>
<ul><li><b>سُمّي إظهاراً:</b> لإظهار الميم عند هذه الأحرف. <b>سُمّي شفوياً:</b> لخروج الميم من الشفتين.</li></ul>
<div class="note"><b>ملحوظة:</b> في حالة الإظهار الحلقي نُسبت التسمية إلى حروفه الستة الباقية لأن مخرجها واحد وهو الحلق، أما في حالة الإظهار الشفوي فنُسبت التسمية إلى مخرج الميم لأن الأحرف الستة والعشرين مختلفة في المخرج.</div>`},
{h:"كيفية أداء الإظهار الشفوي", b:`<p>النطق بالميم ساكنة من الشفتين بانطباقهما مع إعطاء الميم صفة التوسط، بدون أن تتحول إلى ميم مشددة، ثم النطق بالحرف الذي يليها.</p>
<ul><li>إذا جاء بعد الميم الساكنة (فاء) أو (واو) يجب تحقيق الإظهار حتى لا يسبق اللسان إلى إخفائها عند هذين الحرفين؛ لاتحاد الواو مع الميم في المخرج وقرب مخرج الفاء من مخرج الميم.</li><li>لا تُدغم الميم في الواو على الرغم من اتحادهما في المخرج؛ منعاً من اللبس، فلا يُعرف هل المدغم نون أم ميم.</li><li>لا تُدغم الميم في مقاربها وهي الفاء حتى لا تذهب غنتها فيكون إجحافاً بها، ولأن الفاء أضعف من الميم، ولا يُدغم القوي في الضعيف إدغاماً كاملاً على وجه الدراية.</li></ul>
<div class="scroll"><table class="t"><tr><th>الحرف</th><th>مثال</th><th>الحرف</th><th>مثال</th></tr>
<tr><td>ت</td><td>أسلمت</td><td>ث</td><td>الأمثال</td></tr><tr><td>ح</td><td>وفي أموالهم حق</td><td>ج</td><td>عند ربهم جنات</td></tr><tr><td>خ</td><td>ربكم خالق كل شيء</td><td>د</td><td>الحمد</td></tr><tr><td>ذ</td><td>الله أنزل إليكم ذكرا</td><td>ر</td><td>إليكم رسولا</td></tr><tr><td>ز</td><td>منهم زهرة</td><td>س</td><td>يمسسك</td></tr><tr><td>ش</td><td>فما تنفعهم شفاعة</td><td>ص</td><td>فوقهم صافات</td></tr><tr><td>ظ</td><td>عليهم ظلالها</td><td>ط</td><td>وأرسل عليهم طيرا</td></tr><tr><td>غ</td><td>فإنهم غير ملومين</td><td>ع</td><td>السمع</td></tr><tr><td>ق</td><td>ومهلهم قليلا</td><td>ف</td><td>ذرأكم في الأرض</td></tr><tr><td>هـ</td><td>واهجرهم هجرا</td><td>ك</td><td>فجعلهم كعصف</td></tr><tr><td>ي</td><td>لم يلد</td><td>ن</td><td>ألم نشرح لك صدرك</td></tr><tr><td></td><td></td><td>و</td><td>أموالهم</td></tr><tr><td></td><td></td><td>ء</td><td>وكنتم أمواتا</td></tr></table></div>`}
],

/* ================= 11 ================= */
{id:"l11", unit:"أحكام الميم", t:"النون والميم المشددتان ومراتب الغنة", yt:"أيمن سويد النون والميم المشددتان الغنة",
branches:[
{h:"تعريف الحرف المشدد", b:`<p>الحرف المشدد هو ما كان أصله حرفين، أولهما ساكن وثانيهما متحرك، وأُدغم الأول في الثاني.</p>`},
{h:"حكم النون والميم المشددتين", b:`<p>من أهم الصفات اللازمة للنون والميم صفة الغنة، فإذا وقع التشديد في هذين الحرفين ظهرت فيهما الغنة بأعلى مراتبها.</p>`},
{h:"مواضعهما", b:`<p>تقع النون والميم المشددتان متوسطتين أو متطرفتين في:</p><ol><li><b>الأسماء:</b> <span class="ex">الجنّة</span> — <span class="ex">أمّتكم</span></li><li><b>الأفعال:</b> <span class="ex">دمّر</span> — <span class="ex">يمنّيهم</span> — <span class="ex">تعضلوهنّ</span></li><li><b>الحروف:</b> <span class="ex">أنّ</span> — <span class="ex">ثمّ</span></li></ol>`},
{h:"صوت الغنة قابل للمط", b:`<p>وضعها العلماء مع حروف التوسط، أي حالة وسط بين جريان الصوت وعدم جريانه، وما قيل عن النون يقال عن الميم. ومن هنا نفهم أنه مادام النون والميم فيهما نصف رخو، فصوتهما قابل للمط والزيادة؛ فكم نمطه؟ يتضح هذا من معرفة مراتب الغنة.</p>`},
{h:"مراتب الغنة", b:`<ol><li><b>أكمل ما تكون:</b> في النون والميم المشددتين والمدغمتين، سواء كان إدغاماً كاملاً أو ناقصاً. نحو: <span class="ex">إنّ</span> — <span class="ex">عمّ</span> — <span class="ex">من ولي</span> — <span class="ex">من نذير</span> — <span class="ex">لكم ما كسبتم</span></li>
<li><b>غنة كاملة:</b> في النون والميم المخفاتين (إخفاء شفوي أو حقيقي أو قلب). نحو: <span class="ex">الأنثى</span> — <span class="ex">ترميهم بحجارة</span> — <span class="ex">من بعد</span></li>
<li><b>غنة ناقصة:</b> في النون والميم الساكنتين المُظهرتين، ولا بد من توافر هذين الشرطين (شرط السكون وشرط الإظهار). نحو: <span class="ex">أنعمت</span>، <span class="ex">العالمين</span> غنة النون وقفاً.</li>
<li><b>أنقص ما تكون:</b> في النون والميم المتحركتين. نحو: <span class="ex">المؤمنين</span> — <span class="ex">نصير</span>. والدليل على وجود الغنة في النون والميم المتحركتين أننا لو أغلقنا الخيشوم لاختل الصوت.</li></ol>`},
{h:"تنبيهات ومقدار الغنة وكيفية أدائها", b:`<ol><li>تمتاز الغنة عن باقي الصفات بوجود مخرج خاص بها.</li><li>تتبع الغنة ما بعدها تفخيماً وترقيقاً مع مراعاة مراتب التفخيم.</li></ol>
<p><b>مقدار الغنة:</b> قال البعض إن الغنة مقدارها حركتان، ولكن الصواب أن زمن الغنة يتناسب مع سرعة القارئ ويُضبط بالمشافهة، ويختلف زمنها حسب مرتبتها.</p>
<p><b>كيفية أداء الغنة:</b> تؤدى سلسة بدون تمطيط أو تطنين أو زيادة أو نقص عن مرتبتها.</p>`}
],

{type:"tf", q:"تكون الغنة أنقص ما تكون في النون والميم المشددتين.", a:false, why:"المشددتان أكمل ما تكون، وأنقص ما تكون في المتحركتين."},

/* ================= 12 ================= */
{id:"l12", unit:"المد والقصر", t:"المد والقصر والمد الطبيعي", yt:"أيمن سويد المد الطبيعي",
branches:[
{h:"تعريف المد والقصر", b:`<div class="duo"><div><b class="k">المد</b><span><b>لغةً:</b> الزيادة، قال تعالى: <em class="ex">ويمددكم بأموال وبنين</em> أي يزدكم.</span><span><b>اصطلاحاً:</b> إطالة الصوت بحرف المد أو اللين عند وجود سبب لذلك.</span></div>
<div><b class="k">القصر</b><span><b>لغةً:</b> الحبس أو المنع، قال تعالى: <em class="ex">حور مقصورات</em> أي محبوسات.</span><span><b>اصطلاحاً:</b> إثبات حرف المد بدون زيادة.</span></div></div>
<div class="note"><b>ملحوظة:</b> (١) القصر هو الأصل لأنه لا يحتاج إلى سبب. (٢) المد فرع منه لأنه يحتاج إلى سبب. (٣) إذا أُطلق لفظ القصر يعني المد الطبيعي.</div>`},
{h:"الدليل على المد من السنة", b:`<p>ما نُقل عن ابن مسعود رضي الله عنه أنه كان يُقرئ رجلاً، فقرأ الرجل: <span class="ex">إنما الصدقات للفقراء والمساكين</span> مرسلة (أي بدون مد)، فقال ابن مسعود: ما هكذا أقرأنيها رسول الله ﷺ. فقال: فكيف أقرأكها يا أبا عبد الرحمن؟ فقال: أقرأنيها هكذا <span class="ex">إنما الصدقات للفقراء والمساكين</span> فمدّها.</p>
<p>رواه الطبراني، وأخرجه سعيد بن منصور، وصححه السيوطي والألباني. قال الإمام ابن الجزري: "وهذا حديث جليل حجة ونص في هذا الباب، رجال إسناده ثقات".</p>`},
{h:"حروف المد", b:`<ol><li>الألف الساكنة المفتوح ما قبلها <span class="ex">قال</span>.</li><li>الواو الساكنة المضموم ما قبلها <span class="ex">يقول</span>.</li><li>الياء الساكنة المكسور ما قبلها <span class="ex">قيل</span>.</li></ol><p>وقد جُمعت بشروطها في كلمة: <span class="ex">نوحيها</span> <span class="ex">أوتينا</span> <span class="ex">أوذينا</span></p>`},
{h:"تقسيم المدود", b:`<div class="duo"><div><b class="k">ما يُمد حركتين</b><span>مد طبيعي — مد عوض — مد بدل — مد صلة صغرى</span></div><div><b class="k">ما يُمد أكثر من حركتين</b><span>مد لازم — مد واجب متصل — مد جائز منفصل (ويلحق به مد الصلة الكبرى) — مد عارض للسكون (ويلحق به مد اللين)</span></div></div>`},
{h:"المد الطبيعي", b:`<p><b>تعريفه:</b> هو أبو المدود وأولها، وهو المد الذي لا تقوم ذات الحرف إلا به ولا يتوقف على سبب. إذا قال الإنسان <span class="ex">قَ</span> وسألنا سامعاً ماذا سمعت يقول: قاف مفتوحة، ولو قلنا <span class="ex">قا</span> يقول: قاف مفتوحة بعدها ألف مد؛ فهذه الألف نشأت وبرزت إلى الوجود من إشباع صوت الفتحة.</p>
<p><b>أسماؤه:</b> مد طبيعي — مد أصلي — مد ذاتي — مد صيغة.</p>
<ol><li><b>طبيعي:</b> لأن صاحب الطبيعة السليمة لا يزيده ولا ينقصه عن مقداره.</li><li><b>أصلي:</b> لأنه أصل لجميع المدود ولا يتوقف على سبب.</li><li><b>ذاتي:</b> لأن ذات الحرف لا تقوم إلا به.</li><li><b>صيغة:</b> لأن صيغة حرف المد أي بنيته لا تقوم إلا عليه.</li></ol>`},
{h:"مد الصلة الصغرى", b:`<p><b>تعريفه:</b> صلة هاء الضمير الدالة على المفرد المذكر الغائب، المتحركة بالضم أو الكسر، والواقعة بين متحركين الثاني منهما ليس همزة قطع.</p>
<ol><li>إذا وقعت همزة قطع بعد صلة هاء الضمير يصبح مداً فرعياً ويسمى مد صلة كبرى، وإذا لم تقع الهمزة بعده يسمى مد صلة صغرى.</li><li>يسمى حرف المد (صلة هاء الضمير)، وتسمى الهاء (هاء الصلة).</li></ol>
<p><b>أمثلة:</b> <span class="ex">بعباده بصيرا</span> <span class="ex">له ملك السموات والأرض</span></p>
<ul><li><b>علاقته بالمد الطبيعي:</b> يلحق بالمد الطبيعي لأنه ثابت في الوصل فقط، أما عند الوقف فنقف بسكون الهاء.</li><li><b>سبب التسمية:</b> لأنه ثابت حال الوصل فقط.</li><li><b>مقداره:</b> يُمد بمقدار حركتين.</li><li><b>شروط هاء الصلة:</b> (١) متحركة (٢) واقعة بين متحركين.</li><li><b>ما يلحق بهاء الضمير:</b> اسم الإشارة <span class="ex">هذه</span>، ويطبق عليها نفس الحكم وبنفس الشروط.</li><li><b>الفرق بين هاء اسم الإشارة وهاء الضمير:</b> هاء اسم الإشارة لم تقع مضمومة، ولم تقع ساكنة وصلاً.</li><li><b>إذا انتفت شروط هاء الصلة:</b> في هذه الحالة لا يوجد مد صلة.</li></ul>`}
],

{id:"l13", unit:"المد والقصر", t:"المد الفرعي بسبب الهمز", yt:"أيمن سويد المد المتصل والمنفصل",
branches:[
{h:"المد الفرعي وأقسامه", b:`<p><b>تعريفه:</b> هو المد الزائد عن المد الطبيعي لوجود سبب ما. وينقسم إلى قسمين:</p>
<div class="duo"><div><b class="k">المد الفرعي اللفظي</b><span>هو إطالة الصوت بسبب همز أو سكون (وهو ما يخصنا).</span></div><div><b class="k">المد الفرعي المعنوي</b><span>هو إطالة الصوت بسبب معنوي. ليس لحفص من الشاطبية منه شيء.</span><span>المبالغة في النفي: <em class="ex">لا ريب فيه</em></span><span>المبالغة في التعظيم: <em class="ex">لا إله إلا الله</em> (مذهبهم قصر المنفصل)</span></div></div>
<div class="duo"><div><b class="k">بسبب الهمزة</b><span>(١) مد واجب متصل. (٢) مد جائز منفصل (يلحق به الصلة الكبرى).</span></div><div><b class="k">بسبب السكون</b><span>(١) المد اللازم. (٢) المد العارض للسكون. (٣) يلحق به مد اللين.</span></div></div>`},
{h:"المد الواجب المتصل", b:`<ul><li><b>تعريفه:</b> أن يأتي حرف المد وبعده همزة في كلمة واحدة.</li><li><b>مقداره:</b> يُمد بمقدار ٤ (توسط) أو ٥ (فويق المتوسط) حركات لحفص من الشاطبية.</li><li><b>حكمه:</b> واجب.</li><li><b>سُمّي واجباً:</b> لوجوب مده فوق المد الطبيعي عند جميع القراء، وإن اختلفوا في عدد الحركات.</li><li><b>سُمّي متصلاً:</b> لاتصال حرف المد بالهمزة في كلمة واحدة.</li><li><b>سبب مده:</b> لأن حرف المد ضعيف خفي والهمز قوي، فزيد في المد لتقوية حرف المد.</li></ul><p><b>أمثلة:</b> <span class="ex">جاءكم</span> <span class="ex">هنيئاً</span> <span class="ex">سوءاً</span></p>`},
{h:"المد الجائز المنفصل", b:`<ul><li><b>تعريفه:</b> أن يأتي حرف المد في آخر الكلمة الأولى وهمزة القطع في أول الكلمة الثانية.</li><li><b>مقداره:</b> يُمد بمقدار ٤ أو ٥ حركات لحفص من الشاطبية.</li><li><b>حكمه:</b> جائز لجواز قصره عند بعض القراء.</li><li><b>سُمّي جائزاً:</b> لجواز قصره عند بعض القراء. <b>سُمّي منفصلاً:</b> لانفصال حرف المد عن الهمز.</li><li><b>سبب مده:</b> لتقوية حرف المد عند مجاورته للهمز.</li><li><b>سبب قصره في بعض الروايات:</b> بسبب قصر حرف المد عند الوقف.</li></ul>`},
{h:"أقسام المد المنفصل", b:`<div class="duo"><div><b class="k">انفصال حقيقي</b><span>حرف المد ثابت رسماً ولفظاً <em class="ex">في أرض الله</em></span></div><div><b class="k">انفصال حكمي</b><span>حرف المد ثابت لفظاً دون رسم، ويكون في: (١) ها التنبيه <em class="ex">ها أنتم</em> <em class="ex">هؤلاء</em> (٢) يا النداء <em class="ex">يأيها</em></span></div></div>
<table class="t"><tr><th>المنفصل الحقيقي</th><th>المنفصل الحكمي</th></tr><tr><td>حرف المد ثابت لفظاً ورسماً</td><td>حرف المد ثابت لفظاً دون رسم</td></tr><tr><td>نقف على حرف المد بالقصر</td><td>لا يجوز الوقف على حرف المد</td></tr></table>`},
{h:"مد الصلة الكبرى", b:`<ul><li><b>تعريفه:</b> هو أن تأتي هاء الضمير الدالة على المفرد المذكر الغائب (المتحركة والواقعة بين متحركين) في آخر الكلمة الأولى، وهمزة القطع في أول الكلمة الثانية.</li><li><b>مقداره:</b> يتبع المد المنفصل.</li><li><b>علامة مد الصلة في المصحف:</b> وضع واو صغيرة <span class="ex">إنّهُۥ هو</span> أو ياء صغيرة لفظية <span class="ex">هذهِۦ أبدا</span>، وتُرسم الياء مثل رسمها في خط الثلث.</li></ul>`}
],
quiz:[
{type:"tf", q:"المد الفرعي المعنوي ليس لحفص من الشاطبية منه شيء.", a:true, why:"كالمبالغة في النفي (لا ريب فيه) والتعظيم (لا إله إلا الله)."},
{type:"tf", q:"المد الواجب المتصل يجوز قصره عند بعض القراء.", a:false, why:"المتصل واجب عند جميع القراء، والذي يجوز قصره هو المنفصل."},
{type:"mc", q:"مقدار المد المتصل لحفص من الشاطبية:", o:["حركتان","٤ أو ٥ حركات","٦ حركات لزوماً","٢ أو ٤ أو ٦"], a:1, why:"٤ توسط أو ٥ فويق المتوسط."},
{type:"mc", q:"المنفصل في (يأيها) انفصال:", o:["حقيقي","حكمي","متصل","لازم"], a:1, why:"يا النداء: حرف المد ثابت لفظاً دون رسم."},
{type:"fill", q:"مقدار مد الصلة الكبرى يتبع المد ____", o:["المنفصل","المتصل","اللازم","العارض"], a:0, why:"الصلة الكبرى تلحق بالمنفصل وتتبعه في المقدار."}
]},

/* ================= 14 ================= */
{id:"l14", unit:"المد والقصر", t:"المد العارض للسكون ومد اللين", yt:"أيمن سويد المد العارض للسكون ومد اللين",
branches:[
{h:"المد العارض للسكون", b:`<ul><li><b>تعريفه:</b> هو أن يكون حرف المد هو الحرف القبل الأخير من الكلمة، ونقف على الحرف الأخير بالسكون العارض.</li><li><b>سبب التسمية:</b> لعروض السكون عند الوقف.</li><li><b>مقداره:</b> يُمد ٢ أو ٤ أو ٦ حركات، أما عند الوصل فيسقط المد العارض ويُمد الحرف حركتين كمد طبيعي.</li><li><b>حكمه:</b> جائز.</li></ul>
<table class="t"><tr><th>الوجه</th><th>العلة</th></tr><tr><td>القصر (٢)</td><td>مراعاة لأصله وهو القصر، وعدم الاعتداد بالعارض</td></tr><tr><td>التوسط (٤)</td><td>لاجتماع ساكنين، ولكون الساكن الثاني سكونه عارض، فجُعل أدنى من اللازم</td></tr><tr><td>الإشباع (٦)</td><td>تشبيهاً باللازم لاجتماع ساكنين</td></tr></table>
<p><b>أمثلة عند الوقف:</b> <span class="ex">العالمين</span> <span class="ex">الرحيم</span> <span class="ex">الظالمون</span></p>`},
{h:"مد اللين", b:`<ul><li><b>تعريفه:</b> هو أن يكون حرف اللين هو الحرف القبل الأخير من الكلمة، ونقف على الحرف الأخير بالسكون العارض.</li><li><b>مقداره:</b> يُمد ٢ أو ٤ أو ٦ حركات، أما عند الوصل فيسقط مد اللين ويُمد حرف اللين مداً ما دون المد الطبيعي ويُضبط بالمشافهة.</li><li><b>حكمه:</b> جائز.</li><li><b>سبب التسمية:</b> لأن الحرف قبل الأخير هو حرف لين.</li></ul><p><b>أمثلة عند الوقف:</b> <span class="ex">خوف</span> <span class="ex">بيت</span> <span class="ex">السوء</span></p>`},
{h:"الفرق بين المد العارض ومد اللين", b:`<table class="t"><tr><th>مد اللين</th><th>المد العارض</th></tr><tr><td>حرفان فقط وهما حرفا اللين</td><td>ثلاثة أحرف وهي أحرف المد</td></tr><tr><td>الأحرف ساكنة ما قبلها مفتوح</td><td>الأحرف ساكنة ما قبلها حركة مجانسة لها</td></tr><tr><td>حال الوصل يُمد مداً ما دون الطبيعي</td><td>حال الوصل يكون مداً طبيعياً</td></tr></table>`},
{h:"لماذا يُمد حرف اللين ما دون الطبيعي؟", b:`<p>زمن الحروف المدية يبدأ من أول النطق بحركة ما قبلها لأنها مجانسة لها <span class="ex">قال</span>، بينما زمن حرف اللين يبدأ من بعد الانتهاء من فتحة ما قبله.</p>
<div class="note"><b>ملحوظة:</b> المد العارض أقوى من مد اللين؛ لأن حرف المد أقوى من حرف اللين، فيكون مد اللين هو المشبّه والمد العارض مشبّهاً به، فيكون عدد حركات العارض أكبر من أو تساوي اللين، كما سيرد ذكره بإذن الله في مراتب المدود.</div>`}
],
quiz:[
{type:"tf", q:"عند الوصل يسقط المد العارض ويُمد حرف المد حركتين كمد طبيعي.", a:true, why:"العارض يكون عند الوقف فقط."},
{type:"tf", q:"مد اللين أقوى من المد العارض.", a:false, why:"العارض أقوى لأن حرف المد أقوى من حرف اللين."},
{type:"mc", q:"علة الإشباع (٦ حركات) في المد العارض:", o:["مراعاة لأصله وهو القصر","تشبيهاً باللازم لاجتماع ساكنين","لأن الساكن الثاني عارض","لوجود همز بعده"], a:1, why:"الإشباع تشبيهاً باللازم لاجتماع ساكنين."},
{type:"mc", q:"من أمثلة مد اللين عند الوقف:", o:["العالمين","خوف","جاءكم","الضالين"], a:1, why:"(خوف): الواو حرف لين قبل الحرف الأخير الموقوف عليه."},
{type:"fill", q:"حروف اللين حرفان، وحروف المد ____ أحرف.", o:["ثلاثة","أربعة","ستة","سبعة"], a:0, why:"حروف المد ثلاثة: الألف والواو والياء."}
]},

/* ================= 15 ================= */
{id:"l15", unit:"المد والقصر", t:"المد اللازم الكلمي ومد الفرق", yt:"أيمن سويد المد اللازم الكلمي",
branches:[
{h:"المد اللازم", b:`<ul><li><b>تعريفه:</b> هو أن يأتي حرف المد وبعده حرف ساكن سكوناً أصلياً.</li><li><b>معنى السكون الأصلي:</b> ثابت وصلاً ووقفاً.</li><li><b>مقداره:</b> يُمد ٦ حركات لزوماً عند جميع القراء.</li><li><b>سبب التسمية:</b> (١) للزوم مده ٦ حركات عند جميع القراء. (٢) للزوم سببه وهو السكون الأصلي وصلاً ووقفاً.</li><li><b>حكمه:</b> لزوم مده ٦ حركات لجميع القراء، وعدم جواز القصر والتوسط.</li></ul>
<div class="duo"><div><b class="k">مد لازم كلمي</b><span>كلمي مثقل — كلمي مخفف</span></div><div><b class="k">مد لازم حرفي</b><span>حرفي مثقل — حرفي مخفف</span></div></div>`},
{h:"المد اللازم الكلمي المثقل", b:`<ul><li><b>تعريفه:</b> هو أن يأتي حرف المد وبعده حرف ساكن سكوناً أصلياً مشدداً في كلمة.</li><li><b>أمثلة:</b> <span class="ex">الحاقّة</span> <span class="ex">صوافّ</span> <span class="ex">الضالّين</span> <span class="ex">ءالذكرين</span> <span class="ex">ءالله</span></li></ul>
<div class="note"><b>ملحوظة:</b> الحرف المشدد عبارة عن حرفين أولهما ساكن.</div>
<ul><li><b>مقداره:</b> يُمد ٦ حركات لزوماً عند جميع القراء.</li><li><b>حكمه:</b> لزوم مده ٦ حركات لجميع القراء وعدم جواز القصر والتوسط.</li><li><b>سُمّي لازماً:</b> للزوم مده ٦ حركات ولزوم سببه وهو السكون وصلاً ووقفاً. <b>كلمياً:</b> لاجتماع حرف المد والسكون في كلمة. <b>مثقلاً:</b> لأن الحرف الساكن مشدد.</li></ul>`},
{h:"المد اللازم الكلمي المخفف", b:`<ul><li><b>تعريفه:</b> هو أن يأتي حرف المد وبعده حرف ساكن سكوناً أصلياً مخففاً.</li><li><b>موضعه:</b> في كلمة واحدة في موضعين <span class="ex">ءالآن</span> في سورة يونس.</li><li><b>مقداره:</b> يُمد ٦ حركات لزوماً لجميع القراء.</li><li><b>سُمّي مخففاً:</b> لأن الحرف الساكن ليس مدغماً.</li></ul>`},
{h:"مد الفرق", b:`<p><b>صورة من صور المد اللازم</b>، وذلك في ٣ كلمات في ٦ مواضع فقط.</p>
<p><b>الشرح:</b> عندما تدخل همزة القطع للاستفهام على همزة الوصل في الاسم المعرّف بـ(ال) التعريف، فلا يجوز حذف همزة الوصل حتى لا يلتبس الاستفهام بالخبر، ولا يجوز النطق بالهمزتين معاً، ولكن يجوز لحفص وجهان:</p>
<ol><li><b>إبدال</b> همزة الوصل ألفاً مدية تُمد ٦ حركات لزوماً، وذلك لملاقاتها لام التعريف الساكنة (مد لازم كلمي).</li><li><b>تسهيل</b> همزة الوصل بين الهمزة والألف مع عدم المد مطلقاً.</li></ol>
<p><b>لماذا لُقّب بمد الفرق؟</b> لأنه يفرّق بين الاستفهام والخبر.</p>
<table class="t"><tr><th>الكلمة</th><th>مواضعها</th><th>نوعه</th></tr><tr><td class="ex">ءالذكرين</td><td>الأنعام ١٤٣، ١٤٤</td><td>لازم كلمي مثقل</td></tr><tr><td class="ex">ءالله</td><td>يونس ٥٩، النمل ٥٩</td><td>لازم كلمي مثقل</td></tr><tr><td class="ex">ءالآن</td><td>يونس ٥١، ٩١</td><td>لازم كلمي مخفف</td></tr></table>`}
],

{type:"fill", q:"يقع مد الفرق في ٣ كلمات في ____ مواضع.", o:["٦","٣","٤","٩"], a:0, why:"ءالذكرين، ءالله، ءالآن، كل كلمة في موضعين."}
]},

/* ================= 16 ================= */
{id:"l16", unit:"المد والقصر", t:"المد اللازم الحرفي ومراتب المدود", yt:"أيمن سويد المد اللازم الحرفي",
branches:[
{h:"مقدمة: الحروف المقطعة", b:`<p>جرت عادة القراء عندما يصلون إلى مبحث المد اللازم أن يتعرضوا للحروف المقطعة التي بدأ الله عز وجل بها بعض السور في القرآن الكريم، وتسمى هذه الأحرف <b>بالأحرف النورانية</b>، وعددها <b>أربعة عشر حرفاً</b>، وأتت في بداية <b>تسع وعشرين سورة</b>.</p>
<p>جمعها الشيخ سليمان الجمزوري في منظومة تحفة الأطفال بقوله: <span class="ex">صله سحيراً من قطعك</span>. والأجمل من هذا من قال: <span class="ex">نص حكيم له سر قاطع</span>، أي أن هذه الأحرف ليست عبثاً. وهذا من التوفيق أنه جمع هذه الأحرف في هذه العبارة؛ فبعض الناس يسألون عن معنى هذه الحروف ولكن معناها عند الله. قال تعالى: <span class="ex">والراسخون في العلم يقولون آمنا به كل من عند ربنا</span> (آل عمران ٧).</p>
<div class="note">هناك فرق بين نطق الحرف واسم الحرف؛ مثال: ق اسمه (قاف) ونطقه (قَ). وفي الأحرف المقطعة نقرأ اسمها الذي يتكون دائماً إما من حرفين أو ثلاثة أحرف.</div>`},
{h:"تقسيم الأحرف المقطعة من حيث المد", b:`<ol><li><b>الألف:</b> تُقرأ (ألف) وليس بها مد.</li>
<li><b>حي طهر:</b> تُقرأ (حا، يا، طا، ها، را). في اللغة العربية وردت مهموزة وغير مهموزة (حاء أو حا)، أما في القرآن فقد وردت بترك الهمزة فقط؛ فهي عبارة عن حرفين ثانيهما حرف مد يُمد حركتين، ويسمى <b>مداً طبيعياً حرفياً</b>.</li>
<li><b>سنقص لكم:</b> تُنطق على ثلاثة أحرف أوسطها حرف مد وثالثها ساكن أصلي، نحو (سين، نون، قاف):<br>• إذا كان ثالثها ساكناً مخففاً ← مد لازم حرفي مخفف يُمد ٦ حركات.<br>• إذا كان ثالثها ساكناً مشدداً ← مد لازم حرفي مثقل يُمد ٦ حركات.</li>
<li><b>العين:</b> تُنطق على ثلاثة أحرف أوسطها حرف لين وثالثها ساكن أصلي، تُمد ٤ أو ٦ حركات لحفص من الشاطبية، وتُمد ٢ أو ٤ أو ٦ حركات لحفص من طيبة النشر.</li></ol>`},
{h:"تعريف المد اللازم الحرفي", b:`<div class="duo"><div><b class="k">اللازم الحرفي المثقل</b><span>أن يأتي حرف المد وبعده ساكن أصلي مشدد.</span><span><b>مقداره:</b> يُمد ٦ حركات لزوماً.</span></div><div><b class="k">اللازم الحرفي المخفف</b><span>أن يأتي حرف المد وبعده ساكن أصلي مخفف.</span><span><b>مقداره:</b> يُمد ٦ حركات لزوماً.</span></div></div>`},
{h:"ماذا يسمى المد في (العين)؟", b:`<p>علمنا أن المد في (حي طهر) يسمى مداً طبيعياً حرفياً، وأن المد في (سنقص لكم) يسمى مداً لازماً حرفياً؛ فلكي نجيب لابد من معرفة وجه الشبه والاختلاف بين العين وكلٍّ من مد اللين والمد اللازم.</p>

const GS_CODE = "// سكربت موقع رياض التجويد — يحفظ إعدادات الموقع ونتائج الطالبات في هذا الجدول\n// ١) غيّري كلمة المرور في السطر التالي (هي كلمة دخول المعلمة إلى الموقع)\nconst PASSWORD = \"اكتبي_كلمة_المرور_هنا\";\n\nfunction sheet_(name) {\n  const ss = SpreadsheetApp.getActive();\n  return ss.getSheetByName(name) || ss.insertSheet(name);\n}\nfunction out_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\nfunction readState_() {\n  const sh = sheet_(\"إعدادات_الموقع\");\n  const n = sh.getLastRow();\n  if (!n) return null;\n  const s = sh.getRange(1, 1, n, 1).getValues().map(r => String(r[0]).slice(1)).join(\"\");\n  return s ? JSON.parse(s) : null;\n}\n\nfunction doGet() {\n  return out_({ ok: true, state: readState_() });\n}\n\nfunction doPost(e) {\n  const b = JSON.parse((e.postData && e.postData.contents) || \"{}\");\n  const lock = LockService.getScriptLock();\n  lock.waitLock(15000);\n  try {\n    if (b.action === \"result\") {\n      const sh = sheet_(\"النتائج\");\n      if (sh.getLastRow() === 0) sh.appendRow([\"الوقت\", \"اسم الطالبة\", \"الصف\", \"الدرس\", \"الدرجة\", \"الأسئلة الخاطئة\", \"رقم الطالبة\", \"رقم الدرس\", \"المحاولة\", \"التفاصيل\", \"الجهاز\"]);\n      const r = b.result || {};\n      sh.appendRow([new Date(), r.name, r.group, r.lesson, r.score, r.wrong, r.mid, r.lid, r.attempt, r.details, r.device]\n        .map(v => v == null ? \"\" : typeof v === \"string\" && /^[=+\\-@]/.test(v) ? \"'\" + v : v));\n      return out_({ ok: true });\n    }\n    if (String(b.pass) !== PASSWORD) return out_({ ok: false, error: \"pass\" });\n    if (b.action === \"check\") return out_({ ok: true });\n    if (b.action === \"save\") {\n      const s = JSON.stringify(b.state);\n      const sh = sheet_(\"إعدادات_الموقع\");\n      sh.clear();\n      const parts = [];\n      for (let i = 0; i < s.length; i += 40000) parts.push([\"~\" + s.slice(i, i + 40000)]);\n      if (parts.length) sh.getRange(1, 1, parts.length, 1).setValues(parts);\n      return out_({ ok: true });\n    }\n    if (b.action === \"results\") {\n      const sh = sheet_(\"النتائج\");\n      const n = sh.getLastRow();\n      const rows = n > 1 ? sh.getRange(2, 1, n - 1, 11).getDisplayValues() : [];\n      return out_({ ok: true, rows: rows.slice(-5000) });\n    }\n    return out_({ ok: false, error: \"action\" });\n  } finally {\n    lock.releaseLock();\n  }\n}\n";

/* simple hash for the standalone teacher password (deters casual access only) */
function hashPass(p){ let h1 = 0x811c9dc5, h2 = 0x1b873593; for (const ch of "tajweed:" + p){ const c = ch.codePointAt(0); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2654435761); } return (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16); }

/* ---- direct saving through the teacher's Google Apps Script ---- */
const cloudUrl = st => { const u = (st || ST).cloud?.url || ""; return /^https:\/\/script\.google(usercontent)?\.com\//.test(u) ? u : ""; };
async function cloudCall(url, payload, ms = 20000){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = payload ? await fetch(url, { method:"POST", body: JSON.stringify(payload), signal: ctl.signal })
                      : await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), { signal: ctl.signal });
    return await r.json();
  } finally { clearTimeout(t); }
}
const EMBED_CLOUD = (() => { try { return JSON.parse(document.getElementById("state").textContent || "{}").cloud?.url || ""; } catch(e) { return ""; } })();
let CLOUD_STATUS = "";
function merge(base, over){
  if (Array.isArray(base) || typeof base !== "object" || base === null) return over === undefined ? base : over;
  const out = { ...base };
  for (const k in (over || {})) out[k] = (k in base) ? merge(base[k], over[k]) : over[k];
  return out;
}

        catch(e){ CLOUD_STATUS = "fail"; }

function perms(){

}

      renderChrome(); renderNav(); return true;
    } catch(e){ say("تعذر تنزيل الملف: " + (e?.message || ""), "dirty"); return false; }
  }
  if (!ART) { say("الحفظ متاح فقط عند فتح الموقع بحساب المعلمة داخل Claude.", "dirty"); return false; }
  say("جارٍ النشر للجميع…");
  try { await ART.publish(buildDoc(state)); say("تم النشر ✓ سيتحدّث الموقع الآن."); return true; }
  catch(e){
    const c = e?.code;
    say(c === "conflict" ? "تحدّث الموقع من مكان آخر قبل الحفظ، أعيدي التعديل بعد إعادة التحميل."
      : (c === "not_granted" || c === "not_writer") ? "ليست لديكِ صلاحية النشر من هذا الحساب."
      : "تعذر النشر: " + (e?.message || "حاولي مرة أخرى"), "dirty");
    return false;
  }
}

/* --- quiz --- */
function shuffleIdx(n){ const a = [...Array(n).keys()]; for (let i = n-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const TAG = { tf:"صح أو خطأ", mc:"اختيار من متعدد", fill:"أكملي الفراغ" };
function renderQuiz(l, p){
  l = { ...l, i: LESSONS.findIndex(x => x.id === l.id) };
  const f = $("#qform");
  const order = l.quiz.map(q => q.o ? shuffleIdx(q.o.length) : null);
  f.innerHTML = l.quiz.map((q, i) => {
    let inner = "";
    if (q.type === "tf") inner = `<div class="opts">${[["true","صح"],["false","خطأ"]].map(([v,t]) => `<label class="opt"><input type="radio" name="q${i}" value="${v}"><span>${t}</span></label>`).join("")}</div>`;
    if (q.type === "mc") inner = `<div class="opts col">${order[i].map(k => `<label class="opt"><input type="radio" name="q${i}" value="${k}"><span>${esc(q.o[k])}</span></label>`).join("")}</div>`;
    const qt = q.type === "fill"
      ? `<span class="qtxt fill">${esc(q.q).replace("____", `<select name="q${i}" aria-label="اختاري الكلمة المناسبة"><option value="">اختاري…</option>${order[i].map(k => `<option value="${k}">${esc(q.o[k])}</option>`).join("")}</select>`)}</span>`
      : `<span class="qtxt">${esc(q.q)}</span>`;
    return `<fieldset class="q" id="q${i}" style="margin:0"><div class="qtop"><span class="qtag">${AR(i+1)} · ${TAG[q.type]}</span></div>${qt}${inner}<div class="fb" hidden></div></fieldset>`;
  }).join("") + `<div class="qactions"><button class="btn btn-main" type="submit">صحّحي إجاباتي</button><span class="warn" id="qwarn" role="status"></span></div><div id="qres"></div>`;
  f.onsubmit = e => { e.preventDefault(); grade(l, p); };
}
function grade(l, p){
  const ans = l.quiz.map((q, i) => { const el = document.querySelector(`[name=q${i}]:checked`) || document.querySelector(`select[name=q${i}]`); return el && el.value !== "" ? el.value : null; });
  const missing = ans.filter(a => a === null).length;
  if (missing){ $("#qwarn").textContent = `أجيبي عن كل الأسئلة أولاً (بقي ${AR(missing)})`; return; }
  $("#qwarn").textContent = "";
  const show = ST.quiz.showAnswers;
  let score = 0; const wrong = [], details = [];
  l.quiz.forEach((q, i) => {
    const a = ans[i];
    const ok = q.type === "tf" ? (a === "true") === q.a : Number(a) === Number(q.a);
    if (ok) score++; else wrong.push(AR(i+1) + "- " + q.q.replace("____", "…"));
    details.push({ q: q.q, y: q.type === "tf" ? (a === "true" ? "صح" : "خطأ") : q.o[Number(a)], r: q.type === "tf" ? (q.a ? "صح" : "خطأ") : q.o[q.a], ok });
    const box = $("#q" + i); box.classList.add(ok ? "ok" : "bad"); box.disabled = true;
    const yours = q.type === "tf" ? (a === "true" ? "صح" : "خطأ") : q.o[Number(a)];
    const right = q.type === "tf" ? (q.a ? "صح" : "خطأ") : q.o[q.a];
    const fb = box.querySelector(".fb"); fb.hidden = false;
    fb.innerHTML = ok ? `<span class="mark">✓ إجابة صحيحة</span>${show && q.why ? `<span>${esc(q.why)}</span>` : ""}`
      : `<span class="mark">✗ إجابتكِ: ${esc(yours)}</span>${show ? `<span>الإجابة الصحيحة: <span class="right">${esc(right)}</span></span>${q.why ? `<span>${esc(q.why)}</span>` : ""}` : `<span>راجعي هذا الجزء في الخريطة الذهنية.</span>`}`;
  });
  let sendNote = "";
  if (!PREVIEW){
    SCORES[l.id] = Math.max(SCORES[l.id] ?? 0, score); lsSet("tajweed-scores", SCORES); renderNav();
    const tries = lsGet("tajweed-tries", {}); tries[l.id] = (tries[l.id] || 0) + 1; lsSet("tajweed-tries", tries);
    if (!isTeacher() && cloudUrl()){
      const m = SESS?.role === "member" ? ST.members.find(x => x.id === SESS.mid) : null;
      sendResult({ name: SESS?.name || "", group: m ? (m.group || "") : "بدون رمز", mid: m ? m.id : "", device: DEVICE,
        lesson: `الدرس ${l.i + 1}: ${l.t}`, lid: l.id, attempt: tries[l.id], score, wrong: wrong.length ? wrong.join(" | ") : "لا يوجد",
        details: JSON.stringify(details) })
        .then(ok => { const n = $("#sendNote"); if (n) n.textContent = ok ? "أُرسلت نتيجتكِ إلى المعلمة ✓" : "تعذر إرسال النتيجة للمعلمة، تأكدي من الاتصال بالإنترنت."; });
      sendNote = `<p class="vnote" id="sendNote">جارٍ إرسال نتيجتكِ إلى المعلمة…</p>`;
    }
  }
  const pr = ST.quiz.praise[score >= 5 ? 5 : score === 4 ? 4 : score === 3 ? 3 : 0] || [];
  const msg = pr.length ? pick(pr) : "";
  const C = 2 * Math.PI * 44;
  const canRetry = ST.quiz.retry && p.retry !== false;
  $("#qres").innerHTML = `<div class="result" role="status">
    <svg class="ring" viewBox="0 0 110 110" aria-label="درجتكِ ${score} من 5"><defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="var(--rose)"/><stop offset="1" stop-color="var(--violet)"/></linearGradient></defs>
    <circle cx="55" cy="55" r="44" fill="none" stroke="var(--line)" stroke-width="10"/>
    <circle cx="55" cy="55" r="44" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*score/5} ${C}" transform="rotate(-90 55 55)"/>
    <text x="55" y="64" text-anchor="middle" font-size="26">${AR(score)}/٥</text></svg>
    <div style="flex:1;min-width:200px"><h3>${score === 5 ? "درجة كاملة" : "درجتكِ " + AR(score) + " من ٥"}</h3>${msg ? `<p class="bloom">${esc(msg)}</p>` : ""}
    ${score < 5 ? `<p>راجعي الأسئلة المظللة باللون الأحمر${show ? " لتري تصحيحها" : ""}.</p>` : ""}${sendNote}</div>
    ${canRetry ? `<button class="btn btn-soft" type="button" id="retry">أعيدي الاختبار</button>` : ""}</div>`;
  if ($("#retry")) $("#retry").onclick = () => { renderQuiz(l, p); $("#qt").scrollIntoView({ behavior:"smooth" }); };
  $("#qres").scrollIntoView({ behavior:"smooth", block:"center" });
}

/* ================= results ================= */
async function sendResult(vals){
  try { const x = await cloudCall(cloudUrl(), { action:"result", result: vals }); return !!x?.ok; } catch(e){ return false; }
}
/* ================= progress ================= */
function renderProgress(){
  const vis = visibleIdx();
  const total = vis.reduce((a, i) => a + (SCORES[LS(i).id] || 0), 0), max = vis.length * 5;
  const done = vis.filter(i => SCORES[LS(i).id] != null).length;
  const allGood = vis.length && vis.every(i => (SCORES[LS(i).id] || 0) >= 4);
  $("#view").innerHTML = `
  <section class="hero"><div><span class="eyebrow">تقدّمي</span><h1>رحلتكِ في التجويد</h1></div><span class="count">${AR(done)} من ${AR(vis.length)} دروس مختبرة</span></section>
  <section class="panel"><h3>مجموع درجاتكِ: ${AR(total)} من ${AR(max)}</h3><div class="bar big-bar"><i style="width:${max ? Math.round(total/max*100) : 0}%"></i></div>
   <p class="vnote">تُحفظ درجاتكِ على هذا الجهاز فقط. أعلى درجة في كل درس هي التي تُحسب.</p></section>
  ${allGood ? `<section class="cert"><span class="eyebrow">شهادة إتمام</span><h2>تشهد ${esc(ST.site.name)} بأن الطالبة</h2><div class="nm">${esc(SESS?.name || "")}</div>
    <p>أتمّت جميع دروسها بدرجة ٤ فأكثر في كل درس. بارك الله فيكِ ونفع بكِ.</p><b style="color:var(--rose);font-family:var(--f-display);font-size:1.2rem">${esc(ST.site.teacher)}</b></section>`
   : `<p class="vnote">عند حصولكِ على ٤ من ٥ فأكثر في كل الدروس تظهر لكِ شهادة إتمام باسمكِ.</p>`}
  <section class="prog">${vis.map(i => { const l = LS(i), s = SCORES[l.id]; return `<a class="prow" href="#${l.id}"><span>${AR(i+1)}. ${esc(l.t)}</span><span class="bar"><i style="width:${(s||0)*20}%"></i></span><b>${s != null ? AR(s) + "/٥" : "—"}</b></a>`; }).join("")}</section>`;
}
