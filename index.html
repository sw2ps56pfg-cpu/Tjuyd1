<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تجويد أ. نهى</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Kufi+Arabic:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: one lesson per "slide" card, lesson index rail on the start side, gradient pink→violet identity */
:root{
  --bg:#fcf6fa; --surface:#ffffff; --surface2:#f7eff8; --ink:#3b2342; --muted:#86688c; --line:#ecd9ec;
  --pink:#e0559a; --violet:#8a55d6; --rose:#f6c6dd; --lav:#e8dcfa; --blush:#fde7f1; --mint:#2f9e7a; --mint-bg:#e3f6ef; --red:#d23f63; --red-bg:#fde6ec;
  --grad:linear-gradient(120deg,#f07bb0 0%,#c06ad8 55%,#8a55d6 100%);
  --grad-soft:linear-gradient(135deg,#fde7f1 0%,#efe4fb 100%);
  --head-ink:linear-gradient(90deg,#d6408c,#7f4bd0);
  --shadow:0 10px 30px -12px rgba(138,85,214,.35);
  --f-display:"Noto Kufi Arabic","Tajawal",system-ui,sans-serif;
  --f-body:"Tajawal","Noto Kufi Arabic",system-ui,sans-serif;
  --f-quran:"Amiri Quran","Amiri","Traditional Arabic",serif;
  --r:22px; --maxw:1240px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1220; --surface:#261a2e; --surface2:#2f2238; --ink:#f6e8f4; --muted:#bfa3c4; --line:#463355;
  --pink:#f58bbd; --violet:#b892f2; --rose:#5a2e48; --lav:#3a2b55; --blush:#3d2234; --mint:#6fd5ae; --mint-bg:#1d3a31; --red:#ff8aa6; --red-bg:#43202b;
  --grad:linear-gradient(120deg,#c94b8d 0%,#9a4fbf 55%,#6c3fb8 100%);
  --grad-soft:linear-gradient(135deg,#3a2233 0%,#2e2445 100%);
  --head-ink:linear-gradient(90deg,#ff9ccb,#c6a2ff);
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1220; --surface:#261a2e; --surface2:#2f2238; --ink:#f6e8f4; --muted:#bfa3c4; --line:#463355;
  --pink:#f58bbd; --violet:#b892f2; --rose:#5a2e48; --lav:#3a2b55; --blush:#3d2234; --mint:#6fd5ae; --mint-bg:#1d3a31; --red:#ff8aa6; --red-bg:#43202b;
  --grad:linear-gradient(120deg,#c94b8d 0%,#9a4fbf 55%,#6c3fb8 100%);
  --grad-soft:linear-gradient(135deg,#3a2233 0%,#2e2445 100%);
  --head-ink:linear-gradient(90deg,#ff9ccb,#c6a2ff);
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs,17px);line-height:1.85;direction:rtl;
  background-image:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--pink) 14%,transparent),transparent 38%),radial-gradient(circle at 0 100%,color-mix(in srgb,var(--violet) 14%,transparent),transparent 40%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.5}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:12px;padding-block:10px;max-width:var(--maxw);margin:0 auto;flex-wrap:wrap;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:18px}
.brand .mark{width:36px;height:36px;flex:none}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);line-height:1.2}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--grad-soft);border:1px solid var(--line);font-size:14px;font-weight:700}
.btn{border:0;border-radius:14px;padding:9px 16px;font-weight:700;background:var(--surface2);color:var(--ink);border:1px solid var(--line);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--shadow)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 12px;font-size:14px;border-radius:11px}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* gate */
.gate{max-width:960px;margin:0 auto;padding-block:40px 60px}
.gate-hero{text-align:center;display:grid;gap:10px;justify-items:center;margin-bottom:28px}
.gate-hero h1{font-size:clamp(28px,5vw,44px);font-weight:800;background:var(--head-ink);-webkit-background-clip:text;background-clip:text;color:transparent}
.gate-hero p{color:var(--muted);margin:0;max-width:52ch}
.star{width:84px;height:84px}
.gate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.card h2{font-size:21px;margin-bottom:6px}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:14px;font-weight:700;color:var(--muted)}
.inp{width:100%;padding:10px 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface2);min-width:0}
.inp:focus{border-color:var(--violet);outline:none}
textarea.inp{min-height:180px;line-height:1.7;resize:vertical;font-size:15px}
.err{color:var(--red);font-size:14px;min-height:1.5em;margin:4px 0 0}
.note{font-size:14px;color:var(--muted)}
.info{background:var(--grad-soft);border:1px dashed var(--violet);border-radius:16px;padding:12px 16px;font-size:15px}

/* deck */
.deck{display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px;max-width:var(--maxw);margin:0 auto;padding-block:20px 110px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);align-self:start;max-height:calc(100vh - 100px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.rail h4{font-size:13px;color:var(--muted);margin:12px 8px 4px;font-weight:700}
.ritem{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:right;background:none;border:0;padding:8px 10px;border-radius:12px;font-size:15px;line-height:1.5}
.ritem:hover{background:var(--surface2)}
.ritem.on{background:var(--grad-soft);font-weight:700}
.ritem .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--lav);color:var(--violet)}
.ritem.on .n{background:var(--grad);color:#fff}
.ritem .sc{margin-inline-start:auto;flex:none;font-size:12px;font-weight:800;color:var(--mint);background:var(--mint-bg);border-radius:8px;padding:0 6px}
.rail-toggle{display:none}
.slide{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;animation:in .35s ease}
@keyframes in{from{transform:translateY(8px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}}
.hero{background:var(--grad);color:#fff;padding:26px 28px 22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{content:"";position:absolute;inset:-50px auto auto -30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero .unit{font-size:14px;opacity:.92;font-weight:700}
.hero h2{font-size:clamp(22px,3.4vw,32px);font-weight:800;margin-top:4px;position:relative;z-index:1}
.hero .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.hero .row a,.hero .row button{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:12px;padding:6px 14px;font-weight:700;font-size:14px;text-decoration:none}
.jump{position:sticky;top:calc(env(safe-area-inset-top,0px) + 65px);z-index:5;display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:10px 22px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.jump button{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:3px 14px;font-size:14px;font-weight:700}
.sbody{padding:8px 28px 30px;display:grid;gap:26px;container-type:inline-size}
.ct{max-width:78ch}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(40,15,45,.35)}
.blk>h3.bt{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px;margin:18px 0 12px}
.blk>h3.bt .ico{width:34px;height:34px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none}
.blk>h3.bt .ico svg{width:19px;height:19px}

/* content */
.ct h3.sec{font-size:19px;font-weight:800;margin:22px 0 8px;background:var(--head-ink);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content;max-width:100%}
.ct p{margin:6px 0}
.ct b{font-weight:800;color:var(--violet)}
.ct ul,.ct ol{margin:6px 0;padding-inline-start:26px}
.ct ul li{list-style:none;position:relative}
.ct ul li::before{content:"";position:absolute;inset-inline-start:-18px;top:.78em;width:8px;height:8px;border-radius:50% 0 50% 50%;background:var(--pink);transform:rotate(45deg)}
.ct ol li::marker{color:var(--pink);font-weight:800}
.ayah{font-family:var(--f-quran);color:var(--violet);font-size:1.12em;white-space:nowrap}
.ex{background:var(--blush);color:var(--pink);font-weight:700;border-radius:8px;padding:0 6px;white-space:nowrap}
.box{border-radius:16px;padding:12px 16px 12px;margin:10px 0;border:1px solid var(--line)}
.box .lbl{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:14px;margin-bottom:2px}
.box.tip{background:var(--lav)}
.box.tip .lbl{color:var(--violet)}
.box.nt{background:var(--blush)}
.box.nt .lbl{color:var(--pink)}
.qa{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:8px 0;background:var(--surface2);border-radius:14px;padding:10px 14px}
.qa .k{font-weight:800;color:var(--pink)}
.qa .k.a{color:var(--violet)}
.poem{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;font-family:var(--f-quran);font-size:1.08em;text-align:center;background:var(--grad-soft);border-radius:14px;padding:10px 14px;margin:8px 0}
.tbl{overflow-x:auto;margin:10px 0;border-radius:14px;border:1px solid var(--line)}
.tbl table{border-collapse:collapse;width:100%;min-width:420px;font-size:15px}
.tbl th{background:var(--grad);color:#fff;font-family:var(--f-display);font-weight:700;padding:8px 10px}
.tbl td{padding:7px 10px;border-top:1px solid var(--line);text-align:center}
.tbl tr:nth-child(even) td{background:var(--surface2)}

/* mind map */
.mm{display:grid;grid-template-columns:1fr auto 1fr;gap:16px 26px;align-items:center;padding:18px;border-radius:22px;background:var(--grad-soft);position:relative}
.mm .col{display:grid;gap:14px;min-width:0}
.mm .center{width:min(200px,40vw);aspect-ratio:1;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;text-align:center;padding:16px;font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.5;box-shadow:0 0 0 8px color-mix(in srgb,var(--pink) 22%,transparent),var(--shadow);max-width:100%}
.br{background:var(--surface);border-radius:18px;border:2px solid var(--c);padding:10px 12px;position:relative;min-width:0}
.col.r .br::after,.col.l .br::after{content:"";position:absolute;top:50%;width:26px;height:2px;background:var(--c)}
.col.r .br::after{left:-28px}
.col.l .br::after{right:-28px}
.br>button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;color:var(--c);font-size:16px;width:100%}
.br>button .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.br>button .car{margin-inline-start:auto;font-size:12px;transition:transform .2s}
.br.closed>button .car{transform:rotate(90deg)}
.br .kids{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.br.closed .kids{display:none}
.br .kids span{font-size:14px;line-height:1.5;padding:3px 10px;border-radius:10px;background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.mm-hint{font-size:13px;color:var(--muted);margin-top:6px}

/* video */
.vid{display:grid;gap:10px}
.vid video{width:100%;border-radius:18px;background:#000;max-height:460px}
.ytcard{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--surface2)}
.ytcard .play{width:52px;height:52px;border-radius:16px;background:var(--grad);display:grid;place-items:center;flex:none}
.ytcard .tx{flex:1;min-width:200px}
.ytcard a{color:#fff;background:var(--grad);text-decoration:none;font-weight:800;border-radius:12px;padding:8px 16px}

/* quiz */
.quiz{display:grid;gap:14px}
.qc{border:1.5px solid var(--line);border-radius:20px;padding:14px 16px;background:var(--surface)}
.qc .qh{display:flex;gap:10px;align-items:flex-start}
.qc .qn{flex:none;width:30px;height:30px;border-radius:10px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.qc .qt{font-weight:700;flex:1}
.qc .ty{font-size:12px;color:var(--violet);font-weight:800;background:var(--lav);border-radius:8px;padding:0 8px;flex:none;white-space:nowrap}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:10px}
.opt{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);text-align:right;font-weight:600;line-height:1.5}
.opt .bul{width:18px;height:18px;border-radius:50%;border:2px solid var(--violet);flex:none}
.opt.sel{border-color:var(--violet);background:var(--lav)}
.opt.sel .bul{background:var(--violet);box-shadow:inset 0 0 0 3px var(--lav)}
.opt.ok{border-color:var(--mint);background:var(--mint-bg)}
.opt.bad{border-color:var(--red);background:var(--red-bg)}
.qc.ok{border-color:var(--mint)}
.qc.bad{border-color:var(--red)}
.fb{margin-top:10px;border-radius:12px;padding:8px 12px;font-size:15px}
.fb.ok{background:var(--mint-bg);color:var(--ink)}
.fb.bad{background:var(--red-bg);color:var(--ink)}
.fb b{font-weight:800}
.fillin{margin-top:10px;max-width:360px}
.qfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.score{display:flex;gap:18px;align-items:center;padding:16px 18px;border-radius:22px;background:var(--grad-soft);border:1px solid var(--line);flex-wrap:wrap}
.ring{width:96px;height:96px;flex:none}
.score .msg{flex:1;min-width:200px}
.score .msg h4{font-size:19px;font-weight:800;color:var(--violet)}

/* teacher q */
.tqlist{display:grid;gap:10px}
.tqi{border:1px dashed var(--violet);border-radius:16px;padding:10px 14px;background:var(--surface2)}
.tqi .ans{font-size:14px;color:var(--mint);font-weight:700;margin-top:4px}
.secret{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--pink);background:var(--blush);border-radius:999px;padding:2px 10px}

/* bottom nav */
.nav{position:fixed;inset:auto 0 0 0;z-index:15;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{display:flex;align-items:center;gap:12px;max-width:var(--maxw);margin:0 auto;padding-block:10px}
.dots{flex:1;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--pink);width:22px;border-radius:6px}
.dots i.done{background:var(--mint)}
.cnt{font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(40,15,45,.45);display:grid;place-items:center;padding:16px}
.modal .box2{background:var(--surface);border-radius:24px;width:min(980px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal .mh{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.modal .mh h3{font-size:19px;flex:1}
.modal .mb{padding:16px 18px;display:grid;gap:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 14px;font-weight:700;font-size:14px}
.tabs button.on{background:var(--grad);color:#fff;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.prev{border:1px solid var(--line);border-radius:16px;padding:10px 14px;max-height:420px;overflow:auto;background:var(--bg)}
.qed{border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px;background:var(--surface2)}
.qed .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qed .row>*{min-width:0}
.panel{max-width:var(--maxw);margin:0 auto;padding-block:20px 60px;display:grid;gap:18px}
.dtable{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
.dtable table{width:100%;border-collapse:collapse;min-width:520px}
.dtable th{background:var(--grad-soft);padding:8px 12px;text-align:right;font-family:var(--f-display);font-size:14px}
.dtable td{padding:8px 12px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.badge{display:inline-block;border-radius:8px;padding:0 8px;font-weight:800;font-size:14px}
.badge.g{background:var(--mint-bg);color:var(--mint)}
.badge.m{background:var(--lav);color:var(--violet)}
.badge.b{background:var(--red-bg);color:var(--red)}
.pwd{font-family:ui-monospace,monospace;background:var(--blush);padding:0 6px;border-radius:6px}
.sheetprev{display:flex;justify-content:center}
.sheetprev img{width:min(420px,100%);border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--line)}
.tnav{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px;margin-inline:auto;flex-wrap:wrap}
.tnav button{border:0;background:none;border-radius:999px;padding:6px 16px;font-weight:700;font-size:15px;color:var(--muted);white-space:nowrap}
.tnav button.on{background:var(--grad);color:#fff;box-shadow:var(--shadow)}
.who{display:flex;align-items:center;gap:8px}
.who .av{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;flex:none}
.who .nm{display:grid;line-height:1.25;font-weight:800;font-size:15px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .nm small{font-weight:500;font-size:12px;color:var(--muted)}
.page{max-width:var(--maxw);margin:0 auto;padding-block:24px 60px;display:grid;gap:18px}
.welcome{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--grad);color:#fff;border-radius:28px;padding:28px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.welcome::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12);inset:auto auto -110px -60px}
.welcome .wtx{flex:1;min-width:260px;position:relative;z-index:1}
.welcome h1{font-size:clamp(24px,4vw,36px);font-weight:800}
.welcome p{margin:6px 0 14px;opacity:.95;max-width:56ch}
.welcome .row{display:flex;gap:10px;flex-wrap:wrap}

{
id:"l01", unit:"التفخيم والترقيق", title:"التفخيم والترقيق: الاستعلاء والاستفال",
content:`## تقسيم الحروف الهجائية
الحروف الهجائية وهي (٢٩) حرفاً تنقسم من حيث كيفية ضغط الهواء في الفم عند النطق بها إلى قسمين:
- **حروف استعلاء:** حروف «خص ضغط قظ» فقط، يتجه ضغط الحرف عند النطق به إلى قبة غار الحنك الأعلى.
- **حروف استفال:** باقي الحروف (٢٢) حرفاً، يتجه ضغط الحرف عند النطق به إلى الحنك الأسفل.

## أولاً: الاستعلاء
- **لغة:** العلو والارتفاع.
- **اصطلاحاً:** اتجاه ضغط الحرف عند النطق به إلى الحنك الأعلى.
!! **تنبيه:** المعتبر في الاستعلاء هو ارتفاع أقصى اللسان إلى الحنك الأعلى في المنطقة الرخوة.

## ثانياً: الاستفال
- **لغة:** الانخفاض.
- **اصطلاحاً:** اتجاه ضغط الحرف عند النطق به إلى الحنك الأسفل.
? ما هي علاقة الاستعلاء والاستفال بالتفخيم والترقيق؟
= قبل أن نعرف العلاقة لابد من معرفة آلية التفخيم والترقيق.

## أولاً: آلية التفخيم
عند النطق بالحرف المستعلي يتجه ضغط الهواء إلى الحنك الأعلى فيصطدم بقبة الحنك، وبما أنه مكور (محدب) يرتد الصوت بعد الاصطدام فينشأ سمن في الحرف ويربو، ويسمى ذلك بالتفخيم.
- **تعريف التفخيم لغة:** التسمين.
- **اصطلاحاً:** سمن يعتري الحرف فيمتلئ الفم بصداه.

## ثانياً: آلية الترقيق
عند النطق بالحرف المستفل يتجه ضغط الهواء إلى الأسفل فلا يمتلئ الفم بصدى الحرف، فيطرأ على الحرف نحول يسمى الترقيق.
- **تعريف الترقيق لغة:** النحول.
- **اصطلاحاً:** نحول يعتري الحرف فلا يمتلئ الفم بصداه.

## العلاقة بين الاستعلاء والتفخيم
حرف الاستعلاء:
- **حقه:** اتجاه ضغط الحرف عند النطق به إلى الحنك الأعلى.
- **مستحقه:** أن يكون مفخماً.

## العلاقة بين الاستفال والترقيق
حرف الاستفال:
- **حقه:** اتجاه ضغط الحرف عند النطق به إلى الحنك الأسفل.
- **مستحقه:** أن يكون مرققاً.
>> **قاعدة:** كل مستعلٍ مفخم وليس كل مستفل مرقق؛ لأن هناك حروف استفال تفخم أحياناً (الراء، لام لفظ الجلالة، الألف المدية)، أو بمعنى آخر: كل مستعل مفخم وليس كل مفخم مستعل.

## تقسيم الحروف الهجائية من حيث التفخيم والترقيق
- **حروف تفخم دائماً:** خص ضغط قظ.
- **حروف تفخم تارة وترقق تارة أخرى:** الألف المدية، لام لفظ الجلالة، الراء.
- **حروف ترقق دائماً:** باقي الحروف.`,

content:`## أولاً: الحروف التي تفخم دائماً
وهي حروف «خص ضغط قظ»، وتفخم في جميع الأحوال سواء كانت ساكنة أو متحركة، ولكن بمراتب مختلفة.

## مراتب التفخيم (يوجد لها مذهبان)
| مذهب أهل مصر | مذهب أهل الشام |
| (١) في المفتوح {طَبع} والساكن ما قبله مفتوح {يَضْرب} | (١) المفتوح وبعده ألف مد {خالدين} |
| (٢) في المضموم {خُذ} والساكن ما قبله مضموم {مُخْتلفون} | (٢) المفتوح وليس بعده ألف مد {صَدق} |
| (٣) في المكسور {أخِيه} والساكن ما قبله مكسور {سِخْريا} | (٣) المضموم {ضُربت} |
| يلاحظ أن الساكن في هذا المذهب ليس له مرتبة خاصة بل يتبع مرتبة ما قبله. | (٤) الساكن بغض النظر عما قبله {يطْبع} |
| — | (٥) المكسور {أخِيه} |
| — | الساكن في هذا المذهب له مرتبة خاصة به. |

## التفخيم النسبي
التفخيم النسبي هو أدنى مرتبة من مراتب التفخيم، لقول العلامة المتولي:
~ فهي وإن تكن بأدنى منزلة || فخيمة قطعاً من المستفلة
~ فلا يقال: إنها رقيقة || كضدها تلك هي الحقيقة
? هل التفخيم النسبي يكون في جميع حروف (خص ضغط قظ)؟
= يكون التفخيم النسبي واضحاً في الحروف المستعلية المنفتحة (ق، خ، غ)؛ وذلك لأن قوة الاستعلاء تشد الحرف لأعلى وقوة الكسر تشد الحرف إلى أسفل فتتعادل القوتان.

## ملخص التفخيم النسبي
- **مذهب أهل الشام:** حروف (ق، غ، خ) المكسورة.
- **مذهب أهل مصر:** حروف (ق، غ، خ) المكسورة، و(غ، خ) الساكنة وما قبلها مكسور {سِخْريا} أو ما قبلها ياء ساكنة {شيخ}.
- **استثناء:** القاف الساكنة ما قبلها مكسور لا يكون تفخيمها نسبياً بسبب وجود القلقلة.
? متى يتجلى الفرق بين مذهبي أهل مصر وأهل الشام؟
= يتجلى الفرق في حالة الغين والخاء الساكنة ما قبلها مكسور أو ما قبلها ياء ساكنة، نحو: (سِخْريا، شيخ).

## ترتيب حروف الاستعلاء من حيث قوة التفخيم
1. **الطاء:** أكثر الحروف تفخيماً لأنها أقوى الحروف.
2. **الضاد:** لما فيها من جهر واستطالة.
3. **الصاد:** لما فيها من صفير.
4. **الظاء:** لأنها أضعف حروف الإطباق لكون مخرجها أقرب إلى خارج الفم من الصاد، لذا يكون إطباقها أقل لاتجاه الصوت ناحية طرف اللسان فيقل التفخيم، وإن تساوت صفات القوة بينها وبين الصاد فقد تميزت الصاد بالصفير والظاء بالجهر.
5. **القاف:** أكثر تفخيماً من الغين لما فيها من جهر وشدة وقلقلة.
6. **الغين:** لما فيها من جهر.
7. **الخاء:** أضعفهم لعدم اتصافها بصفة قوية سوى الاستعلاء.
>> فيكون ترتيب الحروف: ط > ض > ص > ظ > ق > غ > خ

## تنبيهات عند النطق بالحرف المفخم
1. الحذر من خروج الصوت خارج الفم عند النطق بالحرف مما يضعف تفخيم الحرف، فلابد من أن يمتلئ الفم بصدى صوت الحرف.
2. يجب مراعاة الفرق بين تفخيم الحرف المطبق وتفخيم الحرف المنفتح، وهذا يظهر بوضوح في المرتبة الأخيرة من مراتب التفخيم كما ذكر في مراتب التفخيم نحو {طِباقاً} و{غِل}، فالغين يكون تفخيمها نسبياً.`,

  - المفتوح والساكن بعد فتح
  - المضموم والساكن بعد ضم
  - المكسور والساكن بعد كسر
  - الساكن يتبع ما قبله
- مذهب أهل الشام (٥ مراتب)

id:"l03", unit:"التفخيم والترقيق", title:"المرققة دائماً، والألف المدية ولام الجلالة",
content:`## ثانياً: الحروف المرققة دائماً
وهي حروف الاستفال بعد استثناء (الراء، لام لفظ الجلالة، الألف المدية).

## ثالثاً: الحروف التي تفخم تارة وترقق تارة أخرى
- الألف المدية.
- لام اسم الجلالة.
- الراء.

## أولاً: الألف المدية
تتبع ما قبلها تفخيماً وترقيقاً:
- ما قبلها مفخم مثل {قال} تفخم.
- ما قبلها مرقق مثل {السماء} ترقق.

## ثانياً: لام اسم الجلالة
اللام دائماً مرققة إلا إذا أتت في اسم الجلالة فإنها ترقق أحياناً وتفخم أحياناً أخرى.
- **تفخم:** إذا كان ما قبلها مفتوحاً فتحاً حقيقياً {قالَ الله}، أو مفتوحاً فتحاً حكمياً {ءالله} {الله}، أو مضموماً ضماً أصلياً أو عارضاً {عبدُ الله} {دعوُا الله}.
- **ترقق:** إذا كان ما قبلها مكسوراً، سواء كان كسراً أصلياً أو عارضاً، وسواء كان في كلمة واحدة أو كلمتين {بسمِ الله} {بالله} {أحدٌ اللهُ} {قلِ اللهم}.

## ما هو الفتح الحكمي؟
1. عند البدء باسم الجلالة نبدأ بهمزة الوصل مفتوحة لأنها في (ال) التعريف فيسمى فتحاً حكمياً.
2. في لفظ {ءالله} في سورتي النمل ويونس قرأ حفص بوجهي الإبدال والتسهيل:
- **إبدال:** تقع لام اسم الجلالة بعد ألف مدية وهي في حكم الفتحة.
- **تسهيل:** تقع لام اسم الجلالة بعد همزة الوصل المسهلة وهي في حكم الفتحة لأننا لو كنا بدأنا بها لفتحت.`,
map:`تفخم تارة وترقق أخرى

  - تتبع ما قبلها
  - بعد مفخم تفخم {قال}
  - بعد مرقق ترقق {السماء}
- لام اسم الجلالة: تفخم
  - بعد فتح حقيقي {قال الله}
  - بعد فتح حكمي {ءالله}
  - بعد ضم أصلي أو عارض {عبدُ الله}
- لام اسم الجلالة: ترقق
  - بعد كسر أصلي أو عارض
  - في كلمة أو كلمتين {بسم الله}
- الفتح الحكمي
  - همزة الوصل عند البدء
  - {ءالله}: إبدال أو تسهيل
- المرققة دائماً
  - حروف الاستفال
  - عدا الراء ولام الجلالة والألف المدية`,

id:"l04", unit:"التفخيم والترقيق", title:"الراء: التفخيم والترقيق قولاً واحداً",
content:`## ثالثاً: الراء — حالاتها من حيث التفخيم والترقيق
- تفخم قولاً واحداً.
- ترقق قولاً واحداً.
- يجوز فيها الوجهان.

## (١) حالات تفخيم الراء قولاً واحداً
1. إذا كانت الراء مفتوحة {رَبي}.
2. إذا كانت الراء ساكنة قبلها مفتوح {البَرْق}.
3. إذا كانت الراء ساكنة قبلها ساكن قبلها مفتوح {والعصر} وقفاً.
4. إذا كانت الراء مضمومة {رُزقوا}.
5. إذا كانت الراء ساكنة قبلها مضموم {قُرْءانا}.
6. إذا كانت الراء ساكنة قبلها ساكن قبلها مضموم {خُسر} وقفاً.
7. إذا كانت الراء ساكنة قبلها مكسور وبعدها حرف استعلاء غير مكسور في كلمة واحدة، وذلك في خمس كلمات: قرطاس (الأنعام)، مرصاداً (النبأ)، لبالمرصاد (الفجر)، إرصاداً وفرقة (التوبة).
8. إذا كانت الراء ساكنة قبلها همزة وصل {ارتابوا} سواء كانت ملفوظة (عند البدء بها) أو مقدرة (في وسط الكلام).

## (٢) حالات ترقيق الراء قولاً واحداً
1. أن تكون الراء مكسورة {رِجال}.
2. أن تكون الراء ساكنة قبلها مكسور ولا يقع بعدها حرف استعلاء في نفس الكلمة {فِرْعون}.
3. أن تكون الراء ساكنة قبلها ساكن قبله مكسور {حِجر} وقفاً.
4. أن تكون الراء ساكنة قبلها ياء ساكنة مدية كانت أم لينية، نحو: {قدير}، {لا ضير} وقفاً.
5. أن تكون الراء بعدها ألف ممالة، ولم يرد هذا إلا في كلمة واحدة عند حفص وهي ﴿مَجْرِاهَا﴾ في سورة هود.

## شرح كلمة ﴿مَجْرِاهَا﴾
- **تعريف الإمالة الكبرى:** أن تقترب بالفتحة نحو الكسرة وبالألف نحو الياء من غير قلب خالص ولا إشباع مبالغ فيه.
- **الإمالة الصغرى (التقليل):** هي ما بين الفتح والإمالة الكبرى، ويقال لها: بين بين.
قرأ حفص كلمة ﴿مَجْرِاهَا﴾ بالإمالة الكبرى، أي إمالة الألف نحو الياء وفتحة الراء نحو الكسرة؛ لذلك أصبحت الراء في هذه الكلمة مرققة قولاً واحداً.
? ما العلة إذا أميلت الألف نحو الياء فلابد من إمالة فتحة ما قبلها نحو الكسرة؟
= لأن الألف عبارة عن إشباع وتمطيط لفتحة ما قبلها، فلكي تمال الألف لابد من إمالة الفتحة.`,
map:`أحوال الراء
- تفخم قولاً واحداً
  - مفتوحة أو مضمومة
  - ساكنة بعد فتح أو ضم
  - ساكنة بعد ساكن بعد فتح أو ضم (وقفاً)
  - ساكنة بعد كسر وبعدها استعلاء (٥ كلمات)
  - ساكنة بعد همزة وصل {ارتابوا}
- ترقق قولاً واحداً
  - مكسورة {رجال}
  - ساكنة بعد كسر بلا استعلاء {فرعون}
  - ساكنة بعد ساكن بعد كسر {حجر}
  - بعد ياء ساكنة {قدير}
  - ﴿مجراها﴾ بالإمالة
- الإمالة
  - كبرى: الفتحة نحو الكسرة
  - صغرى (تقليل): بين بين
- يجوز فيها الوجهان
  - كلمات مخصوصة (الدرس التالي)`,
quiz:[

["mc","حكم الراء في {قرطاس}:",["ترقق قولاً واحداً","تفخم قولاً واحداً","يجوز الوجهان","تقرأ بالإمالة"],1],

["fill","الإمالة الصغرى تسمى التقليل ويقال لها: ________.",["بين بين","بينبين"]]

id:"l05", unit:"التفخيم والترقيق", title:"الراء التي يجوز فيها الوجهان",
content:`## (٤) الراء التي يجوز فيها وجها التفخيم والترقيق
وذلك في كلمات مخصوصة: منها ما يجوز فيها الوجهان وقفاً، ومنها ما يجوز فيها الوجهان وصلاً.

## أولاً: ما يجوز فيها الوجهين وقفاً
- {مصر} — {القطر} — {يسر} — {نذر} — {أسر (فأسر)}

## كلمة {مصر}
- **تفخم:** من قال بالتفخيم على اعتبار أن الراء ساكنة وقفاً ما قبلها ساكن حصين أي [مطبق مستعلٍ] يشد الراء إلى أعلى ويفخمها، ووجدها مفخمة وصلاً ففضّل التفخيم.
- **ترقق:** من قال بالترقيق على اعتبار أنها ساكنة ما قبلها ساكن قبله مكسور، ولم ينظر إلى حرف الاستعلاء.

## كلمة {القطر}
- **تفخم:** من قال بالتفخيم على اعتبار أن الراء ساكنة وقفاً ما قبلها ساكن حصين أي [مطبق مستعلٍ] يشد الراء إلى أعلى ويفخمها.
- **ترقق:** من قال بالترقيق على اعتبار أنها ساكنة ما قبلها ساكن قبله مكسور ولم ينظر إلى حرف الاستعلاء، ووجدها مرققة وصلاً فرققها.

## رأي ابن الجزري
1. يفضل في {مصر} التفخيم وقفاً لأنها مفخمة وصلاً.
2. يفضل في {القطر} الترقيق لأنها مرققة وصلاً.
وهذا رأي غير ملزم.

!! **تنبيه:** أما في كلمة {بالنذر} المعرفة بأل التعريف حيث وردت فلا يوجد بها ياء محذوفة، فالراء تفخم قولاً واحداً في حالة الوقف لأنها ساكنة ما قبلها مضموم، وترقق وصلاً لأنها مكسورة، نحو: (كذبت ثمود بالنذر) [القمر].
!! **تنبيه:** كل ما ذكر عن حالات الراء في حركة ما قبلها وما بعدها لابد أن يكون في كلمة واحدة، فإذا كانت الراء الساكنة في آخر الكلمة الأولى وقبلها مكسور وحرف الاستعلاء في أول الكلمة الثانية فلا خلاف في ترقيقها، وأتى ذلك في ثلاثة مواضع:
1. ﴿أَنْ أَنذِرْ قَوْمَكَ﴾ [نوح ١]
2. ﴿وَلَا تُصَعِّرْ خَدَّكَ﴾ [لقمان ١٨]
3. ﴿فَاصْبِرْ صَبْرًا جَمِيلًا﴾ [المعارج ٥]

## ثانياً: ما يجوز فيها الوجهين وصلاً: {فِرْقٍ} في سورة الشعراء
- **تفخم:** ساكنة بعدها حرف استعلاء مكسور، وقوة الاستعلاء تشد القاف إلى أعلى وقوة الكسر تشدها إلى أسفل، ولكن قوة الاستعلاء أكبر فتؤثر في الراء وتفخمها.
- **ترقق:** قوة الاستعلاء تشد القاف إلى أعلى وقوة الكسر تشدها إلى أسفل فتتفانيان بعضهما، فأصبحت راء ساكنة ما قبلها مكسور.
>> **ملحوظة:** راء {فرق} في الوقف مفخمة.`,
map:`يجوز فيها الوجهان

  - مصر
  - القطر
  - يسر
  - نذر
  - أسر (فأسر)

  - أنذر قومك، تصعر خدك، فاصبر صبراً: ترقق`,

id:"l06", unit:"أحكام النون الساكنة والتنوين", title:"النون الساكنة والتنوين",
content:`## تعريف النون الساكنة
هي النون الخالية من الحركة، الثابتة وصلاً ووقفاً، خطاً ولفظاً.
- تكون في الأسماء (سندس، سنبلات).
- تكون في الأفعال (أنعم، ينظر).
- تكون في الحروف (عن، من).
- تكون متوسطة أو متطرفة.
- تكون من بنية الكلمة (ينهون) أصلها نهى.
- وتكون زائدة عن بنية الكلمة (فانفلق) أصلها فلق.
>> **ملحوظة:** النون المقصودة هنا هي النون الساكنة سكوناً ثابتاً، وليست المتحركة مثل (نَعبد)، ولا المشددة مثل (النّور)، ولا التي تسكن سكوناً عارضاً عند الوقف مثل (تعلمون)، ولا التي حركتها حركة عارضة للتخلص من التقاء الساكنين مثل (إنِ ارتبتم).

## تعريف التنوين
هو نون ساكنة زائدة لغير توكيد تلحق بآخر الأسماء لفظاً ووصلاً وتفارقه خطاً ووقفاً. وقد كانت العرب في لغتها تلحق التنوين بآخر الأسماء النكرات مثل {سميعٌ} {عليمٌ}.
!! **تنبيه:**
1. قولنا: إن التنوين هو نون ساكنة، أي خرج منه نون التنوين المتحركة بالكسر للتخلص من التقاء الساكنين (نوحٌ ابنه).
2. قولنا: لغير التوكيد، أي خرج منه نون التوكيد الخفيفة التي وردت في القرآن في موضعين فقط وهما: ﴿وَلَيَكُونًا مِّنَ الصَّاغِرِينَ﴾ (يوسف ٣٢)، ﴿لَنَسْفَعًا بِالنَّاصِيَةِ﴾ (العلق ١٥)؛ فهي ليست تنويناً لأنها تلحق بآخر الأفعال وليست الأسماء، وإن كانت تشبه التنوين وتعامل معاملته ويطبق عليها نفس الأحكام.
3. التنوين ثابت لفظاً دون خط (ينطق ولا يكتب).
4. التنوين ثابت وصلاً دون وقف، أما عند الوقف عليه فهو:
- إما يحذف إن كان بالضم أو الكسر، نحو: رحيمٌ ← رحيم.
- أو يبدل بألف مدية إن كان مفتوحاً، نحو: عليماً ← عليما.
- كما يحذف إن كان مفتوحاً على هاء التأنيث، نحو: شجرةً ← شجرة.
**علامة التنوين:** فتحتان ـً ، أو ضمتان ـٌ ، أو كسرتان ـٍ .

## الفرق بين النون الساكنة والتنوين

| أصلية في الكلمة أو زائدة. | زائدة في الكلمة. |
| تقع متوسطة أو متطرفة. | متطرفة فقط. |
| في الأسماء والأفعال والحروف. | في الأسماء فقط. |
| ثابتة لفظاً وخطاً ووصلاً ووقفاً. | ثابتة وصلاً ولفظاً وساقطة وقفاً وخطاً. |

## أحكام النون الساكنة والتنوين
للنون الساكنة والتنوين أربعة أحكام: ١- إظهار ٢- إدغام ٣- قلب ٤- إخفاء.
وقد أشار ابن الجزري لذلك بقوله:
~ وحكم تنوين ونون يلفى || إظهار ادغام وقلب اخفا
>> **ملحوظة:** القلب هو الإقلاب، والقلب هي الأصح لغة، والقدامى كانوا يكثرون من كلمة القلب، والمعاصرون من كلمة الإقلاب.`,

id:"l07", unit:"أحكام النون الساكنة والتنوين", title:"أولاً: الإظهار الحلقي",
content:`## تعريفه
- **لغة:** البيان والوضوح.
- **اصطلاحاً:** إخراج الحرف المظهر من مخرجه بدون غنة كاملة.

## ما هو الحرف المظهر؟
هو النون الساكنة أو التنوين الواقعتان قبل أحرف الإظهار.

## ما هي أحرف الإظهار؟
هي ستة أحرف (الهمزة والهاء والعين والحاء والغين والخاء)، جمعها الشيخ الجمزوري في قوله:
~ همز فهاء ثم عين حاء || مهملتان ثم غين خاء
{مهملتان أي بدون تنقيط}. وجمعها البعض في أوائل كلمات البيت: (أخي هاك علماً حازه غير خاسر).

## ما سبب تسميتها أحرف الإظهار؟
لأن وقوع واحد منها عقب النون الساكنة أو التنوين سبب في إظهارهما.
>> **ملحوظة:** الإظهار الحلقي يكون في كلمة أو كلمتين.

## ما سبب تسميته إظهاراً حلقياً؟
- **سمي إظهاراً:** لظهور النون الساكنة والتنوين إذا أتت قبل أحد هذه الأحرف الستة.
- **سمي حلقياً:** لأن الحروف الستة تخرج من الحلق.

## ما سبب الإظهار؟
بُعد مخرج النون عن مخرج هذه الأحرف، فالنون من طرف اللسان والأحرف الستة من الحلق.

## كيفية الإظهار
النطق بالنون الساكنة نطقاً واضحاً من غير غنة ظاهرة، ومن غير فصل أو سكت، مع إعطائها زمن التوسط، ثم النطق بالحرف الذي يليها.

## مراتب الإظهار
1. مرتبة عليا: عند الهمزة والهاء.
2. مرتبة وسطى: عند العين والحاء.
3. مرتبة دنيا: عند الغين والخاء.

## علامته في المصحف
1. وضع رأس الخاء الصغيرة بدون نقطة فوق النون ﴿مَنْ ءَامَنَ﴾.
2. وضع حركتي التنوين مركبتين فوق بعضهما ﴿عَلِيمًا حَكِيمًا﴾ ، ﴿سَمِيعٌ عَلِيمٌ﴾ ، ﴿يَوْمَئِذٍ ءَامِنُونَ﴾.

## أمثلة على الإظهار
| حرف الإظهار | مع النون في كلمة | مع النون في كلمتين | مع التنوين |
| ء | وينئون | فمن أسلم | حاسدٍ إذا حسد |
| هـ | فلا تنهر | إن هذا | سلامٌ هي |
| ع | الأنعام | من علق | وليالٍ عشر |
| ح | وانحر | ومن حيث | غفورٌ حليم |
| غ | فسينغضون (لا ثاني لها) | من غل | لعفوٌ غفور |
| خ | والمنخنقة (لا ثاني لها) | من خير | عليمٌ خبير |`,

id:"l08", unit:"أحكام النون الساكنة والتنوين", title:"ثانياً: الإدغام (بغنة وبدون غنة)",
content:`## تعريفه
- **لغة:** إدخال الشيء في الشيء.
- **اصطلاحاً:** إدخال حرف ساكن في حرف متحرك بحيث يصيران حرفاً واحداً مشدداً من جنس الثاني.
**حروفه:** ستة أحرف مجموعة في كلمة {يرملون}.
>> **ملحوظة:** تسمى النون الساكنة الحرف المدغم، ويسمى أحد حروف كلمة (يرملون) مدغماً فيه.

## فائدة الإدغام
التخفيف، حيث أن المدغم والمدغم فيه يصيران حرفاً واحداً مشدداً.

## كيفية الإدغام
جعل الحرف المراد إدغامه مثل المدغم فيه، وكما قال ابن الجزري في النشر: النطق بالحرفين حرفاً كالثاني مشدداً.

## شرط الإدغام
أن يكون في كلمتين، أي النون الساكنة في آخر الكلمة الأولى وحرف الإدغام في أول الكلمة الثانية.

## أقسام الإدغام
- **إدغام بغنة:** مع حروف {ينمو} أو {يومن}.
- **إدغام بدون غنة:** مع (ل، ر).

## أولاً: الإدغام بغنة
يختص هذا الإدغام بأربعة أحرف من حروف يرملون مجموعة في كلمة (ينمو) أو (يومن).
- **سمي إدغاماً:** لإدغام النون والتنوين في حروف (ينمو).
- **سمي بغنة:** لأن الغنة مصاحبة له، سواء كانت غنة المدغم أو غنة المدغم فيه.
| حرف الإدغام | مع النون | مع التنوين |
| ي | من يعمل — من يطع | وجوهٌ يومئذ |
| ن | لن ندخلها — من نعمة | أمشاجٍ نبتليه |
| م | من ماء — من مال | قومٌ مسرفون |
| و | من وال — من واق | وليٍّ ولا نصير |

## ثانياً: الإدغام بدون غنة
يختص هذا الإدغام بحرفين هما اللام والراء، فتدغم النون الساكنة في اللام والراء ولا يصاحبها غنة.
? ما سبب حذف الغنة؟
= للتخفيف، حيث أن في بقائها بعض الثقل.
| الحرف | مع النون | مع التنوين |
| ل | أن لن | مالاً لُبدا |
| ر | من ربهم | غفورٌ رحيم |

## ما سبب الإدغام في حروف يرملون؟
1. مع (النون): للتماثل.
2. مع (الميم): الميم تشارك النون في جميع الصفات وفي مخرج الغنة، فهما متجانسان في الصفات.
3. مع (و، ي): النون مشتركة مع الواو والياء في الجهر والاستفال والانفتاح، والواو تخرج من مخرج الميم، فلما أدغمت النون في الميم أدغمت في الواو ومثلها، ثم أدغمت في الياء لشبهها بالواو.
4. مع (اللام): للتقارب.
5. مع (الراء): للتقارب.`,

id:"l09", unit:"أحكام النون الساكنة والتنوين", title:"الإدغام الكامل والناقص والإظهار المطلق",
content:`## علامة الإدغام في المصحف
كما ذكر من قبل تعرى النون الساكنة من الحركة، أو في حالة التنوين توضع الحركتان متتابعتين، ويوضع التشديد على المدغم فيه إذا كان إدغاماً كاملاً، ولا يوضع تشديد إذا كان إدغاماً ناقصاً.

? ماذا يحدث إذا أتت النون الساكنة وبعدها حرف من حروف يرملون في كلمة واحدة؟
= إذا حدث هذا وجب الإظهار ويسمى إظهاراً مطلقاً، ولم يقع هذا في القرآن إلا مع الواو والياء فقط.

## إذن فالإظهار المطلق هو
أن يقع بعد النون الساكنة حرف من حروف يرملون في كلمة واحدة، ولم يقع في القرآن إلا في ٤ كلمات: {الدنيا} {بنيان} {صنوان} {قنوان}.
**سبب التسمية:**
- سمي إظهاراً: لإظهار النون الساكنة عند ملاقاتها لهذه الحروف في كلمة واحدة.
- سمي مطلقاً: لعدم تقييده بحلقي أو شفوي أو قمري.

## الإدغام الكامل
هو سقوط المدغم في المدغم فيه ذاتاً وصفة مع استكمال التشديد.
- **حروفه:** نرمل (النون، الراء، الميم، اللام).
- **علامته في المصحف:** تعرية المدغم من الحركة ووضع التشديد على المدغم فيه، نحو: (مِن رَّبهم).
>> **ملحوظة:** اختلف العلماء في إدغام النون الساكنة والتنوين في (النون والميم): هل هو كامل أم ناقص؟ أي هل الغنة غنة المدغم فيه (الميم) أم غنة المدغم (النون)؟ والأرجح أنه إدغام كامل (أي أن الغنة غنة الميم)، وعليه رسم المصحف.

## الإدغام الناقص
هو سقوط المدغم في المدغم فيه ذاتاً لا صفة، وعدم استكمال التشديد.
- **حروفه:** الواو والياء.
- **علامته في المصحف:** تعرية المدغم من الحركة وعدم وضع تشديد على المدغم فيه، نحو: (مِن وَاق).`,
map:`الإدغام: كامل وناقص

- النون والميم

id:"l10", unit:"أحكام النون الساكنة والتنوين", title:"ثالثاً: القلب (الإقلاب)",
content:`## تعريفه
- **لغة:** تحويل الشيء عن وجهه.
- **اصطلاحاً:** قلب النون الساكنة أو التنوين ميماً مخفاة عند الباء مع مراعاة الغنة وعدم التشديد.
- **حرفه:** حرف الباء.
>> **ملحوظة:** القلب يكون في كلمة أو كلمتين.

## كيفية القلب
1. قلب النون الساكنة أو التنوين ميماً لفظاً لا خطاً.
2. إخفاء الميم عند الباء بإطباق الشفتين إطباقاً خفيفاً بدون كز.
3. إظهار الغنة وهي غنة الميم.
4. بعد ذلك يجب تقوية إطباق الشفتين للنطق بالباء.
قال المرعشي: معنى إخفاء الميم ليس إعدامها بالكلية، بل إضعافها وستر ذاتها، وذلك بتقليل الاعتماد على مخرجها.
!! **تنبيهات هامة:**
- عدم كز الشفتين بقوة حتى لا تتولد ميم مظهرة.
- عدم ترك فرجة بين الشفتين حتى لا تتحول إلى لفظ مبهم أو تتحول إلى نون مخفاة.

## سبب القلب
- لم يحسن الإظهار لما فيه من كلفة على اللسان.
- لم يحسن الإدغام للتباعد في المخرج والصفات.
- لم يحسن الإخفاء لأنه سوف يتولد معه صوت الميم.
فتُوصِّل إلى القلب لما يكون معه من سهولة ويسر على اللسان.

## سبب اختيار الميم بالذات لتقلب إليها النون
الميم تشترك مع النون في جميع الصفات، وتشترك مع الباء في المخرج و٤ صفات (الجهر، الاستفال، الانفتاح، الذلاقة).

## علامته في المصحف
1. وضع ميم قائمة فوق النون الساكنة (م) ﴿لَيُنۢبَذَنَّ﴾.
2. إبدال الحركة الثانية من التنوين بميم قائمة ﴿عَلِيمٌۢ بِذَاتِ﴾.

## أمثلة
| الحرف | مع النون في كلمة | مع النون في كلمتين | مع التنوين |

id:"l11", unit:"أحكام النون الساكنة والتنوين", title:"رابعاً: الإخفاء الحقيقي",
content:`## تعريفه
- **لغة:** الستر.
- **اصطلاحاً:** النطق بالحرف الساكن عارٍ عن التشديد على صفة بين الإظهار والإدغام، مع بقاء الغنة في الحرف الأول وهو النون الساكنة أو التنوين.
- **حروفه:** خمسة عشر حرفاً، وهي الباقية من الحروف بعد حذف حروف الإظهار والإدغام والقلب.

## جمعها الشيخ الجمزوري في أوائل كلمات البيت التالي
~ صف ذا ثنا كم جاد شخص قد سما || دم طيباً زد في تقى ضع ظالما

## سببه
عدم قرب مخرج النون من مخرج هذه الحروف القرب الذي يجب مع الإدغام، وعدم بعد المخرج البعد الذي يجب مع الإظهار.

## سبب التسمية
1. سمي إخفاء: لإخفاء النون الساكنة عند هذه الحروف.
2. سمي حقيقياً: لأنه متحقق في النون أكثر من غيرها من الحروف؛ فذات النون تكاد تكون معدومة تماماً، بخلاف إخفاء الميم التي لا تكون معدومة تماماً ولكن تكون مستورة بعض الشيء.

## كيفية الإخفاء
النطق بالنون الساكنة (أو التنوين) غير مظهرة إظهاراً محضاً ولا مدغمة إدغاماً محضاً، ولكن بحالة وسط بين الإظهار والإدغام بدون تشديد مع بقاء الغنة.

## أمثلة

| ذ | لينذر | من ذهب | وكيلاً ذرية |

| ز | أنزلناه | من زوال | نفساً زكية |

| ت | كنتم | ومن تاب | جناتٍ تجري |

id:"l12", unit:"أحكام الميم الساكنة", title:"الميم الساكنة: الإخفاء الشفوي",
content:`## تعريف الميم الساكنة
هي الميم الخالية من الحركة وسكونها ثابت وصلاً ووقفاً.
!! **تنبيه:** المقصود بالميم الساكنة هي الميم الساكنة سكوناً أصلياً وصلاً ووقفاً؛ فخرج بذلك السكون العارض لأجل الوقف [عليمٌ — عليمْ]، وخرج أيضاً الميم الساكنة أصلاً وتحركت منعاً من التقاء الساكنين [قمِ الليل].

## مواضعها
1. تقع متوسطة ومتطرفة [الحمد] [منكم].
2. تأتي في الأسماء [الحمد]، والأفعال [قمتم]، والحروف [أم]، وتكون للجمع [عليكم].

## أحكامها
- إخفاء شفوي.
- إدغام شفوي.
- إظهار شفوي.

## أولاً: الإخفاء الشفوي
- **لغة:** الستر.
- **اصطلاحاً:** النطق بالميم الساكنة عارية عن التشديد على صفة بين الإظهار والإدغام مع بقاء الغنة فيها.
- **حرفه:** الباء.

## سبب التسمية
- سمي شفوياً: بسبب خروج الميم والباء من الشفتين.
- سمي إخفاءً: لإخفاء الميم عند الباء.
!! **تنبيه:** لا يكون إلا من كلمتين.

- **سبب الإخفاء:** ثقل الإظهار نتيجة لاتحاد الميم والباء في المخرج.
- **علامته في المصحف:** تعرية الميم من الحركة وعدم تشديد الباء.
- **كيفية الأداء:** ملامسة الشفتين بدون كز.

## الفرق بين الإخفاء الشفوي والقلب
| الإخفاء الشفوي | القلب |
| إخفاء الميم عند الباء | قلب النون ميماً ثم إخفاء الميم عند الباء |
| في كلمتين | في كلمة أو كلمتين |
أما في الأداء فلا فرق بينهما.

## الفرق بين الإخفاء الحقيقي والإخفاء الشفوي
| الإخفاء الحقيقي | الإخفاء الشفوي |
| يتم إعدام جسم النون تماماً ويبقى منها الغنة فقط | لا يتم إعدام جسم الميم تماماً ولكن يتم سترها فقط |
| في كلمة أو كلمتين | في كلمتين |
| اتفق عليه القراء | اختلف فيه |

!! **تنبيه:** ذهب البعض إلى إظهار الميم عند الباء، ولكن الإخفاء هو الأولى. قال ابن الجزري:
~ والميم إن تسكن بغنة لدى || باء على المختار من أهل الأدا
**أمثلة:** {فاحكم بينهم} — {يوم هم بارزون} — {ربهم بهم}`,

id:"l13", unit:"أحكام الميم الساكنة", title:"الإدغام الشفوي والإظهار الشفوي",
content:`## ثانياً: الإدغام الشفوي
- **لغة:** الإدخال.
- **اصطلاحاً:** هو إدخال ميم ساكنة في ميم متحركة بحيث يصيران ميماً واحدة مشددة.
- **حروفه:** الميم.
- **اسمه:** إدغام متماثلين صغير شفوي بغنة.

## سبب التسمية
- **سمي إدغاماً:** لإدغام الميم في الميم.
- **سمي متماثلين:** لأن المدغم والمدغم فيه متحدان اسماً ورسماً.
- **سمي صغيراً:** لأن الأول ساكن والثاني متحرك.
- **سمي شفوياً:** لخروج الميم من الشفتين.
- **سمي بغنة:** لمصاحبة الغنة له.
!! **تنبيه:** يقع في كلمتين أو في الحروف المتقطعة.

**علامته في المصحف:** تعرية الميم الأولى من الحركة وتشديد الميم الثانية.
| في الحروف المتقطعة | في كلمتين |
| الم | كم من فئة |
| المر | لكم ما |
| المص | أم من أسس |

## ثالثاً: الإظهار الشفوي
- **لغة:** الظهور والبيان.
- **اصطلاحاً:** إخراج الميم الساكنة من مخرجها بدون غنة كاملة، وبدون وقف أو سكت أو تشديد.
- **حروفه:** الستة والعشرون حرفاً الباقية بعد إسقاط الباء والميم.
!! **تنبيه:** يكون من كلمة أو من كلمتين.

## سبب التسمية
- سمي إظهاراً: لإظهار الميم عند هذه الأحرف.
- سمي شفوياً: لخروج الميم من الشفتين.
>> **ملحوظة:** في حالة الإظهار الحلقي نُسبت التسمية إلى حروفه الستة الباقية لأن مخرجها واحد وهو الحلق، أما في حالة الإظهار الشفوي نسبت التسمية إلى مخرج الميم لأن الأحرف الستة والعشرين مختلفة في المخرج.

## كيفية الأداء
النطق بالميم ساكنة من الشفتين بانطباقهما مع إعطاء الميم صفة التوسط بدون أن تتحول إلى ميم مشددة، ثم النطق بالحرف الذي يليها.
- إذا جاء بعد الميم الساكنة (فاء) أو (واو) يجب تحقيق الإظهار حتى لا يسبق اللسان إلى إخفائها عند هذين الحرفين؛ لاتحاد الواو مع الميم في المخرج وقرب مخرج الفاء من مخرج الميم.
- لا تدغم الميم في الواو على الرغم من اتحادهما في المخرج منعاً من اللبس، فلا يعرف هل المدغم نون أم ميم.
- لا تدغم الميم في مقاربها وهي الفاء حتى لا تذهب غنتها فيكون إجحافاً بها، ولأن الفاء أضعف من الميم، ولا يدغم القوي في الضعيف إدغاماً كاملاً على وجه الدراية.

## أمثلة
| الحرف | مثال | الحرف | مثال |
| ت | أسلمت | ث | الأمثال |
| ح | وفي أموالهم حق | ج | عند ربهم جنات |
| خ | ربكم خالق كل شيء | د | الحمد |
| ذ | الله أنزل إليكم ذكرا | ر | إليكم رسولا |
| ز | منهم زهرة | س | يمسك |
| ش | فما تنفعهم شفاعة | ص | فوقهم صافات |
| ض | أراد بكم ضرا | ط | وأرسل عليهم طيرا |
| ظ | عليهم ظلالها | ع | ولهم عذاب |
| غ | فإنهم غير ملومين | ف | ذرأكم في الأرض |
| ق | ومهلهم قليلا | ك | فجعلهم كعصف |
| ل | وهم لا يشعرون | ن | ألم نشرح لك صدرك |
| هـ | واهجرهم هجرا | و | أموالهم |
| ي | لم يلد | ء | وكنتم أمواتا |`,

id:"l14", unit:"أحكام الميم الساكنة", title:"النون والميم المشددتان ومراتب الغنة",
content:`## تعريف الحرف المشدد
الحرف المشدد هو ما كان أصله حرفين: أولهما ساكن وثانيهما متحرك، وأدغم الأول في الثاني.

## حكم النون والميم المشددتين
من أهم الصفات اللازمة للنون والميم هي صفة الغنة، فإذا وقع التشديد في هذين الحرفين ظهرت فيهما الغنة بأعلى مراتبها.

## مواضعهما
تقع النون والميم المشددتان متوسطتين أو متطرفتين في:
1. **الأسماء:** الجنّة — أمّتكم — عيهنّ.
2. **الأفعال:** دمّر — يمنّيهم — تعضلوهنّ.
3. **الحروف:** أنّ — ثمّ.

## صفة النون والميم
وضعهما العلماء مع حروف التوسط، أي حالة وسط بين جريان الصوت وعدم جريانه، وما قيل عن النون يقال عن الميم.
? ومن هنا نفهم أنه ما دام النون والميم فيهما نصف رخو فصوتهما قابل للمط والزيادة، فكم نمطه؟
= يتضح هذا من معرفة مراتب الغنة.

## مراتب الغنة
1. **أكمل ما تكون:** في النون والميم المشددتين والمدغمتين، سواء كان إدغاماً كاملاً أو ناقصاً، نحو: إنّ — عمّ — من ولي — من نذير — لكم ما كسبتم.
2. **غنة كاملة:** في النون والميم المخفاتين {إخفاء شفوي أو حقيقي أو قلب}، نحو: الأنثى — ترميهم بحجارة — من بعد.
3. **غنة ناقصة:** في النون والميم الساكنتين المظهرتين، ولابد من توافر هذين الشرطين [شرط السكون وشرط الإظهار]، نحو: أنعمت، العالمين (غنة النون وقفاً).
4. **غنة أنقص ما تكون:** في النون والميم المتحركتين، نحو: المؤمنين — نصير. والدليل على وجود الغنة في النون والميم المتحركتين أننا لو أغلقنا الخيشوم لاختل الصوت.

!! **تنبيهات:**
1. تمتاز الغنة عن باقي الصفات بوجود مخرج خاص بها.
2. تتبع الغنة ما بعدها تفخيماً وترقيقاً مع مراعاة مراتب التفخيم.

## مقدار الغنة
قال البعض: إن الغنة مقدارها حركتان، ولكن الصواب أن زمن الغنة يتناسب مع سرعة القارئ ويضبط بالمشافهة، ويختلف زمنها حسب مرتبتها.

## كيفية أداء الغنة
تؤدى سلسة بدون تمطيط أو تطنين أو زيادة أو نقص عن مرتبتها.`,
map:`الغنة
- المشدد
  - حرفان: ساكن ثم متحرك
  - النون والميم المشددتان: أعلى الغنة
- أكمل ما تكون
  - المشدد والمدغم {إنّ، عمّ}
- كاملة

id:"l15", unit:"المد والقصر", title:"المد والقصر وحروف المد والمد الطبيعي",
content:`## تعريف المد
- **لغة:** الزيادة، قال تعالى: ﴿وَيُمْدِدْكُم بِأَمْوَالٍ وَبَنِينَ﴾ أي يزدكم.
- **اصطلاحاً:** إطالة الصوت بحرف المد واللين عند وجود سبب لذلك.

## تعريف القصر
- **لغة:** الحبس أو المنع، قال تعالى: ﴿حُورٌ مَّقْصُورَاتٌ﴾ أي محبوسات.
- **اصطلاحاً:** إثبات حرف المد بدون زيادة.
>> **ملحوظة:**
1. القصر هو الأصل لأنه لا يحتاج إلى سبب.
2. المد فرع منه لأنه يحتاج إلى سبب.
3. إذا أطلق لفظ قصر يعني المد الطبيعي.

## الدليل على المد من السنة
ما نقل عن ابن مسعود رضي الله عنه أنه كان يقرئ رجلاً، فقرأ الرجل: ﴿إِنَّمَا الصَّدَقَاتُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ﴾ مرسلة أي بدون مد، فقال ابن مسعود: ما هكذا أقرأنيها رسول الله ﷺ. فقال: كيف أقرأكها يا أبا عبد الرحمن؟ فقال: أقرأنيها هكذا ﴿إِنَّمَا الصَّدَقَاتُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ﴾ فمدها. رواه الطبراني، وأخرجه سعيد بن منصور، وصححه السيوطي والألباني.
قال الإمام ابن الجزري: «وهذا حديث جليل حجة ونص في هذا الباب، رجال إسناده ثقات».

## حروف المد واللين — حروف المد
1. الألف الساكنة المفتوح ما قبلها {قال}.
2. الواو الساكنة المضموم ما قبلها {يقول}.
3. الياء الساكنة المكسور ما قبلها {قيل}.
وقد جمعت بشروطها في كلمة {نوحيها} {أوتينا} {أوذينا}.

## أقسام المدود
- **ما يمد حركتين:** مد طبيعي، مد عوض، مد بدل، مد صلة صغرى.
- **ما يمد أكثر من حركتين:** مد لازم، مد واجب متصل، مد جائز منفصل (ويلحق به مد الصلة الكبرى)، مد عارض للسكون (ويلحق به مد اللين).

## المد الطبيعي
**تعريفه:** هو أبو المدود وأولها، وهو المد الذي لا تقوم ذات الحرف إلا به ولا يتوقف على سبب.
إذا قال الإنسان (قَ) وسألنا سامعاً: ماذا سمعت؟ يقول: قاف مفتوحة. ولو قلنا (قا) يقول: قاف مفتوحة بعدها ألف مد، فهذه الألف نشأت وبرزت إلى الوجود من إشباع صوت الفتحة.
**أسماؤه:** مد طبيعي، مد أصلي، مد ذاتي، مد صيغة.

## سبب التسمية
1. **طبيعي:** لأن صاحب الطبيعة السليمة لا يزيده ولا ينقصه عن مقداره.
2. **أصلي:** لأنه أصل لجميع المدود ولا يتوقف على سبب.
3. **ذاتي:** لأن ذات الحرف لا تقوم إلا به.
4. **صيغة:** لأن صيغة حرف المد أي بنيته لا تقوم إلا عليه.`,

id:"l16", unit:"المد والقصر", title:"مد الصلة الصغرى والكبرى",
content:`## مد الصلة الصغرى
**تعريفه:** صلة هاء الضمير الدالة على المفرد المذكر الغائب المتحركة بالضم أو الكسر، والواقعة بين متحركين، الثاني منهما ليس همزة قطع.
!! **تنبيهات:**
1. إذا وقعت همزة قطع بعد صلة هاء الضمير يصبح مداً فرعياً ويسمى مد صلة كبرى، وإذا لم تقع الهمزة بعده يسمى مد صلة صغرى.
2. يسمى حرف المد (صلة هاء الضمير)، وتسمى الهاء (هاء الصلة) {بعباده بصيراً} {له ملك السموات والأرض}.

? ما العلاقة بين مد الصلة وبين المد الطبيعي؟
= مد الصلة يلحق بالمد الطبيعي لأنه ثابت في الوصل فقط، أما عند الوقف نقف بسكون الهاء.
- **سبب التسمية:** لأنه ثابت حال الوصل فقط.
- **مقداره:** يمد بمقدار حركتين.
- **شروط هاء الصلة:** ١- متحركة. ٢- واقعة بين متحركين.

## ما يلحق بهاء الضمير
يلحق بهاء الضمير اسم الإشارة (هذه)، ويطبق عليها نفس الحكم وبنفس الشروط.
? ما الفرق بين هاء اسم الإشارة وهاء الضمير؟
= هاء اسم الإشارة لم تقع مضمومة، ولم تقع ساكنة وصلاً.
? ماذا يحدث إذا انتفت شروط هاء الصلة؟
= في هذه الحالة لا يوجد مد صلة.

## مد الصلة الكبرى
**تعريفه:** هو أن تأتي هاء الضمير الدالة على المفرد المذكر الغائب (المتحركة والواقعة بين متحركين) في آخر الكلمة الأولى، وهمزة القطع في أول الكلمة الثانية.

id:"l17", unit:"المد والقصر", title:"المد الفرعي والمد بسبب الهمز",
content:`## المد الفرعي
**تعريفه:** هو المد الزائد عن المد الطبيعي لوجود سبب ما.
## ينقسم المد الفرعي إلى قسمين
- **المد الفرعي اللفظي:** هو إطالة الصوت بسبب همز أو سكون.
- **المد الفرعي المعنوي:** هو إطالة الصوت بسبب معنوي.

## المد الفرعي المعنوي
ليس لحفص من الشاطبية منه شيء، وهو قسمان:
- **المبالغة في النفي:** {لا ريب فيه}.
- **المبالغة في التعظيم:** {لا إله إلا الله} (مذهبهم قصر المنفصل).

## المد الفرعي اللفظي
- **بسبب الهمزة:** (١) مد واجب متصل. (٢) مد جائز منفصل (ويلحق به مد الصلة الكبرى).
- **بسبب السكون:** (١) المد اللازم. (٢) المد العارض للسكون. (٣) ويلحق به مد اللين.

## أولاً: المد بسبب الهمزة — المد الواجب المتصل
- **تعريفه:** أن يأتي حرف المد وبعده همزة في كلمة واحدة.
- **مقداره:** يمد بمقدار [٤ أو ٥] حركات لحفص من الشاطبية (٤ توسط، ٥ فويق المتوسط).
- **حكمه:** واجب.
**سبب التسمية:**
1. سمي واجباً لوجوب مده فوق المد الطبيعي عند جميع القراء، وإن اختلفوا في عدد الحركات.
2. سمي متصلاً لاتصال حرف المد بالهمزة في كلمة واحدة.
- **سبب مده:** لأن حرف المد ضعيف خفي والهمز قوي، فزيد في المد لتقوية حرف المد.
- **أمثلة:** {جاءكم} {هنيئاً} {سوءاً}

## المد الجائز المنفصل
- **تعريفه:** أن يأتي حرف المد في آخر الكلمة الأولى وهمزة القطع في أول الكلمة الثانية.
- **مقداره:** يمد بمقدار [٤ أو ٥] حركات لحفص من الشاطبية.
- **حكمه:** جائز لجواز قصره عند بعض القراء.
- **سبب التسمية:** سمي جائزاً لجواز قصره عند بعض القراء، وسمي منفصلاً لانفصال حرف المد عن الهمز.
- **سبب مده:** لتقوية حرف المد عند مجاورته للهمز.
- **سبب قصره في بعض الروايات:** بسبب قصر حرف المد عند الوقف.

## أقسام المد المنفصل
- **انفصال حقيقي:** حرف المد ثابت رسماً ولفظاً {في أرض الله}.
- **انفصال حكمي:** حرف المد ثابت لفظاً دون رسم، ويكون في: (١) ها التنبيه {ها أنتم} {هؤلاء}. (٢) يا النداء {يأيها}.
| المنفصل الحقيقي | المنفصل الحكمي |
| حرف المد ثابت لفظاً ورسماً | حرف المد ثابت لفظاً دون رسم |
| نقف على حرف المد بالقصر | لا يجوز الوقف على حرف المد |`,

id:"l18", unit:"المد والقصر", title:"المد بسبب السكون: العارض للسكون ومد اللين",
content:`## ثانياً: المد بسبب السكون — المد العارض للسكون
- **تعريفه:** هو أن يكون حرف المد هو الحرف القبل الأخير من الكلمة، ونقف على الحرف الأخير بالسكون العارض.
- **سبب التسمية:** لعروض السكون عند الوقف.
- **مقداره:** يمد [٢ أو ٤ أو ٦] حركات، أما عند الوصل يسقط المد العارض ويمد الحرف حركتان كمد طبيعي.
- **حكمه:** جائز.
- **علة القصر [٢]:** مراعاة لأصله وهو القصر، وعدم الاعتداد بالعارض.
- **علة التوسط [٤]:** لاجتماع ساكنين، ولكون الساكن الثاني سكونه عارض فجعل أدنى من المد اللازم.
- **علة الإشباع [٦]:** تشبيهاً باللازم لاجتماع ساكنين.
- **أمثلة:** عند الوقف على كل من {العالمين — الرحيم — الظالمون}.

## مد اللين
- **تعريفه:** هو أن يكون حرف اللين هو الحرف القبل الأخير من الكلمة، ونقف على الحرف الأخير بالسكون العارض.
- **مقداره:** يمد [٢ أو ٤ أو ٦] حركات، أما عند الوصل يسقط مد اللين ويمد حرف اللين مداً ما دون المد الطبيعي ويضبط بالمشافهة.
- **حكمه:** جائز.
- **سبب التسمية:** لأن الحرف قبل الأخير هو حرف لين.
- **أمثلة:** عند الوقف على كل من {خوف — بيت — السَّوء}.

## الفرق بين المد العارض ومد اللين
| مد اللين | المد العارض |
| حرفان فقط وهما حرفا اللين | ثلاثة أحرف وهي أحرف المد |
| الأحرف ساكنة ما قبلها مفتوح | الأحرف ساكنة ما قبلها حركة مجانسة لها |
| حال الوصل يمد مداً ما دون الطبيعي | حال الوصل يكون مداً طبيعياً |

? لماذا يمد حرف اللين مداً ما دون الطبيعي؟
= زمن الحروف المدية يبدأ من أول النطق بحركة ما قبلها لأنها مجانسة لها [قال]، بينما زمن حرف اللين يبدأ من بعد الانتهاء من فتحة ما قبله.
>> **ملحوظة:** المد العارض أقوى من مد اللين لأن حرف المد أقوى من حرف اللين، فيكون مد اللين هو المشبه والمد العارض مشبه به، فيكون عدد حركات العارض أكبر من أو تساوي اللين كما سيرد ذكره بإذن الله في مراتب المدود.`,

id:"l19", unit:"المد والقصر", title:"المد اللازم الكلمي ومد الفرق",
content:`## المد اللازم
- **تعريفه:** هو أن يأتي حرف المد وبعده حرف ساكن سكوناً أصلياً.
- **معنى السكون الأصلي:** ثابت وصلاً ووقفاً.
- **مقداره:** يمد ٦ حركات لزوماً عند جميع القراء.
- **سبب التسمية:** ١- للزوم مده ٦ حركات عند جميع القراء. ٢- للزوم سببه وهو السكون الأصلي وصلاً ووقفاً.
- **حكمه:** لزوم مده ٦ حركات لجميع القراء، وعدم جواز القصر والتوسط.

## أقسام المد اللازم
- **مد لازم كلمي:** كلمي مثقل — كلمي مخفف.
- **مد لازم حرفي:** حرفي مثقل — حرفي مخفف.

## المد اللازم الكلمي المثقل
- **تعريفه:** هو أن يأتي حرف المد وبعده حرف ساكن سكوناً أصلياً مشدداً في كلمة.
- **أمثلة:** {الحاقّة} — {صوافّ} — {الضالّين} — {ءالذّكرين} — {ءاللّه}
>> **ملحوظة:** الحرف المشدد عبارة عن حرفين أولهما ساكن.
- **مقداره:** يمد ٦ حركات لزوماً عند جميع القراء.
- **حكمه:** لزوم مده ٦ حركات لجميع القراء، وعدم جواز القصر والتوسط.
- **سبب التسمية:** سمي لازماً للزوم مده ٦ حركات ولزوم سببه وهو السكون وصلاً ووقفاً، وسمي كلمياً لاجتماع حرف المد والسكون في كلمة، وسمي مثقلاً لأن الحرف الساكن مشدد.

## المد اللازم الكلمي المخفف
- **تعريفه:** هو أن يأتي حرف المد وبعده ساكن سكوناً أصلياً مخففاً.
- **موضعه:** في كلمة واحدة في موضعين ﴿ءَآلْـَٔنَ﴾ في سورة يونس [٥١، ٩١].
- **مقداره:** يمد ٦ حركات لزوماً لجميع القراء.
- **سبب التسمية:** سمي مخففاً لأن الحرف الساكن ليس مدغماً.

!! **تنبيه — صورة من صور المد اللازم: مد الفرق**
مد الفرق هو صورة من صور المد اللازم، وذلك في ٣ كلمات في ٦ مواضع فقط.
**الشرح:** عندما تدخل همزة القطع للاستفهام على همزة الوصل في الاسم المعرف بـ(أل) التعريف، فلا يجوز حذف همزة الوصل حتى لا يلتبس الاستفهام بالخبر، ولا يجوز النطق بالهمزتين معاً، ولكن يجوز لحفص وجهان:
1. إبدال همزة الوصل بألف مدية تمد ٦ حركات لزوماً، وذلك لملاقاتها لام التعريف الساكنة (مد لازم كلمي).
2. تسهيل همزة الوصل بين الهمزة والألف مع عدم المد مطلقاً.
? لماذا لقب بمد الفرق؟
= لأنه يفرق بين الاستفهام والخبر.

content:`## مقدمة
جرت عادة القراء عندما يصلون إلى هذا المبحث، وهو مبحث المد اللازم، أن يتعرضوا للحروف المتقطعة التي بدأ الله عز وجل بها بعض السور في القرآن الكريم، وتسمى هذه الأحرف بالأحرف النورانية، وعددها أربعة عشر حرفاً، وأتت في بداية تسع وعشرين سورة.
وقد جمعها الشيخ سليمان الجمزوري في منظومة تحفة الأطفال بقوله: [صله سحيراً من قطعك].
والأجمل من هذا من قال: [نص حكيم له سر قاطع]، أي أن هذه الأحرف ليست عبثاً. وهذا من التوفيق أنه جمع هذه الأحرف في هذه العبارة، فبعض الناس يسألون عن معنى هذه الحروف ولكن معناها عند الله.
قال تعالى: ﴿وَالرَّاسِخُونَ فِي الْعِلْمِ يَقُولُونَ آمَنَّا بِهِ كُلٌّ مِّنْ عِندِ رَبِّنَا﴾ (آل عمران ٧)
- هناك فرق بين نطق الحرف واسم الحرف. **مثال:** ق [اسمه قاف] و[نطقه أَقْ].
- وفي الأحرف المتقطعة نقرأ اسمها الذي يتكون دائماً إما من حرفين أو ثلاثة أحرف.

## تقسيم الأحرف المتقطعة من حيث المد
1. **الألف:** تقرأ (ألف) وليس بها مد.
2. **حي طهر:** تقرأ (حا — يا — طا — ها — را). في اللغة العربية وردت مهموزة وغير مهموزة [حاء أو حا]، أما في القرآن فقد وردت بترك الهمزة فقط، فهي عبارة عن حرفين ثانيهما حرف مد يمد حركتين، ويسمى مداً **طبيعياً حرفياً**.
3. **سنقص لكم:** تنطق على ثلاثة أحرف أوسطها حرف مد وثالثها ساكن أصلي، نحو [سين — نون — قاف]:
- إذا كان ثالثها ساكناً مخففاً ← مد لازم حرفي مخفف يمد ٦ حركات.
- إذا كان ثالثها ساكناً مشدداً ← مد لازم حرفي مثقل يمد ٦ حركات.
4. **العين:** تنطق على ثلاثة أحرف أوسطها حرف لين وثالثها ساكن أصلي، تمد [٤ أو ٦] حركات لحفص من الشاطبية، وتمد [٢ أو ٤ أو ٦] حركات لحفص من طيبة النشر.

## تعريف المد اللازم الحرفي المثقل
أن يأتي حرف المد وبعده ساكن أصلي مشدد ← **مقداره:** يمد ٦ حركات لزوماً.
## تعريف المد اللازم الحرفي المخفف
أن يأتي حرف المد وبعده ساكن أصلي مخفف ← **مقداره:** يمد ٦ حركات لزوماً.

? علمنا أن المد في (حي طهر) يسمى مداً طبيعياً حرفياً، وأن المد في (سنقص لكم) يسمى مداً لازماً حرفياً، فماذا يسمى المد في العين؟
= لكي نجيب على هذا السؤال لابد من معرفة وجه الشبه والاختلاف بين العين وكل من مد اللين والمد اللازم.

## أولاً: وجه الشبه والاختلاف بين العين والمد اللازم
- **وجه الشبه:** الحرف الأخير ساكن أصلي.
- **وجه الاختلاف:** ١- الحرف الممدود لين وليس مد. ٢- المد اللازم يمد ٦ حركات لزوماً، أما العين ففيها مد [٤ أو ٦] من الشاطبية، [٢، ٤، ٦] من طيبة النشر.

## ثانياً: وجه الشبه والاختلاف بين العين ومد اللين
- **وجه الشبه:** ١- الحرف الممدود حرف لين. ٢- عدد حركات اللين [٢ أو ٤ أو ٦] وعدد الحركات في العين من طيبة النشر [٢ أو ٤ أو ٦].
- **وجه الاختلاف:** الحرف الأخير ساكن أصلي وليس عارضاً.
وبذلك يكون المد في العين قريباً إلى مد اللين أكثر من المد اللازم، فيسمى **مد ملحق بمد اللين**.
>> **ملحوظة:** وبعضهم يسميه: مد اللين اللازم، والبعض يسميه: المد الحرفي الشبيه بالمثقل (فتح المجيد شرح كتاب العميد للشيخ محمود علي بسة).`,

content:`## مراتب المدود
للمدود مراتب خمسة متفاوتة تبعاً لقوتها وضعفها وهي:
1. المد اللازم.
2. المد المتصل.
3. المد العارض للسكون.
4. المد المنفصل.
5. مد البدل.
وجمعها الشيخ السمنودي في قوله:
~ أقوى المدود لازم فما اتصل || فعارض فذو انفصال فبدل

## السبب في هذا الترتيب
- **المد اللازم:** السكون أصلي — حرف المد والسكون في كلمة واحدة — لزوم مده ٦ حركات عند جميع القراء.
- **المتصل:** أصالة سببه وهو الهمز — حرف المد والهمز في كلمة واحدة — وجوب مده.
- **العارض:** حرف المد وسببه (الساكن) في كلمة واحدة — اختلاف مقدار مده (قصر وتوسط وإشباع).
- **المنفصل:** حرف المد والهمزة في كلمتين — مختلف في مقدار مده.
- **البدل:** السبب وهو الهمز متقدم على حرف المد — حرف المد مبدل عن الهمزة غالباً.

>> **ملحوظة:** لم يذكر مد اللين مع المراتب لأن الحرف الممدود حرف لين وليس حرف مد، ولكن يراعى أن العارض أقوى كما سبق ذكره.`,

  - لا يذكر في المراتب

function inline(s){
  let h = esc(s);
  h = h.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  h = h.replace(/﴿([^﴾]+)﴾/g, '<span class="ayah">﴿$1﴾</span>');
  h = h.replace(/\{([^}]+)\}/g, '<span class="ex">$1</span>');
  return h;
}
function renderContent(md){
  const lines = String(md||"").split("\n");
  let out = "", i = 0;
  function block(stopAtBlank){
    let h = "";
    while(i < lines.length){
      const raw = lines[i], L = raw.trim();
      if(!L){ if(stopAtBlank){ i++; return h; } i++; continue; }
      if(stopAtBlank && L.startsWith("## ")) return h;
      if(L.startsWith("## ")){ h += `<h3 class="sec">${inline(L.slice(3))}</h3>`; i++; continue; }
      if(L.startsWith("!! ") || L.startsWith(">> ")){
        const tip = L.startsWith("!!"); i++;
        const first = `<p>${inline(L.slice(3))}</p>`;
        const rest = block(true);
        h += `<div class="box ${tip?"tip":"nt"}"><div class="lbl">${tip?ICON.bulb+"تنبيه":ICON.pin+"ملحوظة"}</div>${first}${rest}</div>`;
        continue;
      }
      if(/^- /.test(L)){ let it=""; while(i<lines.length && /^- /.test(lines[i].trim())){ it += `<li>${inline(lines[i].trim().slice(2))}</li>`; i++; } h += `<ul>${it}</ul>`; continue; }
      if(/^\d+\.\s/.test(L)){ let it=""; while(i<lines.length && /^\d+\.\s/.test(lines[i].trim())){ it += `<li>${inline(lines[i].trim().replace(/^\d+\.\s/,""))}</li>`; i++; } h += `<ol>${it}</ol>`; continue; }
      if(L.startsWith("? ") || L.startsWith("= ")){ let it=""; while(i<lines.length && /^[?=] /.test(lines[i].trim())){ const t=lines[i].trim(); const q=t[0]==="?"; it += `<span class="k ${q?"":"a"}">${q?"س:":"ج:"}</span><span>${inline(t.slice(2))}</span>`; i++; } h += `<div class="qa">${it}</div>`; continue; }
      if(L.startsWith("~ ")){ let it=""; while(i<lines.length && lines[i].trim().startsWith("~ ")){ const [a,b] = lines[i].trim().slice(2).split("||"); it += `<span>${inline(a||"")}</span><span>${inline(b||"")}</span>`; i++; } h += `<div class="poem">${it}</div>`; continue; }
      if(L.startsWith("|")){
        const rows=[]; while(i<lines.length && lines[i].trim().startsWith("|")){ rows.push(lines[i].trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim())); i++; }
        const [hd,...bd] = rows;
        h += `<div class="tbl"><table><thead><tr>${hd.map(c=>`<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${bd.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
        continue;
      }
      h += `<p>${inline(L)}</p>`; i++;
    }
    return h;
  }
  out = block(false);
  return `<div class="ct">${out}</div>`;
}

function pwEntry(sid){
  const st=S.students.find(s=>s.id===sid); if(!st) return null;
  const base=Date.parse(st.resetAt||st.at||0)||0; let best=null;
  Object.values(S.pwch).forEach(doc=>{ const e=doc&&doc[sid]; if(e&&e.hash&&Date.parse(e.at)>base&&(!best||Date.parse(e.at)>Date.parse(best.at))) best=e; });
  return best;
}

const TY = {tf:"صح أم خطأ", mc:"اختيار من متعدد", fill:"أكملي الفراغ", w:"سؤال كتابي"};
function qState(lid){ return S.quizState[lid] || (S.quizState[lid]={ans:{},done:false}); }
function renderQuiz(L){
  const qs = L.quiz||[]; if(!qs.length) return `<p class="note">لا توجد أسئلة لهذا الدرس بعد.</p>`;
  const st = qState(L.id); let correct=0;
  const cards = qs.map((q,k)=>{
    const a = st.ans[k]; let ok=null, body="", fb="";
    if(st.done) ok = grade(q,a);
    if(ok) correct++;
    if(q.t==="tf"){
      body = `<div class="opts">${[true,false].map(v=>{ let c=a===v?"sel":""; if(st.done){ if(v===q.a) c="ok"; else if(a===v) c="bad"; } return `<button class="opt ${c}" data-act="ans" data-k="${k}" data-v="${v}" ${st.done?"disabled":""}><span class="bul"></span>${v?"صح":"خطأ"}</button>`; }).join("")}</div>`;
    } else if(q.t==="mc"){
      body = `<div class="opts">${q.o.map((o,j)=>{ let c=a===j?"sel":""; if(st.done){ if(j===q.a) c="ok"; else if(a===j) c="bad"; } return `<button class="opt ${c}" data-act="ans" data-k="${k}" data-v="${j}" ${st.done?"disabled":""}><span class="bul"></span>${inline(o)}</button>`; }).join("")}</div>`;
    } else {
      body = `<input class="inp fillin" data-fill="${k}" value="${esc(a||"")}" placeholder="اكتبي الإجابة هنا" ${st.done?"disabled":""}>`;
    }
    if(st.done){
      const right = q.t==="tf"?(q.a?"صح":"خطأ"):q.t==="mc"?q.o[q.a]:(Array.isArray(q.a)?q.a[0]:q.a);
      fb = ok ? `<div class="fb ok"><b>إجابة صحيحة.</b> ${q.ex?inline(q.ex):""}</div>` : `<div class="fb bad"><b>الإجابة الصحيحة:</b> ${inline(right)}${q.ex?` — ${inline(q.ex)}`:""}</div>`;
    }
    return `<div class="qc ${st.done?(ok?"ok":"bad"):""}"><div class="qh"><span class="qn">${toAr(k+1)}</span><span class="qt">${inline(q.q)}</span><span class="ty">${TY[q.t]}</span></div>${body}${fb}</div>`;
  }).join("");
  let foot;
  if(st.done){
    const total = qs.length, band = correct===total?5:correct>=total-1?4:correct>=Math.ceil(total/2)?3:0;
    const pct = correct/total, C = 2*Math.PI*40;
    foot = `<div class="score"><svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="50" cy="50" r="40" fill="none" stroke="var(--pink)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}" transform="rotate(-90 50 50)"/><text x="50" y="57" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink)" font-family="Tajawal">${toAr(correct)}/${toAr(total)}</text></svg>
      <div class="msg"><h4>درجتكِ ${toAr(correct)} من ${toAr(total)}</h4><p style="margin:4px 0 8px">${st.msg||""}</p><button class="btn sm" data-act="retry">أعيدي المحاولة</button></div></div>`;
  } else foot = `<div class="qfoot"><button class="btn pri" data-act="submit">صححي إجاباتي</button><span class="note" id="qwarn"></span></div>`;
  return `<div class="quiz">${cards}${foot}</div>`;
}
function grade(q,a){
  if(a===undefined||a===null||a==="") return false;
  if(q.t==="tf") return a===q.a;
  if(q.t==="mc") return a===q.a;
  const alts = (Array.isArray(q.a)?q.a:String(q.a).split("/")).map(norm);
  const n = norm(a), n2 = n.replace(/^ال/,"");
  return alts.some(x=>x===n || x.replace(/^ال/,"")===n2);
}
async function submitQuiz(){

  document.querySelectorAll("[data-fill]").forEach(el=>st.ans[+el.dataset.fill]=el.value);
  const missing = qs.filter((q,k)=>st.ans[k]===undefined||st.ans[k]==="").length;
  if(missing && !st.warned){ st.warned=true; const w=$("#qwarn"); if(w) w.textContent=`بقي ${toAr(missing)} سؤال بلا إجابة. اضغطي مرة أخرى للتصحيح على أي حال.`; return; }
  st.done=true; const score = qs.filter((q,k)=>grade(q,st.ans[k])).length, total=qs.length;
  const band = score===total?5:score>=total-1?4:score>=Math.ceil(total/2)?3:0; st.msg = pick(motiveFor(band));
  renderDeck(); document.getElementById("b-quiz").scrollIntoView({behavior:"smooth",block:"start"});
  if(!S.session||S.session.role==="student") saveResult(L,score,total,qs.map((q,k)=>grade(q,st.ans[k])?null:k).filter(x=>x!==null));

async function saveResult(L,score,total,wrong){
  const rec = {sid:S.session?S.session.sid:"guest", name:S.session?S.session.name:"", lesson:L.id, title:L.title, score, total, wrong, at:new Date().toISOString()};
  S.myRes[L.id]=rec;
  if(!S.session){ store.set("tj_guest",S.myRes); return; }
  if(!S.db||!S.uid) return;
  const key = S.session.sid+"__"+L.id, ref = S.db.doc("results/"+S.uid);
  try{ const d = await ref.get(); if(d.exists) await ref.update({[key]:rec}); else await ref.set({[key]:rec}); toast("حُفظت درجتكِ وأُرسلت للمعلمة"); }
  catch(e){ toast("لم تُحفظ الدرجة: حسابكِ لا يملك صلاحية الحفظ. أخبري المعلمة."); }
}

async function patchLesson(id,patch){

async function moveLesson(id,d){
  const ls=lessons(), i=ls.findIndex(l=>l.id===id), j=i+d; if(i<0||j<0||j>=ls.length) return;

function readQEditors(){
  document.querySelectorAll(".qed").forEach(box=>{
    const kind=box.dataset.kind, k=+box.dataset.k, list = kind==="quiz"?ED.L.quiz:ED.tq, q=list[k];
    q.q = box.querySelector('[data-f="q"]').value;
    const ex = box.querySelector('[data-f="ex"]'); if(ex) q.ex = ex.value;
    if(q.t==="tf") q.a = box.querySelector('[data-f="a"]').value==="true";
    if(q.t==="mc"){ q.o=[...box.querySelectorAll('[data-f="o"]')].map(x=>x.value); const r=box.querySelector('[data-f="a"]:checked'); q.a = r?+r.value:0; }
    if(q.t==="fill") q.a = box.querySelector('[data-f="a"]').value.split("/").map(s=>s.trim()).filter(Boolean);
    if(q.t==="w") q.a = box.querySelector('[data-f="a"]').value;
  });
}

}

/* ============ A5 sheet (canvas → PDF) ============ */
const SW=1240, SH=1760;
function wrapText(ctx, text, maxW){
  const words=String(text).split(/\s+/); const lines=[]; let cur="";
  words.forEach(w=>{ const t=cur?cur+" "+w:w; if(ctx.measureText(t).width>maxW && cur){ lines.push(cur); cur=w; } else cur=t; });
  if(cur) lines.push(cur); return lines;
}
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function strip(s){ return String(s||"").replace(/\*\*/g,"").replace(/[{}]/g,""); }
async function drawSheet(L, items, studentName, motive){
  await Promise.all(['800 40px "Noto Kufi Arabic"','700 40px "Tajawal"','400 40px "Tajawal"'].map(f=>document.fonts.load(f).catch(()=>{})));
  const cv=document.createElement("canvas"); cv.width=SW; cv.height=SH; const c=cv.getContext("2d"); c.direction="rtl";
  const KUFI='"Noto Kufi Arabic", "Tajawal", sans-serif', TAJ='"Tajawal", sans-serif';
  // background
  const bg=c.createLinearGradient(0,0,SW,SH); bg.addColorStop(0,"#fff5fa"); bg.addColorStop(1,"#f5efff"); c.fillStyle=bg; c.fillRect(0,0,SW,SH);
  c.globalAlpha=.35; c.fillStyle="#f8c9df"; c.beginPath(); c.arc(SW-40,60,170,0,7); c.fill(); c.fillStyle="#dcc9fa"; c.beginPath(); c.arc(30,SH-50,200,0,7); c.fill(); c.globalAlpha=1;
  const gr=c.createLinearGradient(0,0,SW,0); gr.addColorStop(0,SITE.c2||"#9b6ee0"); gr.addColorStop(1,SITE.c1||"#f07bb0");
  c.lineWidth=6; c.strokeStyle=gr; rr(c,40,40,SW-80,SH-80,48); c.stroke();
  c.lineWidth=2; c.strokeStyle="#ecc3dc"; rr(c,58,58,SW-116,SH-116,38); c.stroke();
  // header band
  c.fillStyle=gr; rr(c,90,90,SW-180,200,34); c.fill();
  c.fillStyle="rgba(255,255,255,.85)"; c.font=`700 30px ${TAJ}`; c.textAlign="center"; c.fillText(SITE.sheetT||"",SW/2,140);
  c.fillStyle="#fff"; c.font=`800 46px ${KUFI}`; let tl=wrapText(c,strip(L.title),SW-260); if(tl.length>2){ c.font=`800 38px ${KUFI}`; tl=wrapText(c,strip(L.title),SW-260); }
  tl.slice(0,2).forEach((ln,k)=>c.fillText(ln,SW/2,205+k*54-(tl.length>1?22:0)));
  // name row
  c.textAlign="right"; c.fillStyle="#3b2342"; c.font=`700 34px ${TAJ}`;
  c.fillText("اسم الطالبة:",SW-110,370);
  if(studentName){ c.fillStyle=SITE.c2||"#8a55d6"; c.font=`800 36px ${KUFI}`; c.fillText(studentName,SW-320,370); }
  else { c.strokeStyle="#c9a9d6"; c.setLineDash([6,8]); c.lineWidth=2; c.beginPath(); c.moveTo(SW-320,378); c.lineTo(520,378); c.stroke(); c.setLineDash([]); }
  c.fillStyle="#3b2342"; c.font=`700 34px ${TAJ}`; c.textAlign="left"; c.fillText(`الدرجة:  ____ / ${toAr(items.length)}`,110,370);
  // questions
  const top=430, bottom=SH-260, maxW=SW-300, xR=SW-110;
  let fs=34; let layout;
  const plan=(fs)=>{ c.font=`700 ${fs}px ${TAJ}`; let y=top; const L2=[];
    items.forEach((q,k)=>{ const qt=wrapText(c,strip(q.q),maxW); const h0=qt.length*fs*1.55; let extra=0;
      if(q.t==="mc") extra = Math.ceil(q.o.length/2)*fs*1.7+10; else if(q.t==="tf") extra=fs*1.9; else extra = (q.t==="w"?3:1)*fs*1.9+10;
      L2.push({q,qt,y,h0}); y+=h0+extra+fs*1.1; });
    return {L2,end:y}; };
  while(true){ layout=plan(fs); if(layout.end<=bottom||fs<=22) break; fs-=2; }
  layout.L2.forEach(({q,qt,y,h0},k)=>{
    // number bubble
    c.fillStyle=gr; c.beginPath(); c.arc(xR-22,y+fs*.55,26,0,7); c.fill();
    c.fillStyle="#fff"; c.font=`800 28px ${KUFI}`; c.textAlign="center"; c.fillText(toAr(k+1),xR-22,y+fs*.55+10);
    c.textAlign="right"; c.fillStyle="#3b2342"; c.font=`700 ${fs}px ${TAJ}`;
    qt.forEach((ln,j)=>c.fillText(ln,xR-66,y+fs+j*fs*1.55));
    let yy=y+h0+fs*.6;
    c.font=`500 ${fs-2}px ${TAJ}`;
    if(q.t==="mc"){ const colW=(maxW)/2; q.o.forEach((o,j)=>{ const col=j%2, row=Math.floor(j/2); const x=xR-66-col*colW, yv=yy+row*fs*1.7+fs*.4;
        c.strokeStyle="#b48ae6"; c.lineWidth=3; c.beginPath(); c.arc(x-14,yv-fs*.32,13,0,7); c.stroke();
        c.fillStyle="#8a55d6"; c.font=`800 ${fs-6}px ${KUFI}`; c.fillText("أبجد"[j]||"",x-40,yv);
        c.fillStyle="#3b2342"; c.font=`500 ${fs-2}px ${TAJ}`; c.fillText(strip(o),x-80,yv); }); }
    else if(q.t==="tf"){ c.fillStyle="#3b2342"; c.fillText("صح (     )          خطأ (     )",xR-66,yy+fs*.6); }
    else { c.strokeStyle="#d6b6e6"; c.setLineDash([4,9]); c.lineWidth=2; const n=q.t==="w"?3:1; for(let r=0;r<n;r++){ const ly=yy+fs*.7+r*fs*1.9; c.beginPath(); c.moveTo(xR-66,ly); c.lineTo(150,ly); c.stroke(); } c.setLineDash([]); }
  });
  // footer
  c.fillStyle="rgba(255,255,255,.75)"; rr(c,90,SH-230,SW-180,140,30); c.fill(); c.lineWidth=3; c.strokeStyle=gr; rr(c,90,SH-230,SW-180,140,30); c.stroke();
  c.textAlign="right"; c.fillStyle="#8a55d6"; c.font=`800 44px ${KUFI}`; c.fillText(SITE.teacher||"",SW-130,SH-145);
  c.textAlign="left"; c.fillStyle="#d6408c"; c.font=`700 32px ${TAJ}`; c.fillText(String(motive).replace(/[«»]/g,''),130,SH-145);
  return cv;
}
function pdfFromJpegs(pages){ // pages: [{bytes:Uint8Array,w,h}]
  const enc=new TextEncoder(); const parts=[]; let len=0; const offs=[];
  const push=x=>{ const b=typeof x==="string"?enc.encode(x):x; parts.push(b); len+=b.length; };
  const PW=419.53, PH=595.28; const n=pages.length; const objCount=2+n*3;
  push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  const obj=(id,body)=>{ offs[id]=len; push(`${id} 0 obj\n`); body(); push("\nendobj\n"); };
  obj(1,()=>push("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2,()=>push(`<< /Type /Pages /Count ${n} /Kids [${pages.map((p,i)=>`${3+i*3} 0 R`).join(" ")}] >>`));
  pages.forEach((p,i)=>{ const pid=3+i*3, cid=pid+1, iid=pid+2;
    obj(pid,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im${i} ${iid} 0 R >> >> /Contents ${cid} 0 R >>`));
    const cs=`q ${PW} 0 0 ${PH} 0 0 cm /Im${i} Do Q`;
    obj(cid,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(iid,()=>{ push(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.bytes.length} >>\nstream\n`); push(p.bytes); push("\nendstream"); });
  });
  const xref=len; push(`xref\n0 ${objCount+1}\n0000000000 65535 f \n`);
  for(let i=1;i<=objCount;i++) push(String(offs[i]).padStart(10,"0")+" 00000 n \n");
  push(`trailer\n<< /Size ${objCount+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:"application/pdf"});
}
function canvasJpeg(cv){ const d=cv.toDataURL("image/jpeg",.92).split(",")[1]; const bin=atob(d); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return {bytes:u,w:cv.width,h:cv.height}; }
let PR=null;

  const L=lessons()[S.idx]; const items=tqItems(L);

    <div class="field"><label for="prMot">العبارة التحفيزية</label><select class="inp" id="prMot">${sheetMotives().map(m=>`<option ${m===PR.motive?"selected":""}>${esc(m)}</option>`).join("")}</select></div>
    <p class="note" id="prMsg">ألوان الورقة باستيل وردي وبنفسجي، جاهزة للطباعة الملونة على مقاس A5.</p>
  </div><div class="sheetprev" id="prPrev"><div class="loading">جارٍ تجهيز المعاينة…</div></div></div></div>`);
  $("#prWho").addEventListener("change",e=>{PR.who=e.target.value; drawPrint();});
  $("#prMot").addEventListener("change",e=>{PR.motive=e.target.value; drawPrint();});
  document.querySelectorAll("[data-prq]").forEach(cb=>cb.addEventListener("change",()=>{PR.sel[+cb.dataset.prq]=cb.checked; drawPrint();}));
  const chosen=items.filter((_,k)=>PR.sel[k]); if(!chosen.length){ $("#prPrev").innerHTML='<p class="note">اختاري سؤالاً واحداً على الأقل.</p>'; return; }
  const name = PR.who==="blank"?"":PR.who==="all"?(studs[0]||{}).name||"":(studs.find(s=>s.id===PR.who)||{}).name||"";
  const cv=await drawSheet(L,chosen,name,PR.motive); const p=$("#prPrev"); if(p) p.innerHTML=`<img alt="معاينة ورقة الاختبار" src="${cv.toDataURL("image/png")}">`;

async function downloadPdf(){
  const {L}=PR, items=tqItems(L).filter((_,k)=>PR.sel[k]); if(!items.length) return toast("اختاري سؤالاً واحداً على الأقل");
  const studs=S.students.slice().sort((a,b)=>a.name.localeCompare(b.name,"ar"));
  const names = PR.who==="blank"?[""]:PR.who==="all"?studs.map(s=>s.name):[(studs.find(s=>s.id===PR.who)||{}).name||""];
  const msg=$("#prMsg"); if(msg) msg.textContent="جارٍ إنشاء الملف…";
  const pages=[]; for(const n of names) pages.push(canvasJpeg(await drawSheet(L,items,n,PR.motive)));
  const blob=pdfFromJpegs(pages);
  if(!S.dl){ if(msg) msg.textContent="التحميل غير متاح في هذه النافذة. افتحي الموقع داخل Claude لتحميل الملف."; return; }
  try{ await S.dl.save({filename:`اختبار ${strip(L.title).replace(/[\\/:*?"<>|]/g,"").slice(0,60)}.pdf`, data:blob}); if(msg) msg.textContent="تم تجهيز الملف للتحميل."; }
  catch(e){ if(msg) msg.textContent = e&&e.code==="declined" ? "أُلغي التحميل." : "تعذر التحميل في هذه النافذة."; }
}
